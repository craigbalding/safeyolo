name: Native test inputs

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      profile:
        required: true
        type: string
      architecture:
        default: amd64
        type: string
      host_inputs:
        default: true
        type: boolean
      retain_packages:
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      CARGO_BUILD_JOBS: "1"
      SAFEYOLO_BUILD_REVISION: ${{ inputs.revision }}
      SAFEYOLO_BUILD_PROFILE: ${{ inputs.profile }}
      SAFEYOLO_CARGO_RESERVE_GIB: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - name: Install uv for the existing source-binding check
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true
      - name: Check acceptance tool source bindings before compilation
        run: |
          uv export --frozen --only-group dev --no-emit-workspace --format requirements-txt --output-file "$RUNNER_TEMP/source-bindings.txt" > /dev/null
          uv venv --python 3.12 .venv-source-bindings
          .venv-source-bindings/bin/python - "$RUNNER_TEMP/source-bindings.txt" <<'PY'
          import runpy
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text())
          requirements = [f"{package['name']}=={package['version']}" for package in lock["package"]
                          if package["name"] in ("pytest", "pyyaml")]
          subprocess.run(["uv", "pip", "install", "--python", sys.executable, "--require-hashes",
                          "--constraint", sys.argv[1], *requirements], check=True)
          runpy.run_path("cli/tests/test_host_setup_scripts.py")["test_safeyolo_acceptance_graph_tool_hashes_match_sources"]()
          PY
      - name: Install the pinned Rust toolchain
        working-directory: proxy
        run: |
          rustup show active-toolchain
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: bash "${{ github.workspace }}/scripts/rust_cache_command.sh" {0}
          workspaces: |
            proxy -> target
            guest/command -> target
          shared-key: ${{ inputs.profile }}-focused-pr
          cache-bin: false
      - name: Reuse matching Linux guest inputs
        id: reuse_guest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PLATFORM: linux-${{ inputs.architecture }}
          REQUIRE_SUCCESSFUL_RUN: ${{ inputs.retain_packages && inputs.profile == 'production' }}
        run: |
          qualification=()
          if [[ "$REQUIRE_SUCCESSFUL_RUN" == true ]]; then qualification+=(--require-successful-run); fi
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          python3 scripts/select_blackbox_artifacts.py --native-input guest \
            --platform "$INPUT_PLATFORM" --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
            --branch "$DEFAULT_BRANCH" --output "guest/command/target/$directory" "${qualification[@]}"
      - name: Build Linux guest executables and receipts
        if: steps.reuse_guest.outputs.reused != 'true'
        run: scripts/build_guest_command.sh
      - name: Check Linux guest input identity
        shell: bash
        run: |
          source scripts/native_package.sh
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          for binary in safeyolo-guest safeyolo-coord; do
            helper="guest/command/target/$directory/$binary"
            native_executable "$helper" "$(host_platform)"
            [[ $("$helper" --version) == "$binary "*" commit=$SAFEYOLO_BUILD_REVISION profile=$SAFEYOLO_BUILD_PROFILE" ]]
            [[ $("$helper" --version) == "$(cat "$helper.version")" ]]
            [[ $(file_sha256 "$helper") == "$(cat "$helper.sha256")" ]]
          done
      - name: Reuse matching Linux host inputs
        id: reuse_host
        if: inputs.host_inputs && (inputs.architecture == 'amd64' || inputs.retain_packages)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PLATFORM: linux-${{ inputs.architecture }}
          REQUIRE_SUCCESSFUL_RUN: ${{ inputs.retain_packages && inputs.profile == 'production' }}
        run: |
          qualification=()
          if [[ "$REQUIRE_SUCCESSFUL_RUN" == true ]]; then qualification+=(--require-successful-run); fi
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          python3 scripts/select_blackbox_artifacts.py --native-input host \
            --platform "$INPUT_PLATFORM" --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
            --branch "$DEFAULT_BRANCH" --output "proxy/target/$directory" "${qualification[@]}"
      - name: Build Linux host test inputs
        if: inputs.host_inputs && (inputs.architecture == 'amd64' || inputs.retain_packages) && steps.reuse_host.outputs.reused != 'true'
        run: |
          options=()
          if [ "$SAFEYOLO_BUILD_PROFILE" = production ]; then options+=(--release); fi
          scripts/cargo_with_space.sh build --manifest-path proxy/Cargo.toml --locked --bin safeyolo --bin safeyolo-coord --bin safeyolo-proxy "${options[@]}"
          source scripts/native_package.sh
          directory=debug
          if [ "$SAFEYOLO_BUILD_PROFILE" = production ]; then directory=release; fi
          verify_native_artifacts "proxy/target/$directory" "guest/command/target/$directory" "$SAFEYOLO_BUILD_PROFILE" "$(host_platform)"
      - name: Verify reused Linux host test inputs
        if: steps.reuse_host.outputs.reused == 'true'
        shell: bash
        run: |
          source scripts/native_package.sh
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          verify_native_artifacts "proxy/target/$directory" "guest/command/target/$directory" "$SAFEYOLO_BUILD_PROFILE" "$(host_platform)"
      - name: Record fresh Linux input receipts
        shell: bash
        env:
          REUSED_GUEST: ${{ steps.reuse_guest.outputs.reused }}
          REUSED_HOST: ${{ steps.reuse_host.outputs.reused }}
          HOST_INPUTS: ${{ inputs.host_inputs && (inputs.architecture == 'amd64' || inputs.retain_packages) }}
        run: |
          source scripts/native_package.sh
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          if [[ "$REUSED_GUEST" != true ]]; then
            python3 scripts/select_blackbox_artifacts.py --native-input guest --save-native-input \
              --platform "$(host_platform)" --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
              --output "guest/command/target/$directory"
          fi
          if [[ "$HOST_INPUTS" == true && "$REUSED_HOST" != true ]]; then
            python3 scripts/select_blackbox_artifacts.py --native-input host --save-native-input \
              --platform "$(host_platform)" --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
              --output "proxy/target/$directory"
          fi
      - name: Upload Linux host test inputs
        if: inputs.host_inputs && (inputs.architecture == 'amd64' || inputs.retain_packages)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-host-${{ inputs.architecture }}-${{ inputs.profile }}
          path: |
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-coord
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-proxy
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/native-input.json
          if-no-files-found: error

      - name: Build Linux guest terminal input
        if: inputs.architecture == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu
          make -C vm guest-tools
          sudo .venv-source-bindings/bin/python -m pytest -q -rs tests/test_vsock_term.py
          mkdir -p "$RUNNER_TEMP/guest-terminal"
          install -m 0755 vm/.build/release/vsock-term "$RUNNER_TEMP/guest-terminal/vsock-term"
          printf 'vsock-term commit=%s\n' "$SAFEYOLO_BUILD_REVISION" > "$RUNNER_TEMP/guest-terminal/vsock-term.version"
          sha256sum "$RUNNER_TEMP/guest-terminal/vsock-term" | awk '{print $1}' > "$RUNNER_TEMP/guest-terminal/vsock-term.sha256"
      - name: Upload Linux guest terminal input
        if: inputs.architecture == 'arm64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-guest-terminal-arm64-${{ inputs.profile }}
          path: ${{ runner.temp }}/guest-terminal
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-guest-${{ inputs.architecture }}-${{ inputs.profile }}
          path: |
            guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-guest
            guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-guest.version
            guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-guest.sha256
            guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-coord
            guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-coord.version
            guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-coord.sha256
            guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/native-input.json
          if-no-files-found: error
      - name: Retain complete Linux production bundle
        if: inputs.retain_packages && inputs.profile == 'production'
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq --no-install-recommends tmux
          scripts/build_host_packages.sh --output "$RUNNER_TEMP/host-package" \
            --artifacts proxy/target/release --guest-artifacts guest/command/target/release \
            --runtime-artifacts "$(dirname "$(command -v tmux)")" --profile production
          python3 scripts/build_host_packages.py save-production --output "$RUNNER_TEMP/host-package"
      - name: Upload complete Linux production bundle
        if: inputs.retain_packages && inputs.profile == 'production'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-host-linux-${{ inputs.architecture }}-production
          path: |
            ${{ runner.temp }}/host-package/*.tar.gz
            ${{ runner.temp }}/host-package/SHA256SUMS
            ${{ runner.temp }}/host-package/build.json
          overwrite: true
          retention-days: 30
          if-no-files-found: error

  macos-host:
    if: inputs.host_inputs && inputs.architecture == 'arm64'
    needs: build
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: "1"
      SAFEYOLO_BUILD_REVISION: ${{ inputs.revision }}
      SAFEYOLO_BUILD_PROFILE: ${{ inputs.profile }}
      SAFEYOLO_CARGO_RESERVE_GIB: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - name: Install the pinned Rust toolchain
        working-directory: proxy
        run: |
          rustup show active-toolchain
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: bash "${{ github.workspace }}/scripts/rust_cache_command.sh" {0}
          workspaces: |
            proxy -> target
            guest/command -> target
          shared-key: ${{ inputs.profile }}-focused-pr
          cache-bin: false
      - name: Reuse matching Mac host inputs
        id: reuse_host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUIRE_SUCCESSFUL_RUN: ${{ inputs.retain_packages && inputs.profile == 'production' }}
        run: |
          qualification=()
          if [[ "$REQUIRE_SUCCESSFUL_RUN" == true ]]; then qualification+=(--require-successful-run); fi
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          python3 scripts/select_blackbox_artifacts.py --native-input host \
            --platform darwin-arm64 --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
            --branch "$DEFAULT_BRANCH" --output "proxy/target/$directory" "${qualification[@]}"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-guest-arm64-${{ inputs.profile }}
          path: guest/command/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}
      - name: Build and check Mac host test inputs
        if: steps.reuse_host.outputs.reused != 'true'
        env:
          SAFEYOLO_BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          options=() directory=debug
          if [ "$SAFEYOLO_BUILD_PROFILE" = production ]; then options+=(--release); directory=release; fi
          chmod +x "guest/command/target/$directory/safeyolo-guest" "guest/command/target/$directory/safeyolo-coord"
          scripts/cargo_with_space.sh build --manifest-path proxy/Cargo.toml --locked --bin safeyolo --bin safeyolo-coord --bin safeyolo-proxy "${options[@]}"
          source scripts/native_package.sh
          verify_native_artifacts "proxy/target/$directory" "guest/command/target/$directory" "$SAFEYOLO_BUILD_PROFILE" "$(host_platform)"
      - name: Verify reused Mac host test inputs
        if: steps.reuse_host.outputs.reused == 'true'
        shell: bash
        run: |
          source scripts/native_package.sh
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          chmod +x "guest/command/target/$directory/safeyolo-guest" "guest/command/target/$directory/safeyolo-coord"
          verify_native_artifacts "proxy/target/$directory" "guest/command/target/$directory" "$SAFEYOLO_BUILD_PROFILE" "$(host_platform)"
      - name: Record fresh Mac input receipt
        if: steps.reuse_host.outputs.reused != 'true'
        shell: bash
        run: |
          directory=debug
          if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then directory=release; fi
          python3 scripts/select_blackbox_artifacts.py --native-input host --save-native-input \
            --platform darwin-arm64 --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
            --output "proxy/target/$directory"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: darwin-host-arm64-${{ inputs.profile }}
          path: |
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-coord
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/safeyolo-proxy
            proxy/target/${{ inputs.profile == 'production' && 'release' || 'debug' }}/native-input.json
          if-no-files-found: error
      - name: Download matching guest terminal for the production bundle
        if: inputs.retain_packages && inputs.profile == 'production'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-guest-terminal-arm64-production
          path: ${{ runner.temp }}/host-vm
      - name: Retain complete macOS production bundle
        if: inputs.retain_packages && inputs.profile == 'production'
        run: |
          brew install tmux
          chmod +x "$RUNNER_TEMP/host-vm/vsock-term"
          make -C vm PROFILE=production install-helper INSTALL_DIR="$RUNNER_TEMP/host-vm"
          scripts/build_host_packages.sh --output "$RUNNER_TEMP/host-package" \
            --artifacts proxy/target/release --guest-artifacts guest/command/target/release \
            --runtime-artifacts "$(dirname "$(command -v tmux)")" \
            --vm-artifacts "$RUNNER_TEMP/host-vm" --profile production
          python3 scripts/build_host_packages.py save-production --output "$RUNNER_TEMP/host-package"
      - name: Upload complete macOS production bundle
        if: inputs.retain_packages && inputs.profile == 'production'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nightly-host-darwin-arm64-production
          path: |
            ${{ runner.temp }}/host-package/*.tar.gz
            ${{ runner.temp }}/host-package/SHA256SUMS
            ${{ runner.temp }}/host-package/build.json
          overwrite: true
          retention-days: 30
          if-no-files-found: error
