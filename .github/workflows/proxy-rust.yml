name: Native proxy contracts

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "cli/src/safeyolo/rust_proxy.py"
      - "cli/tests/test_rust_proxy.py"
      - "proxy/**"
      - "tests/proxy_contracts/**"
      - "tests/blackbox/proxy_backend.py"
      - "tests/blackbox/run-tests.sh"
      - "tests/test_blackbox_harness.py"
      - "tests/test_proxy_rust_coord_fixture.py"
      - "tests/test_proxy_rust_ci_events.py"
      - "tests/test_proxy_cutover_deletion_map.py"
      - "tests/blackbox/sinkhole/server.py"
      - "tests/test_blackbox_sinkhole.py"
      - "tests/test_workflow_action_pins.py"
      - "cli/src/safeyolo/desktop_presenter*.py"
      - "cli/src/safeyolo/preview.py"
      - "cli/src/safeyolo/vm*.py"
      - "cli/src/safeyolo/platform/**"
      - "cli/tests/test_linux_platform*.py"
      - "cli/tests/test_darwin_platform.py"
      - "cli/src/safeyolo/runtime_identity.py"
      - "vm/**"
      - "cli/tests/test_agent_preview.py"
      - "cli/tests/test_desktop_presenter*.py"
      - ".github/workflows/proxy-rust.yml"
      - "scripts/cargo_with_space.sh"
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A feature PR's ready transition has no job; keep its in-flight focused check.
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}

jobs:
  focused-pr:
    name: Quick native checks (Ubuntu)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'ready_for_review')
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    outputs:
      macos: ${{ steps.changes.outputs.macos }}
      linux: ${{ steps.changes.outputs.linux }}
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify the exact pull-request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test -n "$EXPECTED_HEAD" && test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Select relevant native and platform checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-paths"
          if rg -q '^proxy/' "$RUNNER_TEMP/changed-paths"; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(vm/|proxy/src/(host_platform|desktop_|provider_stream)|cli/src/safeyolo/(vm|runtime_identity|desktop|preview|platform/(darwin|__init__))|cli/tests/test_darwin_platform)' "$RUNNER_TEMP/changed-paths"; then
            echo 'macos=true' >> "$GITHUB_OUTPUT"
          fi
          if rg -q '^(proxy/src/(host_platform|desktop_|provider_stream)|cli/src/safeyolo/(vm|runtime_identity|platform/(linux|__init__))|cli/tests/test_linux_platform)' "$RUNNER_TEMP/changed-paths"; then
            echo 'linux=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install the pinned Rust toolchain
        if: steps.changes.outputs.rust == 'true'
        working-directory: proxy
        run: rustup show active-toolchain

      - name: Check Rust formatting and lint
        if: steps.changes.outputs.rust == 'true'
        working-directory: proxy
        run: |
          ../scripts/cargo_with_space.sh fmt --all -- --check
          ../scripts/cargo_with_space.sh clippy --locked --all-targets -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          prune-cache: true

      - name: Install the native CLI test environment
        run: |
          uv python install 3.12
          uv sync --frozen --group dev --python 3.12

      - name: Install preview test system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends socat

      - name: Test workflow, fixture, deletion, and blackbox runner boundaries
        run: |
          uv run --frozen pytest -q \
            cli/tests/test_rust_proxy.py \
            cli/tests/test_sockets.py \
            tests/test_blackbox_harness.py \
            tests/proxy_contracts/test_readiness.py \
            tests/test_proxy_rust_coord_fixture.py \
            tests/test_proxy_rust_ci_events.py \
            tests/test_proxy_cutover_deletion_map.py \
            tests/test_blackbox_sinkhole.py::test_sinkhole_head_has_get_headers_no_body_and_control_observation \
            tests/test_workflow_action_pins.py

      - name: Test desktop presentation and preview
        run: |
          uv run --frozen pytest -q \
            cli/tests/test_desktop_presenter.py \
            cli/tests/test_agent_preview.py

      - name: Test changed Linux platform boundaries
        if: steps.changes.outputs.linux == 'true'
        run: |
          uv run --frozen pytest -q cli/tests/test_linux_platform_selection.py \
            cli/tests/test_linux_platform_oci.py

      - name: Test focused native boundaries
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        working-directory: proxy
        run: |
          ../scripts/cargo_with_space.sh test --locked --test agent_api_audit
          ../scripts/cargo_with_space.sh test --locked --test tls existing_rsa_ca_formats_survive_native_import_and_restart -- --exact
          ../scripts/cargo_with_space.sh test --locked --test gateway_workflow oauth_refresh_reaches_origin_once_and_shared_flight_reuses_token -- --exact

  contracts:
    name: Overnight native contracts (${{ matrix.os }})
    env:
      CARGO_BUILD_JOBS: "1"
    # Full regression is overnight or a trusted explicit request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the event's exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test -n "$EXPECTED_HEAD" && test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install the pinned Rust toolchain
        working-directory: proxy
        run: rustup show active-toolchain

      - name: Check Rust formatting and lint
        working-directory: proxy
        run: |
          ../scripts/cargo_with_space.sh fmt --all -- --check
          ../scripts/cargo_with_space.sh clippy --locked --all-targets -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          prune-cache: true

      - name: Install the native CLI test environment
        run: |
          uv python install 3.12.14
          uv sync --frozen --group dev --python 3.12.14

      - name: Install native desktop test dependency
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends socat

      - name: Start the Python-owned Coord fixture
        env:
          SAFEYOLO_COORD_DATA_DIR: ${{ runner.temp }}/safeyolo-coord-fixture
          SAFEYOLO_NATS_TEST_INSTANCE: proxy-rust-fixture
        run: |
          fixture_root="$SAFEYOLO_COORD_DATA_DIR"
          fixture_ready="$fixture_root/fixture.ready"
          fixture_log="$RUNNER_TEMP/safeyolo-coord-fixture.log"
          test ! -e "$fixture_root" || {
            echo "Coord fixture path already exists: $fixture_root" >&2
            exit 1
          }
          uv run --frozen python proxy/tests/coord_fixture.py \
            --ready-file "$fixture_ready" > "$fixture_log" 2>&1 &
          fixture_pid=$!
          for attempt in $(seq 1 100); do
            if test -f "$fixture_ready"; then
              exit 0
            fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              teardown_status=0
              uv run --frozen python proxy/tests/coord_fixture.py --teardown || teardown_status=$?
              cat "$fixture_log"
              if test "$teardown_status" -ne 0; then
                echo "Coord fixture teardown failed after startup failure" >&2
              fi
              exit 1
            fi
            sleep 0.1
          done
          teardown_status=0
          uv run --frozen python proxy/tests/coord_fixture.py --teardown || teardown_status=$?
          cat "$fixture_log"
          if test "$teardown_status" -ne 0; then
            echo "Coord fixture teardown failed after startup timeout" >&2
          fi
          exit 1

      - name: Test and build the Rust proxy
        timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 10 }}
        working-directory: proxy
        env:
          SAFEYOLO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          export SAFEYOLO_PROXY_COORD_DATA_DIR="$RUNNER_TEMP/safeyolo-coord-fixture"
          export SAFEYOLO_PROXY_NATS_TEST_INSTANCE=proxy-rust-fixture
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host_target"
          runner_target="$(printf '%s' "$host_target" | tr '[:lower:]-' '[:upper:]_')"
          runner_variable="CARGO_TARGET_${runner_target}_RUNNER"
          export CARGO_BUILD_TARGET="$host_target"
          export "$runner_variable=$GITHUB_WORKSPACE/proxy/tests/coord_test_runner.sh"
          ../scripts/cargo_with_space.sh test --locked
          ../scripts/cargo_with_space.sh build --locked
          rust_proxy="$GITHUB_WORKSPACE/proxy/target/$host_target/debug/safeyolo-proxy"
          test -x "$rust_proxy"
          printf 'SAFEYOLO_RUST_PROXY=%s\n' "$rust_proxy" >> "$GITHUB_ENV"

      - name: Stop the Python-owned Coord fixture
        if: always()
        env:
          SAFEYOLO_COORD_DATA_DIR: ${{ runner.temp }}/safeyolo-coord-fixture
          SAFEYOLO_NATS_TEST_INSTANCE: proxy-rust-fixture
        run: |
          fixture_log="$RUNNER_TEMP/safeyolo-coord-fixture.log"
          fixture_stopped="$SAFEYOLO_COORD_DATA_DIR/fixture.stopped"
          if test ! -e "$SAFEYOLO_COORD_DATA_DIR"; then
            exit 0
          fi
          uv run --frozen python proxy/tests/coord_fixture.py --teardown
          for attempt in $(seq 1 100); do
            if test -f "$fixture_stopped"; then
              cat "$fixture_log"
              exit 0
            fi
            sleep 0.1
          done
          cat "$fixture_log"
          echo "Coord fixture did not finish its ownership-verified teardown" >&2
          exit 1

      - name: Provide the macOS owned HTTP peer address
        if: matrix.os == 'macos-latest'
        run: |
          sudo -n /sbin/ifconfig lo0 alias 127.0.0.2
          /sbin/ifconfig lo0 | grep -F '127.0.0.2'

      - name: Run native proxy component contracts
        env:
          PYTEST_ADDOPTS: ${{ matrix.os == 'macos-latest' && '--basetemp=/tmp/sy-rs' || '' }}
        run: uv run --frozen pytest -q tests/proxy_contracts --proxy-backend rust

  macos-pr:
    name: Relevant macOS platform checks
    needs: focused-pr
    if: needs.focused-pr.outputs.macos == 'true'
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          prune-cache: true
      - name: Prepare platform test dependencies
        run: uv sync --frozen --group dev --python 3.12
      - name: Test current CLI platform boundaries
        run: |
          uv run --frozen pytest -q cli/tests/test_vm.py cli/tests/test_vm_control.py \
            cli/tests/test_vm_identity.py cli/tests/test_vm_diagnostics.py \
            cli/tests/test_darwin_platform.py cli/tests/test_agent_preview.py \
            cli/tests/test_desktop_presenter.py
      - name: Test changed native platform boundaries
        if: needs.focused-pr.outputs.rust == 'true'
        working-directory: proxy
        run: ../scripts/cargo_with_space.sh test --locked --test native_runtime_dependency
