name: Native proxy contracts

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "cli/tests/test_rust_proxy.py"
      - "proxy/**"
      - "site/**"
      - ".github/workflows/dispatch-publication.yml"
      - ".github/workflows/pages.yml"
      - "guest/command/**"
      - "scripts/build_guest_command.sh"
      - "tests/proxy_contracts/**"
      - "tests/blackbox/proxy_backend.py"
      - "tests/blackbox/run-tests.sh"
      - "tests/test_blackbox_harness.py"
      - "tests/test_proxy_rust_coord_fixture.py"
      - "tests/test_proxy_rust_ci_events.py"
      - "tests/test_proxy_cutover_deletion_map.py"
      - "tests/blackbox/sinkhole/server.py"
      - "tests/test_blackbox_sinkhole.py"
      - "tests/test_workflow_action_pins.py"
      - "tests/reference/safeyolo/rust_proxy.py"
      - "tests/reference/safeyolo/platform/**"
      - "cli/tests/test_vm_control.py"
      - "cli/tests/test_vm_diagnostics.py"
      - "vm/**"
      - ".github/workflows/proxy-rust.yml"
      - ".github/workflows/guest-test-inputs.yml"
      - ".github/workflows/ci.yml"
      - "scripts/cargo_with_space.sh"
      - "scripts/rust_cache_command.sh"
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  # Keep scheduled and manual contracts independent of quick branch/PR updates.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A feature PR's ready transition has no job; keep its in-flight focused check.
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}

jobs:
  guest-inputs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    uses: ./.github/workflows/guest-test-inputs.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      profile: production
      architecture: ${{ matrix.architecture }}
      host_inputs: false

  focused-pr:
    name: Quick native checks (Ubuntu)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'ready_for_review')
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      SAFEYOLO_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      macos: ${{ steps.changes.outputs.macos }}
      linux: ${{ steps.changes.outputs.linux }}
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify the exact pull-request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test -n "$EXPECTED_HEAD" && test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Select relevant native and platform checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-paths"
          if grep -Eq '^(proxy/|scripts/rust_cache_command\.sh$|\.github/workflows/(proxy-rust|guest-test-inputs|ci)\.yml$)' "$RUNNER_TEMP/changed-paths"; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          elif [ "$?" -ne 1 ]; then
            echo 'ERROR: changed-path matcher failed' >&2
            exit 2
          fi
          if grep -Eq '^(site/|\.github/workflows/(dispatch-publication|pages)\.yml)' "$RUNNER_TEMP/changed-paths"; then
            echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          elif [ "$?" -ne 1 ]; then
            echo 'ERROR: changed-path matcher failed' >&2
            exit 2
          fi
          if grep -Eq '^(guest/command/|proxy/src/(guest_commands|host_lifecycle)|scripts/(build_guest_command|install_native)|cli/src/safeyolo/(guest-|vm\.py|agent_command_supervisor)|cli/tests/test_(agent_command_supervisor|guest_command_observation|vm_recovery_recipe))' "$RUNNER_TEMP/changed-paths"; then
            echo 'guest=true' >> "$GITHUB_OUTPUT"
          elif [ "$?" -ne 1 ]; then
            echo 'ERROR: changed-path matcher failed' >&2
            exit 2
          fi
          if grep -Eq '^(scripts/rust_cache_command\.sh$|\.github/workflows/(proxy-rust|guest-test-inputs|ci)\.yml$|vm/|proxy/src/(host_platform|desktop_|provider_stream)|tests/reference/safeyolo/(vm|runtime_identity|platform/(darwin|__init__))|cli/tests/test_vm_(control|diagnostics))' "$RUNNER_TEMP/changed-paths"; then
            echo 'macos=true' >> "$GITHUB_OUTPUT"
          elif [ "$?" -ne 1 ]; then
            echo 'ERROR: changed-path matcher failed' >&2
            exit 2
          fi
          if grep -Eq '^(proxy/src/(host_platform|desktop_|provider_stream)|tests/reference/safeyolo/(vm|runtime_identity|platform/(linux|__init__)))' "$RUNNER_TEMP/changed-paths"; then
            echo 'linux=true' >> "$GITHUB_OUTPUT"
          elif [ "$?" -ne 1 ]; then
            echo 'ERROR: changed-path matcher failed' >&2
            exit 2
          fi

      - name: Install the pinned Rust toolchain
        if: steps.changes.outputs.rust == 'true' || steps.changes.outputs.guest == 'true' || steps.changes.outputs.dispatch == 'true'
        working-directory: proxy
        run: |
          rustup show active-toolchain
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Restore Rust dependency cache
        if: steps.changes.outputs.rust == 'true' || steps.changes.outputs.guest == 'true' || steps.changes.outputs.dispatch == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: bash "${{ github.workspace }}/scripts/rust_cache_command.sh" {0}
          workspaces: |
            proxy -> target
            guest/command -> target
          shared-key: production-focused-pr
          cache-bin: false
          cache-on-failure: true

      - name: Check Rust formatting and lint
        if: steps.changes.outputs.rust == 'true'
        working-directory: proxy
        run: |
          ../scripts/cargo_with_space.sh fmt --all -- --check
          ../scripts/cargo_with_space.sh clippy --release --locked --all-targets -- -D warnings

      - name: Build the native guest command artifact
        if: steps.changes.outputs.rust == 'true' || steps.changes.outputs.guest == 'true'
        env:
          SAFEYOLO_BUILD_PROFILE: production
          CARGO_BUILD_JOBS: "1"
        run: scripts/build_guest_command.sh

      - name: Check native guest command operations
        if: steps.changes.outputs.guest == 'true'
        run: |
          scripts/cargo_with_space.sh test --release --manifest-path guest/command/Cargo.toml --locked
          scripts/cargo_with_space.sh clippy --release --manifest-path guest/command/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build the native CLI for recovery and Dispatch checks
        if: steps.changes.outputs.rust == 'true' || steps.changes.outputs.guest == 'true' || steps.changes.outputs.dispatch == 'true'
        run: scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --bin safeyolo

      - name: Validate the Dispatch publication tree
        if: steps.changes.outputs.rust == 'true' || steps.changes.outputs.dispatch == 'true'
        run: proxy/target/release/safeyolo dispatch check-site

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          prune-cache: true

      - name: Install the native CLI test environment
        run: |
          uv python install 3.12
          uv sync --frozen --group dev --python 3.12

      - name: Install preview test system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends socat tmux uidmap zstd
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"

      - name: Test workflow, fixture, deletion, and blackbox runner boundaries
        run: |
          uv run --frozen pytest -q \
            cli/tests/test_rust_proxy.py \
            cli/tests/test_sockets.py \
            tests/test_blackbox_harness.py \
            tests/proxy_contracts/test_readiness.py \
            tests/test_proxy_rust_coord_fixture.py \
            tests/test_proxy_rust_ci_events.py \
            tests/test_proxy_cutover_deletion_map.py \
            tests/test_blackbox_sinkhole.py::test_sinkhole_head_has_get_headers_no_body_and_control_observation \
            tests/test_workflow_action_pins.py

      - name: Test guest command staging and bounded native recovery
        if: steps.changes.outputs.guest == 'true'
        env:
          SAFEYOLO_GUEST_HELPER: ${{ github.workspace }}/guest/command/target/release/safeyolo-guest
        run: |
          uv run --frozen pytest -q cli/tests/test_agent_command_supervisor.py \
            cli/tests/test_vm_recovery_recipe.py

      - name: Test native desktop presentation and host entry
        if: steps.changes.outputs.rust == 'true'
        working-directory: proxy
        run: ../scripts/cargo_with_space.sh test --release --locked --test desktop_native --test native_host_cli

      - name: Test changed Linux platform boundaries
        if: steps.changes.outputs.linux == 'true' && steps.changes.outputs.rust == 'true'
        working-directory: proxy
        run: ../scripts/cargo_with_space.sh test --release --locked --test native_runtime_dependency

      - name: Test focused native boundaries
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        working-directory: proxy
        run: |
          ../scripts/cargo_with_space.sh test --release --locked --test version
          ../scripts/cargo_with_space.sh test --release --locked --test agent_api_audit
          ../scripts/cargo_with_space.sh test --release --locked --test tls existing_rsa_ca_formats_survive_native_import_and_restart -- --exact
          ../scripts/cargo_with_space.sh test --release --locked --test gateway_workflow oauth_refresh_reaches_origin_once_and_shared_flight_reuses_token -- --exact
          ../scripts/cargo_with_space.sh test --release --locked --lib native_config::tests
          ../scripts/cargo_with_space.sh test --release --locked --lib policy::native::tests
          ../scripts/cargo_with_space.sh test --release --locked --lib guest_acquisition::tests
          ../scripts/cargo_with_space.sh test --release --locked --lib boot_
          ../scripts/cargo_with_space.sh test --release --locked --test command_centre_lifecycle

      - name: Install the pinned Codex execpolicy test consumer
        if: steps.changes.outputs.rust == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-execpolicy"
          cp tools/codex-execpolicy/package{,-lock}.json "$RUNNER_TEMP/codex-execpolicy/"
          npm ci --prefix "$RUNNER_TEMP/codex-execpolicy"
          # npm can omit a corrupt optional package. Refuse global module fallback.
          node - "$RUNNER_TEMP/codex-execpolicy" <<'JS'
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const modules = path.resolve(process.argv[2], 'node_modules');
          const wrapper = path.join(modules, '@openai/codex/package.json');
          const platform = `@openai/codex-${process.platform}-${process.arch}/package.json`;
          if (createRequire(wrapper).resolve(platform) !== path.join(modules, platform)) {
            throw new Error('Codex must use the locked local platform package');
          }
          JS
          test "$("$RUNNER_TEMP/codex-execpolicy/node_modules/.bin/codex" --version)" = 'codex-cli 0.159.1'
          printf '%s\n' "$RUNNER_TEMP/codex-execpolicy/node_modules/.bin" >> "$GITHUB_PATH"


      - name: Test installed native policy commands
        if: steps.changes.outputs.rust == 'true'
        run: |
          scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --bin safeyolo --bin safeyolo-coord --bin safeyolo-proxy
          uv run --frozen pytest -q tests/proxy_contracts/test_native_policy_cli.py \
            tests/proxy_contracts/test_first_agent_launch.py \
            cli/tests/test_host_setup_scripts.py::test_claude_host_state_choice_controls_auth_preferences_and_extensions \
            cli/tests/test_host_setup_scripts.py::test_claude_setup_does_not_write_through_guest_created_host_links \
            --basetemp "$RUNNER_TEMP/native-policy"
          uv run --frozen pytest -q tests/proxy_contracts/test_native_factory_cli.py::test_factory_run_requires_confirmation_before_any_role_starts \
            tests/proxy_contracts/test_native_factory_cli.py::test_installed_prepare_stages_codex_pi_and_retains_state_and_peer_grants \
            --basetemp "$RUNNER_TEMP/native-factory"
          uv run --frozen pytest -q tests/test_guest_acquisition.py tests/test_guest_upgrade.py --basetemp "$RUNNER_TEMP/guest-selection"

      - name: Retain checked Linux production inputs
        if: steps.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-host-amd64-production
          path: |
            proxy/target/release/safeyolo
            proxy/target/release/safeyolo-coord
            proxy/target/release/safeyolo-proxy
          retention-days: 7
          if-no-files-found: error
      - name: Retain matching Linux guest inputs
        if: steps.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-guest-amd64-production
          path: |
            guest/command/target/release/safeyolo-guest*
            guest/command/target/release/safeyolo-coord*
          retention-days: 7
          if-no-files-found: error

      - name: Build and save master debug release runtimes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.changes.outputs.rust == 'true'
        run: |
          scripts/cargo_with_space.sh build --manifest-path proxy/Cargo.toml --locked --bin safeyolo-proxy
          uv run --frozen python scripts/build_host_packages.py save-debug --output "$RUNNER_TEMP/host-debug"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.changes.outputs.rust == 'true'
        with:
          name: host-debug-linux-amd64
          path: ${{ runner.temp }}/host-debug
          retention-days: 7
          if-no-files-found: ignore

  contracts:
    name: Overnight native contracts (${{ matrix.os }})
    needs: guest-inputs
    env:
      CARGO_BUILD_JOBS: "1"
      SAFEYOLO_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    # Full regression is overnight or a trusted explicit request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the event's exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test -n "$EXPECTED_HEAD" && test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install the pinned Rust toolchain
        working-directory: proxy
        run: |
          rustup show active-toolchain
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: bash "${{ github.workspace }}/scripts/rust_cache_command.sh" {0}
          workspaces: |
            proxy -> target
            guest/command -> target
          shared-key: production-focused-pr
          cache-bin: false
          cache-on-failure: true

      - name: Check Rust formatting and lint
        working-directory: proxy
        run: |
          ../scripts/cargo_with_space.sh fmt --all -- --check
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host_target"
          runner_target="$(printf '%s' "$host_target" | tr '[:lower:]-' '[:upper:]_')"
          printf 'CARGO_TARGET_%s_RUNNER=%s/proxy/tests/coord_test_runner.sh\n' "$runner_target" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          ../scripts/cargo_with_space.sh clippy --release --locked --all-targets -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          prune-cache: true

      - name: Install the native CLI test environment
        run: |
          uv python install 3.12.14
          uv sync --frozen --group dev --python 3.12.14

      - name: Install the pinned Codex execpolicy test consumer
        run: |
          mkdir -p "$RUNNER_TEMP/codex-execpolicy"
          cp tools/codex-execpolicy/package{,-lock}.json "$RUNNER_TEMP/codex-execpolicy/"
          npm ci --prefix "$RUNNER_TEMP/codex-execpolicy"
          # npm can omit a corrupt optional package. Refuse global module fallback.
          node - "$RUNNER_TEMP/codex-execpolicy" <<'JS'
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const modules = path.resolve(process.argv[2], 'node_modules');
          const wrapper = path.join(modules, '@openai/codex/package.json');
          const platform = `@openai/codex-${process.platform}-${process.arch}/package.json`;
          if (createRequire(wrapper).resolve(platform) !== path.join(modules, platform)) {
            throw new Error('Codex must use the locked local platform package');
          }
          JS
          test "$("$RUNNER_TEMP/codex-execpolicy/node_modules/.bin/codex" --version)" = 'codex-cli 0.159.1'
          printf '%s\n' "$RUNNER_TEMP/codex-execpolicy/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install native desktop test dependency
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends socat tmux uidmap
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"

      - name: Install macOS native terminal test dependency
        if: matrix.os == 'macos-latest'
        run: |
          brew install tmux
          tmux -V

      # Match the production producers' implicit host target and cache layout.
      # Clippy metadata, production binaries and test binaries are distinct outputs.
      - name: Compile production native executables
        timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 15 }}
        working-directory: proxy
        run: |
          ../scripts/cargo_with_space.sh build --release --locked --bins
          rust_proxy="$GITHUB_WORKSPACE/proxy/target/release/safeyolo-proxy"
          test -x "$rust_proxy"
          printf 'SAFEYOLO_RUST_PROXY=%s\n' "$rust_proxy" >> "$GITHUB_ENV"
          native_cli="$GITHUB_WORKSPACE/proxy/target/release/safeyolo"
          test -x "$native_cli"
          printf 'SAFEYOLO_NATIVE_CLI=%s\n' "$native_cli" >> "$GITHUB_ENV"
          printf 'SAFEYOLO_NATIVE_ARTIFACTS=%s\n' "$(dirname "$native_cli")" >> "$GITHUB_ENV"

      - name: Download matching Linux guest test inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-guest-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}-production
          path: guest/command/target/release

      - name: Restore Linux guest executable permissions
        run: |
          chmod +x guest/command/target/release/safeyolo-guest guest/command/target/release/safeyolo-coord
          source scripts/native_package.sh
          verify_native_artifacts "$SAFEYOLO_NATIVE_ARTIFACTS" guest/command/target/release production "$(host_platform)"

      - name: Compile Rust contract executables
        timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 15 }}
        working-directory: proxy
        env:
          SAFEYOLO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: ../scripts/cargo_with_space.sh test --release --locked --no-run

      - name: Start the Python-owned Coord fixture
        env:
          SAFEYOLO_COORD_DATA_DIR: ${{ runner.temp }}/safeyolo-coord-fixture
          SAFEYOLO_NATS_TEST_INSTANCE: proxy-rust-fixture
        run: |
          fixture_root="$SAFEYOLO_COORD_DATA_DIR"
          fixture_ready="$fixture_root/fixture.ready"
          fixture_log="$RUNNER_TEMP/safeyolo-coord-fixture.log"
          test ! -e "$fixture_root" || {
            echo "Coord fixture path already exists: $fixture_root" >&2
            exit 1
          }
          uv run --frozen python proxy/tests/coord_fixture.py \
            --ready-file "$fixture_ready" > "$fixture_log" 2>&1 &
          fixture_pid=$!
          for attempt in $(seq 1 100); do
            if test -f "$fixture_ready"; then
              uv run --frozen python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "tests/reference")
          from safeyolo.coord import nats_runtime
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"SAFEYOLO_COORD_NATS_BINARY={nats_runtime.nats_binary_path()}\n")
          PY
              exit 0
            fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              teardown_status=0
              uv run --frozen python proxy/tests/coord_fixture.py --teardown || teardown_status=$?
              cat "$fixture_log"
              if test "$teardown_status" -ne 0; then
                echo "Coord fixture teardown failed after startup failure" >&2
              fi
              exit 1
            fi
            sleep 0.1
          done
          teardown_status=0
          uv run --frozen python proxy/tests/coord_fixture.py --teardown || teardown_status=$?
          cat "$fixture_log"
          if test "$teardown_status" -ne 0; then
            echo "Coord fixture teardown failed after startup timeout" >&2
          fi
          exit 1

      - name: Test the Rust proxy
        timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 15 }}
        working-directory: proxy
        env:
          SAFEYOLO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          export SAFEYOLO_PROXY_COORD_DATA_DIR="$RUNNER_TEMP/safeyolo-coord-fixture"
          export SAFEYOLO_PROXY_NATS_TEST_INSTANCE=proxy-rust-fixture
          ../scripts/cargo_with_space.sh test --release --locked
          # Tests can select binaries linked with dev-dependency features.
          # Restore the normal production outputs for the component consumers.
          ../scripts/cargo_with_space.sh build --release --locked --bins

      - name: Stop the Python-owned Coord fixture
        if: always()
        env:
          SAFEYOLO_COORD_DATA_DIR: ${{ runner.temp }}/safeyolo-coord-fixture
          SAFEYOLO_NATS_TEST_INSTANCE: proxy-rust-fixture
        run: |
          fixture_log="$RUNNER_TEMP/safeyolo-coord-fixture.log"
          fixture_stopped="$SAFEYOLO_COORD_DATA_DIR/fixture.stopped"
          if test ! -e "$SAFEYOLO_COORD_DATA_DIR"; then
            exit 0
          fi
          uv run --frozen python proxy/tests/coord_fixture.py --teardown
          for attempt in $(seq 1 100); do
            if test -f "$fixture_stopped"; then
              cat "$fixture_log"
              exit 0
            fi
            sleep 0.1
          done
          cat "$fixture_log"
          echo "Coord fixture did not finish its ownership-verified teardown" >&2
          exit 1

      - name: Provide the macOS owned HTTP peer addresses
        if: matrix.os == 'macos-latest'
        run: |
          sudo -n /sbin/ifconfig lo0 alias 127.0.0.2
          sudo -n /sbin/ifconfig lo0 alias 127.0.0.3
          /sbin/ifconfig lo0 | grep -F '127.0.0.2'
          /sbin/ifconfig lo0 | grep -F '127.0.0.3'

      - name: Download macOS package terminal input
        if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-guest-terminal-arm64-production
          path: ${{ runner.temp }}/native-contract-vm

      - name: Prepare macOS VM package inputs
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x "$RUNNER_TEMP/native-contract-vm/vsock-term"
          make -C vm PROFILE=production install-helper INSTALL_DIR="$RUNNER_TEMP/native-contract-vm"

      - name: Run native proxy component contracts
        env:
          PYTEST_ADDOPTS: ${{ matrix.os == 'macos-latest' && '--basetemp=/tmp/sy-rs' || '' }}
          SAFEYOLO_GUEST_ARTIFACTS: ${{ github.workspace }}/guest/command/target/release
          SAFEYOLO_NATIVE_VM_ARTIFACTS: ${{ matrix.os == 'macos-latest' && format('{0}/native-contract-vm', runner.temp) || '' }}
        run: uv run --frozen pytest -q tests/proxy_contracts --proxy-backend rust

  macos-pr:
    name: Relevant macOS platform checks
    needs: focused-pr
    if: needs.focused-pr.outputs.macos == 'true'
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: "1"
      SAFEYOLO_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned Rust toolchain
        if: needs.focused-pr.outputs.rust == 'true'
        working-directory: proxy
        run: |
          rustup show active-toolchain
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Restore Rust dependency cache
        if: needs.focused-pr.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: bash "${{ github.workspace }}/scripts/rust_cache_command.sh" {0}
          workspaces: |
            proxy -> target
            guest/command -> target
          shared-key: production-focused-pr
          cache-bin: false
          cache-on-failure: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          prune-cache: true
      - name: Prepare platform test dependencies
        run: uv sync --frozen --group dev --python 3.12
      - name: Install Mac native test dependencies
        run: brew install socat tmux
      - name: Test current CLI platform boundaries
        run: |
          uv run --frozen pytest -q cli/tests/test_vm_control.py cli/tests/test_vm_diagnostics.py
      - name: Test changed native platform boundaries
        if: needs.focused-pr.outputs.rust == 'true'
        working-directory: proxy
        run: ../scripts/cargo_with_space.sh test --release --locked --test native_runtime_dependency --test native_host_cli --test native_host_identity
      - name: Build and save master debug release runtimes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.focused-pr.outputs.rust == 'true'
        run: |
          scripts/cargo_with_space.sh build --manifest-path proxy/Cargo.toml --locked --bin safeyolo-proxy
          make -C vm PROFILE=development build
          uv run --frozen python scripts/build_host_packages.py save-debug --output "$RUNNER_TEMP/host-debug"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.focused-pr.outputs.rust == 'true'
        with:
          name: host-debug-darwin-arm64
          path: ${{ runner.temp }}/host-debug
          retention-days: 7
          if-no-files-found: ignore
