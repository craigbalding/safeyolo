name: Pinned gVisor release

# The bundled runsc is built from one gVisor release that no dependency scanner
# reads. This check opens an issue for a published gVisor advisory that the pin
# may lack a fix for, or for a pin more than 30 days behind upstream. It opens
# nothing otherwise.
#
# gVisor publishes a release on a weekday, not on a fixed one. The check runs
# early from Tuesday to Saturday (UTC), within a day of any weekday release.
on:
  schedule:
    - cron: "17 6 * * 2-6"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gvisor-pin.yml"
      - "scripts/check_gvisor_pin.py"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the pinned gVisor release check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Print advisory and age findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/check_gvisor_pin.py --dry-run

  check:
    name: Check the pinned gVisor release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # All issue writers share a group, including manual runs on different refs.
    concurrency:
      group: gvisor-pin-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report advisories and an old pin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/check_gvisor_pin.py
