name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 0 * * 0"

# Cancel in-progress runs when PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
          tools: linked
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Verify local and CI CodeQL versions match
        env:
          ACTUAL_CODEQL_VERSION: ${{ steps.codeql-init.outputs.codeql-version }}
        run: python3 scripts/check_codeql.py --verify-version "$ACTUAL_CODEQL_VERSION"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:python"
