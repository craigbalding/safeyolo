name: Issue 667 Linux process-group witness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-group:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7d1dd5afcc56dc6e35667d845d66912f82d9e94f

      - name: Show source and host identity
        run: |
          test "$(git rev-parse HEAD)" = 7d1dd5afcc56dc6e35667d845d66912f82d9e94f
          test -z "${BASH_ENV:-}"
          git rev-parse HEAD
          uname -a
          cat /etc/os-release
          command -v setsid

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Exercise validator timeout on a real process group
        run: |
          uv run --no-project --with pytest==9.0.3 --python 3.12 \
            python -m pytest -vv -q \
            tests/test_cargo_with_space.py::test_linux_validator_timeout_kills_real_setsid_group_only
