name: Dispatch publication

on:
  pull_request:
    branches: [master, main]
    paths:
      - "site/**"

permissions:
  contents: read

concurrency:
  group: dispatch-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate publication candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        working-directory: proxy
        run: |
          rustup show active-toolchain
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: proxy -> target
          cache-bin: false
      - name: Build the native Dispatch command
        env:
          CARGO_BUILD_JOBS: "1"
          SAFEYOLO_BUILD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: scripts/cargo_with_space.sh build --manifest-path proxy/Cargo.toml --locked --bin safeyolo
      - name: Validate generated content, metadata, links, and hygiene
        run: proxy/target/debug/safeyolo dispatch check-site
      - name: Enforce the publication-branch path boundary
        if: startsWith(github.head_ref, 'dispatch/')
        run: >-
          proxy/target/debug/safeyolo dispatch check-site
          --publication-base "${{ github.event.pull_request.base.sha }}"

  build:
    name: Build publication candidate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site
          future: true
