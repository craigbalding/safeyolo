name: Dispatch publication

on:
  pull_request:
    branches: [master, main]
    paths:
      - "site/**"

permissions:
  contents: read

concurrency:
  group: dispatch-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate publication candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.9.24"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Validate generated content, metadata, links, and hygiene
        run: uv run python scripts/check_dispatch_site.py
      - name: Enforce the publication-branch path boundary
        if: startsWith(github.head_ref, 'dispatch/')
        run: >-
          uv run python scripts/check_dispatch_site.py
          --publication-base "${{ github.event.pull_request.base.sha }}"

  build:
    name: Build publication candidate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site
          future: true
