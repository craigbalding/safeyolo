name: Blackbox Tests — systrap

# The GitHub-hosted lane deliberately proves gVisor's no-KVM fallback.
# Hardware-backed lanes run through the same tests on the KVM VPS and a
# physical Apple Silicon Mac mini (VZ); see tests/blackbox/README.md.
#
# BB is intentionally not a per-PR check. A nightly run coalesces the day's
# changes on the default branch, and workflow_dispatch permits any trusted ref
# to be tested before merge or release.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackbox-systrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  systrap:
    name: Full BB — Linux systrap
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.9.24"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install, bootstrap, and run full systrap BB
        run: ./tests/blackbox/run-lane.sh systrap --verbose

      - name: Upload platform evidence and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blackbox-systrap-${{ github.run_id }}
          path: |
            tests/blackbox/artifacts/
            ~/.safeyolo-test/logs/
          retention-days: 7
          if-no-files-found: warn
