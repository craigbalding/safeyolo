name: Nightly native blackbox

# The GitHub-hosted Linux lanes deliberately prove gVisor's no-KVM fallback.
# Hardware-backed lanes run through the same tests on the KVM VPS and a
# physical Apple Silicon Mac mini (VZ); see tests/blackbox/README.md.
#
# Builds run in separate producers. BB is not a per-PR check. Each run tests
# retained default-branch artifacts and records their age and the controller
# source separately. Dispatch can pin a production run and a staged index.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      host_run:
        description: Optional exact default-branch production run
        type: string
      guest_index:
        description: Optional exact completed staged guest index (sha256:DIGEST)
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: blackbox-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  systrap:
    name: Installed guest sections and host continuity — Linux systrap
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true
      - name: Prepare test instruments
        run: |
          uv sync --frozen --group dev --python 3.13
          scripts/install_oras.sh "$RUNNER_TEMP/test-tools"
          printf '%s\n' "$RUNNER_TEMP/test-tools" >> "$GITHUB_PATH"
      - name: Prepare the supported systrap host
        run: tests/blackbox/prepare-systrap-host.sh
      - name: Freeze and download retained inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_RUN: ${{ inputs.host_run }}
          GUEST_INDEX: ${{ inputs.guest_index }}
        run: |
          options=()
          if [[ -n $HOST_RUN ]]; then options+=(--host-run "$HOST_RUN"); fi
          if [[ -n $GUEST_INDEX ]]; then options+=(--guest-index "$GUEST_INDEX"); fi
          .venv/bin/python scripts/select_blackbox_artifacts.py --platform linux-amd64 \
            --output "$RUNNER_TEMP/selection" "${options[@]}"
      - name: Run retained installed sections
        env:
          SAFEYOLO_RUNSC_DEBUG: "1"
        run: |
          .venv/bin/python tests/blackbox/retained_inputs.py run --lane systrap --yes \
            --selection "$RUNNER_TEMP/selection/selection.json" \
            --artifacts tests/blackbox/artifacts/systrap
      - name: Upload reports and failed attempts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: blackbox-systrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection/selection.json
            tests/blackbox/artifacts/**/*.json
            tests/blackbox/artifacts/**/*.xml
          retention-days: 30
          if-no-files-found: warn

  macos-package:
    name: Installed host package — GitHub macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true
      - name: Prepare test instruments
        run: |
          uv sync --frozen --group dev --python 3.13
          brew install oras
      - name: Prepare macOS loopback test origin
        run: |
          sudo -n /sbin/ifconfig lo0 alias 127.0.0.2
          /sbin/ifconfig lo0 | grep -F '127.0.0.2'
      - name: Freeze and download retained inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_RUN: ${{ inputs.host_run }}
          GUEST_INDEX: ${{ inputs.guest_index }}
        run: |
          options=()
          if [[ -n $HOST_RUN ]]; then options+=(--host-run "$HOST_RUN"); fi
          if [[ -n $GUEST_INDEX ]]; then options+=(--guest-index "$GUEST_INDEX"); fi
          .venv/bin/python scripts/select_blackbox_artifacts.py --platform darwin-arm64 \
            --output "$RUNNER_TEMP/selection" "${options[@]}"
      - name: Run retained installed sections
        env:
          SAFEYOLO_RUNSC_DEBUG: "1"
        run: |
          .venv/bin/python tests/blackbox/retained_inputs.py run --lane package \
            --selection "$RUNNER_TEMP/selection/selection.json" \
            --artifacts tests/blackbox/artifacts/macos-package
      - name: Upload reports and failed attempts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: blackbox-macos-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection/selection.json
            tests/blackbox/artifacts/**/*.json
            tests/blackbox/artifacts/**/*.xml
          retention-days: 30
          if-no-files-found: warn
