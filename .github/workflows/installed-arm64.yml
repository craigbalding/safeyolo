name: Installed Linux ARM64 qualification

# Manual public onboarding and retained archive qualification.
# Public installation has a separate job from the retained archive smoke.
# Ordinary native/source workflows and all publication controls stay separate.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Retained smoke, public bootstrap, connected published updates, or historical fixture
        type: choice
        default: retained
        options:
          - retained
          - draft-offline
          - public-install
          - clean-public-install
          - installed-update
      host_run:
        description: Optional exact default-branch production run for retained mode
        type: string
      guest_index:
        description: Optional exact staged guest index for retained mode
        type: string
      guest:
        description: Guest for retained archive mode (public-install uses the published default)
        type: choice
        default: original-g1
        options:
          - original-g1
          - reduced-33224
      section:
        description: Retained archive sections (default set, or lifecycle only)
        type: choice
        default: default
        options:
          - default
          - lifecycle
      cold_seconds:
        description: Cold public observation allowance in seconds (1800 for the owned emulated experiment)
        type: number
        default: 900

permissions:
  contents: read

env:
  HOST_RELEASE_ID: "414106024"
  HOST_ARCHIVE_ASSET_ID: "644683987"
  HOST_CHECKSUM_ASSET_ID: "644683989"
  HOST_REVISION: c9ecb66b462c2ba0c499f2322f6cfc5c142012da
  HOST_SHA256: eab9b709b3e4c6b536614eeb6b422d12c2b55826149085f78c326b31637922af
  HOST_BYTES: "176869006"
  GUEST_COMPATIBILITY: v1

jobs:
  clean-public-install:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'clean-public-install'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    env:
      COLD_SECONDS: ${{ inputs.cold_seconds }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select this invocation's fresh VM directory
        run: printf 'CLEAN_UBUNTU_WORK=%s/clean-arm64-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install VM instruments on the outer runner only
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends qemu-system-arm qemu-utils qemu-efi-aarch64 cloud-image-utils
          qemu-system-aarch64 --version
          dpkg-query -W qemu-system-arm qemu-utils qemu-efi-aarch64 cloud-image-utils
      - name: Observe public installation in a stock Ubuntu ARM64 VM
        shell: bash
        run: |
          umask 077
          [[ $COLD_SECONDS =~ ^[1-9][0-9]*$ ]] || { printf 'cold_seconds must be a positive whole number\n' >&2; exit 2; }
          # Cover VM acquisition/boot, the inner cold+900s observer, SSH grace,
          # result recovery and VM teardown before the outer INT/KILL grace.
          env -u GH_TOKEN -u GITHUB_TOKEN timeout --signal=INT --kill-after=180s "$((COLD_SECONDS + 2700))" \
            python3 -I -B tests/blackbox/clean_ubuntu_arm64.py \
            --work-dir "$CLEAN_UBUNTU_WORK" --observer-source "$GITHUB_SHA" \
            --cold-seconds "$COLD_SECONDS"
      - name: Retain reached clean-OS observations, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: clean-public-install-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          # Nonsecret reports only. No full boot log, product terminal, disk,
          # private key, authentication or private state upload.
          path: |
            ${{ env.CLEAN_UBUNTU_WORK }}/reports/fixture.json
            ${{ env.CLEAN_UBUNTU_WORK }}/reports/observation.json
          retention-days: 30
          if-no-files-found: error

  installed-update:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'installed-update'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the supported systrap host
        run: tests/blackbox/prepare-systrap-host.sh
      - name: Acquire the two published ARM64 host archives
        shell: bash
        run: |
          work="$RUNNER_TEMP/installed-update"
          mkdir -m 0700 "$work"
          printf 'INSTALLED_UPDATE_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          for entry in \
            c9ecb66b462c2ba0c499f2322f6cfc5c142012da:eab9b709b3e4c6b536614eeb6b422d12c2b55826149085f78c326b31637922af:176869006 \
            c5ce76019b6c997e282ab05cea0212b492e945d2:dd51dc5a74effde88c4160a91fffb406f938a438c4594b6a008a8019d1a257ea:176883685; do
            IFS=: read -r source checksum bytes <<< "$entry"
            directory="$work/$source"
            mkdir "$directory"
            base="https://github.com/craigbalding/safeyolo/releases/download/host-$source"
            archive="$directory/safeyolo-linux-arm64-production.tar.gz"
            curl --fail --silent --show-error --location --max-time 180 \
              "$base/safeyolo-linux-arm64-production.tar.gz" --output "$archive"
            curl --fail --silent --show-error --location --max-time 60 \
              "$base/SHA256SUMS" --output "$directory/SHA256SUMS"
            grep -Fx "$checksum  safeyolo-linux-arm64-production.tar.gz" "$directory/SHA256SUMS"
            [[ $(stat -c %s "$archive") == "$bytes" ]]
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
            tar -xzf "$archive" -C "$directory"
          done
      - name: Observe the connected installed update journey
        shell: bash
        run: |
          umask 077
          env -u GH_TOKEN -u GITHUB_TOKEN timeout --signal=INT --kill-after=180s 25m \
            python3 -B tests/blackbox/installed_linux_update.py \
            --initial "$INSTALLED_UPDATE_WORK/c9ecb66b462c2ba0c499f2322f6cfc5c142012da/safeyolo-linux-arm64-production" \
            --target "$INSTALLED_UPDATE_WORK/c5ce76019b6c997e282ab05cea0212b492e945d2/safeyolo-linux-arm64-production" \
            --architecture arm64 --output "$INSTALLED_UPDATE_WORK/journey"
      - name: Retain the reached update observations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installed-update-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          # Only the nonsecret report; never upload homes, configuration or logs.
          path: ${{ env.INSTALLED_UPDATE_WORK }}/journey/observed.json
          retention-days: 30
          if-no-files-found: warn

  retained:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'retained'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true
      - name: Prepare test instruments and the supported host
        run: |
          uv sync --frozen --group dev --python 3.13
          scripts/install_oras.sh "$RUNNER_TEMP/test-tools"
          printf '%s\n' "$RUNNER_TEMP/test-tools" >> "$GITHUB_PATH"
          tests/blackbox/prepare-systrap-host.sh
      - name: Freeze and download retained inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_RUN: ${{ inputs.host_run }}
          GUEST_INDEX: ${{ inputs.guest_index }}
        run: |
          options=()
          if [[ -n $HOST_RUN ]]; then options+=(--host-run "$HOST_RUN"); fi
          if [[ -n $GUEST_INDEX ]]; then options+=(--guest-index "$GUEST_INDEX"); fi
          .venv/bin/python scripts/select_blackbox_artifacts.py --platform linux-arm64 \
            --output "$RUNNER_TEMP/selection" "${options[@]}"
      - name: Run the maintained installed sections
        shell: bash
        env:
          SECTION_SELECTION: ${{ inputs.section }}
          SAFEYOLO_RUNSC_DEBUG: "1"
        run: |
          sections=()
          if [[ $SECTION_SELECTION == lifecycle ]]; then sections=(--section lifecycle); fi
          .venv/bin/python tests/blackbox/retained_inputs.py run --lane systrap --yes \
            --selection "$RUNNER_TEMP/selection/selection.json" \
            --artifacts "$RUNNER_TEMP/retained-reports" "${sections[@]}"
      - name: Retain digest-bound installed guest result
        if: ${{ always() && !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORTS: ${{ runner.temp }}/retained-reports
        run: |
          if [[ ! -f "$REPORTS/selection.json" ]]; then
            echo "Missing retained installed reports: $REPORTS/selection.json; no platform evidence was attached." >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          .venv/bin/python scripts/guest_release.py record-smoke --reports "$REPORTS" \
            --gate-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
      - name: Retain reports and failed selections
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installed-retained-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection/selection.json
            ${{ runner.temp }}/retained-reports
          retention-days: 30
          if-no-files-found: warn

  acquire-host:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'draft-offline'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The retained host release is published. Only fixed GETs run here;
    # no checkout, product, verifier, guest or publication command uses this token.
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.host-inputs.outputs.artifact-id }}
    steps:
      - name: Read and bind the retained host inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/retained-host"
          host="$RUNNER_TEMP/retained-host"
          if ! gh api "repos/craigbalding/safeyolo/releases/$HOST_RELEASE_ID" > "$host/release.json"; then
            echo 'The acquisition job token cannot access the retained host release.' >&2
            exit 1
          fi
          jq -e --arg id "$HOST_RELEASE_ID" --arg source "$HOST_REVISION" '
            .id == ($id | tonumber) and .draft == false and
            .tag_name == ("host-" + $source) and .target_commitish == $source
          ' "$host/release.json" >/dev/null || {
            echo 'Selected release must be the published retained host source and tag.' >&2
            exit 1
          }
          for name in safeyolo-linux-arm64-production.tar.gz SHA256SUMS; do
            if [[ $name == SHA256SUMS ]]; then id=$HOST_CHECKSUM_ASSET_ID; else id=$HOST_ARCHIVE_ASSET_ID; fi
            jq -e --argjson id "$id" --arg name "$name" '
              [.assets[] | select(.id == $id and .name == $name and .state == "uploaded")] | length == 1
            ' "$host/release.json" >/dev/null || { echo "Missing retained asset $name (ID $id)." >&2; exit 1; }
            if ! gh api --header 'Accept: application/octet-stream' \
                "repos/craigbalding/safeyolo/releases/assets/$id" > "$host/$name"; then
              echo "The acquisition job token cannot download retained asset $name (ID $id)." >&2
              exit 1
            fi
          done
          grep -Fx "$HOST_SHA256  safeyolo-linux-arm64-production.tar.gz" "$host/SHA256SUMS" || {
            echo 'SHA256SUMS does not contain the retained ARM64 production checksum.' >&2
            exit 1
          }
          archive="$host/safeyolo-linux-arm64-production.tar.gz"
          [[ $(stat -c %s "$archive") == "$HOST_BYTES" ]] || { echo 'Retained host archive size differs.' >&2; exit 1; }
          [[ $(sha256sum "$archive" | cut -d ' ' -f 1) == "$HOST_SHA256" ]] || { echo 'Retained host archive checksum differs.' >&2; exit 1; }
      - name: Transfer only bound host inputs
        id: host-inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: retained-arm64-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retained-host/safeyolo-linux-arm64-production.tar.gz
            ${{ runner.temp }}/retained-host/SHA256SUMS
            ${{ runner.temp }}/retained-host/release.json
          retention-days: 30
          if-no-files-found: error

  installed-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'draft-offline'
    needs: acquire-host
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: "1"
      SAFEYOLO_CARGO_RESERVE_GIB: "10"
      SAFEYOLO_RUNSC_DEBUG: "1"
      GUEST_REVISION: 8234a047d810d543d8c4d1cb1fa9859987be035b
      GUEST_VERSION: guest-2026-10-12.1
      GUEST_INDEX: sha256:df0068692909088a90db2c8f9777807404e3b7d8061ee72bc94a5feabd7dc46e
      GUEST_ARCHIVE_SHA256: 2899415b6f4ec2eb3ab2ad3a6ef05c7cc5b9b2de14f9c623ff22b2478c8cb6f5
      GUEST_ARCHIVE_BYTES: "223000369"
      GUEST_ARTIFACT_ID: "11747551391"
      GUEST_RUN_ID: "38248401312"
    steps:
      - name: Select the owned report directory
        run: printf 'SAFEYOLO_BLACKBOX_ARTIFACTS_DIR=%s/installed-arm64-reports\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the retained guest inputs
        shell: bash
        env:
          GUEST_SELECTION: ${{ inputs.guest }}
        run: |
          case "$GUEST_SELECTION" in
            original-g1) ;;
            reduced-33224)
              printf '%s\n' \
                'GUEST_REVISION=33224c9fc14beeb00be30eb71bdc09f91c5aa58b' \
                'GUEST_VERSION=guest-2026-10-16.1082' \
                'GUEST_INDEX=sha256:14359301826746d088f124205de232c77c40567871550d38b035e6bfb53e5a2e' \
                'GUEST_ARCHIVE_SHA256=234c1b1fb58e58822315bf896fcfaba2618ff0bcb98e73372edcf9dccbd24aad' \
                'GUEST_ARCHIVE_BYTES=119728693' \
                'GUEST_ARTIFACT_ID=12079186556' \
                'GUEST_RUN_ID=38975155518' >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown retained guest: $GUEST_SELECTION" >&2; exit 2;;
          esac
      - name: Download the bound host inputs from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.acquire-host.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/retained-host
      - name: Recheck the transferred host inputs before installation
        shell: bash
        run: |
          mkdir -p "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR"
          host="$RUNNER_TEMP/retained-host"
          jq -e --arg id "$HOST_RELEASE_ID" --arg source "$HOST_REVISION" '
            .id == ($id | tonumber) and .draft == false and
            .tag_name == ("host-" + $source) and .target_commitish == $source
          ' "$host/release.json" >/dev/null || {
            echo 'Transferred release must be the published retained host source and tag.' >&2
            exit 1
          }
          for name in safeyolo-linux-arm64-production.tar.gz SHA256SUMS; do
            if [[ $name == SHA256SUMS ]]; then id=$HOST_CHECKSUM_ASSET_ID; else id=$HOST_ARCHIVE_ASSET_ID; fi
            jq -e --argjson id "$id" --arg name "$name" '
              [.assets[] | select(.id == $id and .name == $name and .state == "uploaded")] | length == 1
            ' "$host/release.json" >/dev/null || { echo "Missing retained asset $name (ID $id)." >&2; exit 1; }
            test -s "$host/$name" || { echo "Missing transferred asset $name." >&2; exit 1; }
          done
          grep -Fx "$HOST_SHA256  safeyolo-linux-arm64-production.tar.gz" "$host/SHA256SUMS" || {
            echo 'Transferred SHA256SUMS does not contain the retained ARM64 production checksum.' >&2
            exit 1
          }
          archive="$host/safeyolo-linux-arm64-production.tar.gz"
          [[ $(stat -c %s "$archive") == "$HOST_BYTES" ]] || { echo 'Transferred host archive size differs.' >&2; exit 1; }
          [[ $(sha256sum "$archive" | cut -d ' ' -f 1) == "$HOST_SHA256" ]] || { echo 'Transferred host archive checksum differs.' >&2; exit 1; }
          tar -xOzf "$archive" safeyolo-linux-arm64-production/package-info > "$host/package-info"
          for field in "source_commit=$HOST_REVISION" profile=production platform=linux-arm64 "guest_compatibility=$GUEST_COMPATIBILITY"; do
            grep -Fx "$field" "$host/package-info" || { echo "Host package must contain $field." >&2; exit 1; }
          done
          printf 'Published release=%s host_source=%s platform=linux-arm64 profile=production sha256=%s bytes=%s\n' \
            "$HOST_RELEASE_ID" "$HOST_REVISION" "$HOST_SHA256" "$HOST_BYTES" | tee "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR/host-input.txt"
      - name: Prepare the supported systrap host
        run: tests/blackbox/prepare-systrap-host.sh
      # The retained complete layout already contains the exact archive blobs.
      # Download it once; do not rebuild or repackage either selected guest.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ env.GUEST_ARTIFACT_ID }}
          run-id: ${{ env.GUEST_RUN_ID }}
          repository: craigbalding/safeyolo
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ${{ runner.temp }}/retained-guest-oci
      - name: Install the pinned Rust toolchain
        working-directory: proxy
        run: |
          rustup show active-toolchain
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: bash "${{ github.workspace }}/scripts/rust_cache_command.sh" {0}
          workspaces: proxy -> target
          key: production
          cache-bin: false
          cache-on-failure: true
      - name: Build only the native OCI verification tool
        env:
          SAFEYOLO_BUILD_REVISION: ${{ github.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/proxy/target
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          df -h "$CARGO_TARGET_DIR"
          du -sh "$CARGO_TARGET_DIR"
          scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --example verify_guest_oci
      - name: Verify the selected index and extract Linux ARM64 assets
        shell: bash
        run: |
          layout="$RUNNER_TEMP/retained-guest-oci"
          index="$layout/blobs/sha256/${GUEST_INDEX#sha256:}"
          # index.json is ORAS's catalogue; GUEST_INDEX names the logical release.
          proxy/target/release/examples/verify_guest_oci "$layout" "$GUEST_INDEX" "$GUEST_COMPATIBILITY" 2>&1 \
            | tee "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR/guest-verification.txt"
          jq -e --arg source "$GUEST_REVISION" --arg version "$GUEST_VERSION" '
            .annotations["org.opencontainers.image.revision"] == $source and
            .annotations["org.opencontainers.image.version"] == $version
          ' "$index" >/dev/null || { echo 'Guest source/version differs from the selection.' >&2; exit 1; }
          child=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] |
            if length == 1 then .[0].digest else error("expected one linux/arm64 child") end' "$index")
          archive=$(jq -er '.layers[0].digest' "$layout/blobs/sha256/${child#sha256:}")
          [[ $archive == "sha256:$GUEST_ARCHIVE_SHA256" ]] || { echo 'Selected guest archive differs from the Linux ARM64 selection.' >&2; exit 1; }
          blob="$layout/blobs/sha256/${archive#sha256:}"
          [[ $(stat -c %s "$blob") == "$GUEST_ARCHIVE_BYTES" ]] || { echo 'Retained guest archive size differs.' >&2; exit 1; }
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq --no-install-recommends zstd
          mkdir "$RUNNER_TEMP/verified-extracted-assets"
          sudo -n "$(command -v tar)" --zstd --numeric-owner --same-owner --same-permissions --sparse \
            --acls --xattrs --xattrs-include='*' -xf "$blob" -C "$RUNNER_TEMP/verified-extracted-assets"
          assets="$RUNNER_TEMP/verified-extracted-assets"
          test -x "$assets/rootfs-tree/bin/bash"
          test -x "$assets/rootfs-tree/usr/local/bin/safeyolo-guest-init"
          test -f "$assets/cache-paths.txt"
          test "$(stat -c '%u:%g' "$assets/rootfs-tree")" = 100000:100000
          stat -c '%n uid=%u gid=%g mode=%a bytes=%s' "$assets/rootfs-tree" "$assets/cache-paths.txt" \
            | tee "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR/guest-metadata.txt"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true
      - name: Prepare the separate Python test observers
        run: |
          uv python install 3.13
          uv sync --frozen --python 3.13
      - name: Prepare the fresh guest for this host account
        shell: bash
        run: |
          host="$RUNNER_TEMP/retained-host"
          mkdir "$host/unpacked"
          tar -xzf "$host/safeyolo-linux-arm64-production.tar.gz" -C "$host/unpacked"
          bundle="$host/unpacked/safeyolo-linux-arm64-production"
          # Use the released host's allocator and ownership helper. Do not
          # share another account's IDs or change an existing prepared tree.
          "$bundle/bin/safeyolo" --root "$host/preparation" host prepare \
            --package-root "$bundle" --installed-root "$bundle" \
            --write-settings "$host/linux-settings.toml" --yes \
            | tee "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR/host-preparation.txt"
          mapping=$(python3 - "$host/linux-settings.toml" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], 'rb') as stream:
              linux = tomllib.load(stream)['linux']
          print(*(linux[key] for key in ('uid_base', 'gid_base', 'host_uid', 'host_gid')))
          PY
          )
          read -r uid_base gid_base host_uid host_gid <<< "$mapping"
          stage=$(mktemp -d "$RUNNER_TEMP/extract-arm64.XXXXXX")
          assets="$RUNNER_TEMP/verified-extracted-assets"
          sudo -n mv "$assets/rootfs-tree" "$stage/rootfs-tree"
          sudo -n "$bundle/bin/safeyolo" --root "$host/preparation" host remap-rootfs \
            "$stage/rootfs-tree" "$uid_base" "$gid_base" "$host_uid" "$host_gid"
          sudo -n mv "$stage/rootfs-tree" "$assets/rootfs-tree"
          rmdir "$stage"
          cp "$host/linux-settings.toml" "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR/linux-host-settings.toml"
          stat -c '%n uid=%u gid=%g mode=%a bytes=%s' "$assets/rootfs-tree" "$assets/cache-paths.txt" \
            | tee "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR/mapped-guest-metadata.txt"
      - name: Run the installed production archive smoke
        env:
          SECTION_SELECTION: ${{ inputs.section }}
        run: |
          set -o pipefail
          {
            uname -a
            id
            getconf GNU_LIBC_VERSION
            printf 'Test tooling=%s; product source=%s; guest source=%s\n' "$GITHUB_SHA" "$HOST_REVISION" "$GUEST_REVISION"
            sections=()
            if [[ $SECTION_SELECTION == lifecycle ]]; then
              sections=(--section lifecycle)
            elif [[ $GUEST_REVISION == 33224c9fc14beeb00be30eb71bdc09f91c5aa58b ]]; then
              sections=(--section isolation --section workloads --section lifecycle)
            fi
            ./tests/blackbox/run-installed-package.sh \
              --package "$RUNNER_TEMP/retained-host/safeyolo-linux-arm64-production.tar.gz" \
              --sha256 "$HOST_SHA256" --platform-assets "$RUNNER_TEMP/verified-extracted-assets" --lane systrap --yes \
              "${sections[@]}"
          } 2>&1 | tee "$SAFEYOLO_BLACKBOX_ARTIFACTS_DIR/installed-smoke.txt"
      - name: Upload reports and individual suite outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installed-arm64-${{ github.run_id }}
          path: ${{ env.SAFEYOLO_BLACKBOX_ARTIFACTS_DIR }}
          retention-days: 30
          if-no-files-found: warn

  public-install:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-install'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      COLD_SECONDS: ${{ inputs.cold_seconds }}
    permissions:
      contents: read
    steps:
      - name: Select fresh observer and report directories
        shell: bash
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/public-arm-onboarding.XXXXXX")
          mkdir "$work/observer" "$work/reports"
          printf 'PUBLIC_INSTALL_WORK=%s\nPUBLIC_INSTALL_REPORTS=%s/reports\n' "$work" "$work" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: observer-source
      - name: Stage only the Python observer outside the checkout
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/observer-source/tests/blackbox/ubuntu_onboarding.py" "$PUBLIC_INSTALL_WORK/observer/"
          mkdir "$PUBLIC_INSTALL_WORK/observer/harness"
          cp "$GITHUB_WORKSPACE/observer-source/tests/blackbox/harness/process_identity.py" "$PUBLIC_INSTALL_WORK/observer/harness/"
          python3 --version
          # Do not prepare the host, install tools, stage assets or change PATH here.
      - name: Observe one public bootstrap, first launch and normal repeat
        shell: bash
        run: |
          umask 077
          cd "$PUBLIC_INSTALL_WORK"
          [[ $COLD_SECONDS =~ ^[1-9][0-9]*$ ]] || { printf 'cold_seconds must be a positive whole number\n' >&2; exit 2; }
          # Reserve 900s for warm work, captures, diagnostics and owned cleanup.
          observer_seconds=$((COLD_SECONDS + 900))
          set +e
          env -u GH_TOKEN -u GITHUB_TOKEN timeout --signal=INT --kill-after=150s "$observer_seconds" \
            python3 -I -B "$PUBLIC_INSTALL_WORK/observer/ubuntu_onboarding.py" \
            --host "$(hostname)" --platform linux-arm64 --observer-source "$GITHUB_SHA" \
            --cold-seconds "$COLD_SECONDS" --execution-mode native \
            --observation-dir "$PUBLIC_INSTALL_WORK/private" \
            > "$PUBLIC_INSTALL_WORK/observer.stdout" 2> "$PUBLIC_INSTALL_WORK/observer.stderr"
          status=$?
          # Observation completeness and wrapper deadlines are separate from product exits.
          printf 'observer_exit=%s\ncold_allowance_seconds=%s\nobserver_timeout_seconds=%s\nexecution_mode=native\n' \
            "$status" "$COLD_SECONDS" "$observer_seconds" > "$PUBLIC_INSTALL_REPORTS/execution.txt"
          exit "$status"
      - name: Finish only this observer's owned cleanup after failure
        if: always()
        shell: bash
        run: |
          umask 077
          cd "$PUBLIC_INSTALL_WORK"
          env -u GH_TOKEN -u GITHUB_TOKEN timeout --signal=INT --kill-after=10s 3m \
            python3 -I -B "$PUBLIC_INSTALL_WORK/observer/ubuntu_onboarding.py" \
            --host "$(hostname)" --platform linux-arm64 --cleanup-only \
            --observation-dir "$PUBLIC_INSTALL_WORK/private" \
            > "$PUBLIC_INSTALL_WORK/cleanup.stdout" 2> "$PUBLIC_INSTALL_WORK/cleanup.stderr"
      - name: Retain reached nonsecret operands, including partial observations
        if: always()
        shell: bash
        run: |
          if [[ -f $PUBLIC_INSTALL_WORK/private/result.json ]]; then
            cp "$PUBLIC_INSTALL_WORK/private/result.json" "$PUBLIC_INSTALL_REPORTS/observation.json"
          fi
      - name: Upload public onboarding observations, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-install-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit files only: never upload PTY logs, instance state or authentication.
          path: |
            ${{ env.PUBLIC_INSTALL_REPORTS }}/observation.json
            ${{ env.PUBLIC_INSTALL_REPORTS }}/execution.txt
          retention-days: 30
          if-no-files-found: error
