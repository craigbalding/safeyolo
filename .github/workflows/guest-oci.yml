name: Prepare default guest OCI release

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      activity:
        description: Build and stage, consider promotion, inspect a retained decision, attach smoke, or copy a transport fixture
        type: choice
        options: [build-stage, promote, inspect, record-smoke, transport-fixture]
        default: build-stage
      compatibility:
        description: Guest compatibility identifier (nightly uses v1)
        type: string
        required: true
        default: v1
      version:
        description: Optional immutable guest-YYYY-MM-DD.N for this fresh build
        type: string
      transport_run:
        description: Exact retained layout producer run (transport fixture only)
        type: string
      transport_artifact:
        description: Exact retained layout artifact ID (transport fixture only)
        type: string
      transport_index:
        description: Exact retained seed index digest (transport fixture only)
        type: string
      smoke_reports:
        description: JSON object with original runner reports or selection and installed-continuation texts (record-smoke only)
        type: string
      smoke_gate_url:
        description: Original installed execution result link (record-smoke only)
        type: string
      promotion_job:
        description: Actions promotion job ID whose retained decision is needed (inspect only)
        type: string

permissions:
  contents: read

# All guest version/channel writes share the existing serialization.
concurrency:
  group: default-guest-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event.schedule == '17 1 * * *' || inputs.activity == 'build-stage') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get -o APT::Update::Error-Mode=any update -qq
          sudo apt-get install -y -qq skopeo gnupg dirmngr
      - id: inputs
        name: Freeze common stable inputs for both architectures
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 guest/resolve_inputs.py resolve --base --output "$RUNNER_TEMP/inputs.json"
          version=${REQUESTED_VERSION:-guest-$(date -u +%Y-%m-%d).$((GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT))}
          [[ $version =~ ^guest-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: guest-resolved-inputs
          path: ${{ runner.temp }}/inputs.json
          if-no-files-found: error

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: guest-resolved-inputs
          path: ${{ runner.temp }}/resolved
      - name: Install maintained builder and archive prerequisites
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update -qq
          sudo apt-get install -y -qq --no-install-recommends skopeo umoci e2fsprogs rsync curl jq zstd
      - name: Install ARM kernel and initramfs prerequisites
        if: matrix.architecture == 'arm64'
        run: |
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev gnupg dirmngr \
            gcc-aarch64-linux-gnu busybox-static pax-utils cpio pkg-config
      - name: Build fresh finished default guest outputs
        env:
          ARCH: ${{ matrix.architecture }}
          BUILD_KERNEL: ${{ matrix.architecture == 'arm64' && '1' || '0' }}
          GUEST_INPUTS: ${{ runner.temp }}/resolved/inputs.json
          OUTPUT_DIR: ${{ runner.temp }}/guest-build
          TMPDIR: ${{ runner.temp }}/guest-work
        run: |
          mkdir -p "$TMPDIR"
          ./guest/build-all.sh
      - name: Archive backend files and retain build origins
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          ./guest/archive-default.sh "linux/$ARCH" "$RUNNER_TEMP/guest-build" "$RUNNER_TEMP/archives/linux-$ARCH"
          if [[ "$ARCH" == arm64 ]]; then
            ./guest/archive-default.sh darwin/arm64 "$RUNNER_TEMP/guest-build" "$RUNNER_TEMP/archives/darwin-arm64"
          fi
          mkdir -p "$RUNNER_TEMP/provenance/$ARCH"
          cp -a "$RUNNER_TEMP/guest-build/provenance/." "$RUNNER_TEMP/provenance/$ARCH/"
          cp "$RUNNER_TEMP/guest-build/build-base.txt" "$RUNNER_TEMP/provenance/$ARCH/"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/provenance/$ARCH/run-attempt.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: guest-archives-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/archives
            ${{ runner.temp }}/provenance
          if-no-files-found: error
      - name: Retain failed build origins
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: failed-guest-build-${{ matrix.architecture }}
          path: ${{ runner.temp }}/guest-build/provenance

  stage:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      index: ${{ steps.stage.outputs.index }}
      staged_at: ${{ steps.stage.outputs.staged_at }}
      run_attempt: ${{ steps.stage.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: guest-archives-*
          merge-multiple: true
          path: ${{ runner.temp }}/built
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: guest-resolved-inputs
          path: ${{ runner.temp }}/built/provenance
      - name: Install the frozen verified publisher
        env:
          GUEST_INPUTS: ${{ runner.temp }}/built/provenance/inputs.json
        run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          cp "$RUNNER_TEMP/bin/oras-inputs.json" "$RUNNER_TEMP/built/provenance/"
      - name: Build the shared native OCI verifier
        env:
          CARGO_BUILD_JOBS: '1'
          SAFEYOLO_BUILD_REVISION: ${{ github.sha }}
        run: scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --example verify_guest_oci
      - name: Prepare and verify complete local content
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMPATIBILITY: ${{ inputs.compatibility || 'v1' }}
        run: |
          scripts/publish_guest_oci.sh --artifacts "$RUNNER_TEMP/built/archives" \
            --layout "$RUNNER_TEMP/layout" --version "$VERSION" --compatibility "$COMPATIBILITY" \
            --revision "$GITHUB_SHA" --verifier proxy/target/release/examples/verify_guest_oci
      - name: Authenticate with the repository publication token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: stage
        name: Upload and read back every archive and the complete index
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMPATIBILITY: ${{ inputs.compatibility || 'v1' }}
        run: |
          scripts/publish_guest_oci.sh --from-layout --layout "$RUNNER_TEMP/layout" \
            --version "$VERSION" --compatibility "$COMPATIBILITY" --revision "$GITHUB_SHA" \
            --verifier proxy/target/release/examples/verify_guest_oci --publish ghcr.io/craigbalding/safeyolo-guest
          echo "index=$(oras resolve --oci-layout "$RUNNER_TEMP/layout:$VERSION")" >> "$GITHUB_OUTPUT"
          echo "staged_at=$(cat "$RUNNER_TEMP/layout/verified-staged-at.txt")" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          oras version > "$RUNNER_TEMP/built/provenance/publisher-oras.txt"
          { rustc -Vv; cargo --version; sha256sum proxy/Cargo.lock scripts/publish_guest_oci.sh; } \
            > "$RUNNER_TEMP/built/provenance/publisher-builder.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-guest-provenance
          path: ${{ runner.temp }}/built/provenance
          if-no-files-found: error

  receipt:
    # This follows the completed stage job. A failed stage cannot acquire age.
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-guest-provenance
          path: ${{ runner.temp }}/provenance
      - env:
          GUEST_INPUTS: ${{ runner.temp }}/provenance/inputs.json
        run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Attach the original staging receipt and inventories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEX: ${{ needs.stage.outputs.index }}
          STAGED_AT: ${{ needs.stage.outputs.staged_at }}
          STAGE_ATTEMPT: ${{ needs.stage.outputs.run_attempt }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/publish_guest_oci.sh --record-stage --index "$INDEX" --staged-at "$STAGED_AT" --stage-attempt "$STAGE_ATTEMPT" \
            --provenance "$RUNNER_TEMP/provenance"

  promote:
    # Independent of today's resolve/build/stage jobs, including their failures.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event.schedule == '47 2 * * *' || inputs.activity == 'promote') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the shared native OCI verifier
        env:
          CARGO_BUILD_JOBS: '1'
          SAFEYOLO_BUILD_REVISION: ${{ github.sha }}
        run: scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --example verify_guest_oci
      - name: Consider newest eligible retained candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATIBILITY: ${{ inputs.compatibility || 'v1' }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/publish_guest_oci.sh --promote --compatibility "$COMPATIBILITY" --verifier proxy/target/release/examples/verify_guest_oci \
            --work-directory "$RUNNER_TEMP"

  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.activity == 'inspect' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the maintained publisher
        run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Read the retained promotion decision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_JOB: ${{ inputs.promotion_job }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/publish_guest_oci.sh --inspect --promotion-job "$PROMOTION_JOB" > "$RUNNER_TEMP/guest-inspection.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: guest-promotion-inspection
          path: ${{ runner.temp }}/guest-inspection.json

  record-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.activity == 'record-smoke' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore retained report files
        env:
          SMOKE_REPORTS: ${{ inputs.smoke_reports }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.guest_release import CONTINUATION_REPORTS, SMOKE_REPORTS

          texts = json.loads(os.environ["SMOKE_REPORTS"])
          if (not isinstance(texts, dict) or set(texts) not in (set(SMOKE_REPORTS), set(CONTINUATION_REPORTS))
                  or any(not isinstance(value, str) for value in texts.values())):
              raise ValueError("smoke_reports must contain original runner reports or selection and installed-continuation texts")
          reports = Path(os.environ["RUNNER_TEMP"]) / "retained-reports"
          (reports / "guest").mkdir(parents=True)
          for name in texts:
              (reports / name).write_bytes(texts[name].encode("utf-8"))
          PY
      - name: Install the maintained publisher
        run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Attach retained operator evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_GATE_URL: ${{ inputs.smoke_gate_url }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/guest_release.py record-smoke \
            --reports "$RUNNER_TEMP/retained-reports" --gate-url "$SMOKE_GATE_URL"

  transport-fixture:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.activity == 'transport-fixture' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ inputs.transport_artifact }}
          run-id: ${{ inputs.transport_run }}
          repository: craigbalding/safeyolo
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/seed
      - run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - env:
          CARGO_BUILD_JOBS: '1'
          SAFEYOLO_BUILD_REVISION: ${{ github.sha }}
        run: scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --example verify_guest_oci
      - name: Prepare and publish the nonbootable fixture by digest only
        env:
          SEED_INDEX: ${{ inputs.transport_index }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/prepare_guest_transport_fixture.py --seed-layout "$RUNNER_TEMP/seed" --seed-index "$SEED_INDEX" \
            --output "$RUNNER_TEMP/fixture" --revision "$GITHUB_SHA" --verifier proxy/target/release/examples/verify_guest_oci
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/publish_guest_by_digest.sh "$RUNNER_TEMP/fixture/layout" \
            "$(jq -r '.index.digest' "$RUNNER_TEMP/fixture/fixture.json")" \
            proxy/target/release/examples/verify_guest_oci ghcr.io/craigbalding/safeyolo-guest "$RUNNER_TEMP/fixture/publication"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: guest-transport-fixture-result
          path: |
            ${{ runner.temp }}/fixture/fixture.json
            ${{ runner.temp }}/fixture/publication
