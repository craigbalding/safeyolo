name: Prepare default guest OCI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable guest version (guest-YYYY-MM-DD.N)
        required: true
        type: string
      compatibility:
        description: Guest compatibility identifier
        required: true
        default: v1
        type: string
      publish_initial_g1:
        description: Publish only the retained original guest-2026-10-12.1 after host publication
        required: false
        default: false
        type: boolean
      publish_retained_g2:
        description: Publish the accepted retained guest-2026-10-16.1 without rebuilding guests
        required: false
        default: false
        type: boolean
      publish_transport_fixture:
        description: Generate and publish the nonbootable >2 GiB transport fixture by digest only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Serialize the repository's guest version/channel writes, including retries.
concurrency:
  group: default-guest-publication
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.publish_initial_g1 && !inputs.publish_retained_g2 && !inputs.publish_transport_fixture }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install maintained builder and archive prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            skopeo umoci e2fsprogs rsync curl jq zstd
      - name: Install ARM kernel and initramfs prerequisites
        if: matrix.architecture == 'arm64'
        run: |
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu busybox-static pax-utils cpio pkg-config
      - name: Build the finished default guest outputs
        env:
          ARCH: ${{ matrix.architecture }}
          BUILD_KERNEL: ${{ matrix.architecture == 'arm64' && '1' || '0' }}
          OUTPUT_DIR: ${{ runner.temp }}/guest-build
          TMPDIR: ${{ runner.temp }}/guest-work
        run: |
          mkdir -p "$TMPDIR"
          ./guest/build-all.sh
      - name: Archive backend files and report compressed sizes
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          ./guest/archive-default.sh "linux/$ARCH" "$RUNNER_TEMP/guest-build" "$RUNNER_TEMP/archives/linux-$ARCH"
          if [[ "$ARCH" == arm64 ]]; then
            ./guest/archive-default.sh darwin/arm64 "$RUNNER_TEMP/guest-build" "$RUNNER_TEMP/archives/darwin-arm64"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: guest-archives-${{ matrix.architecture }}
          path: ${{ runner.temp }}/archives
          if-no-files-found: error

  prepare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: guest-archives-*
          merge-multiple: true
          path: ${{ runner.temp }}/archives
      - name: Install pinned ORAS
        run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the shared native OCI verifier
        env:
          CARGO_BUILD_JOBS: "1"
          SAFEYOLO_BUILD_REVISION: ${{ github.sha }}
        run: scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --example verify_guest_oci
      - name: Prepare and verify the complete release without registry writes
        env:
          GUEST_VERSION: ${{ inputs.version }}
          GUEST_COMPATIBILITY: ${{ inputs.compatibility }}
          GUEST_REVISION: ${{ github.sha }}
        run: |
          scripts/publish_guest_oci.sh --artifacts "$RUNNER_TEMP/archives" \
            --layout "$RUNNER_TEMP/guest-oci" --version "$GUEST_VERSION" \
            --compatibility "$GUEST_COMPATIBILITY" --revision "$GUEST_REVISION" \
            --verifier proxy/target/release/examples/verify_guest_oci
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-guest-oci-layout
          path: ${{ runner.temp }}/guest-oci
          if-no-files-found: error

  publish:
    # Relay dispatches an accepted release or the digest-only transport fixture.
    # Craig's #237 publication authority includes both; preparation stays default.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_initial_g1 || inputs.publish_retained_g2 || inputs.publish_transport_fixture) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Select retained release and refuse conflicting inputs
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMPATIBILITY: ${{ inputs.compatibility }}
          PUBLISH_INITIAL_G1: ${{ inputs.publish_initial_g1 }}
          PUBLISH_RETAINED_G2: ${{ inputs.publish_retained_g2 }}
          PUBLISH_TRANSPORT_FIXTURE: ${{ inputs.publish_transport_fixture }}
        run: |
          case "$PUBLISH_INITIAL_G1/$PUBLISH_RETAINED_G2/$PUBLISH_TRANSPORT_FIXTURE" in
            true/false/false)
              version=guest-2026-10-12.1
              revision=8234a047d810d543d8c4d1cb1fa9859987be035b
              index=sha256:df0068692909088a90db2c8f9777807404e3b7d8061ee72bc94a5feabd7dc46e
              run_id=38248401312
              archive_ids=11748025327,11746464998
              layout_id=11747551391
              publisher_revision=$revision
              ;;
            false/true/false|false/false/true)
              version=guest-2026-10-16.1
              revision=ee291fba78ab34e4dca630d529ac8083ec29802f
              index=sha256:b5f3b69562fd4b84730813bd3eb0554b351c975bb363a1be9404f0646147c06b
              run_id=38897452318
              archive_ids=12044318477,12044582213
              layout_id=12045630940
              publisher_revision=$GITHUB_SHA
              ;;
            *)
              echo 'Select exactly one guest publication mode.' >&2
              exit 1
              ;;
          esac
          expected_version=$version
          if [[ "$PUBLISH_TRANSPORT_FIXTURE" == true ]]; then
            expected_version=guest-2026-10-16.239
          fi
          if [[ "$REQUESTED_VERSION" != "$expected_version" || "$REQUESTED_COMPATIBILITY" != v1 ]]; then
            echo "Selected publication requires version $expected_version and compatibility v1." >&2
            exit 1
          fi
          printf '%s\n' "GUEST_VERSION=$version" "GUEST_COMPATIBILITY=v1" \
            "GUEST_REVISION=$revision" "GUEST_INDEX=$index" "GUEST_RUN_ID=$run_id" \
            "GUEST_ARCHIVE_IDS=$archive_ids" "GUEST_LAYOUT_ID=$layout_id" \
            "PUBLISHER_REVISION=$publisher_revision" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLISHER_REVISION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: ${{ !inputs.publish_transport_fixture }}
        with:
          artifact-ids: ${{ env.GUEST_ARCHIVE_IDS }}
          run-id: ${{ env.GUEST_RUN_ID }}
          repository: craigbalding/safeyolo
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ${{ runner.temp }}/archives
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ env.GUEST_LAYOUT_ID }}
          run-id: ${{ env.GUEST_RUN_ID }}
          repository: craigbalding/safeyolo
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ${{ runner.temp }}/retained-guest-oci
      - name: Install pinned ORAS
        run: |
          scripts/install_oras.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the shared native OCI verifier
        env:
          CARGO_BUILD_JOBS: "1"
          SAFEYOLO_BUILD_REVISION: ${{ env.PUBLISHER_REVISION }}
        run: scripts/cargo_with_space.sh build --release --manifest-path proxy/Cargo.toml --locked --example verify_guest_oci
      - name: Verify retained inputs before registry authentication
        if: ${{ !inputs.publish_transport_fixture }}
        run: |
          [[ $(oras resolve --oci-layout "$RUNNER_TEMP/retained-guest-oci:$GUEST_VERSION") == "$GUEST_INDEX" ]]
          proxy/target/release/examples/verify_guest_oci "$RUNNER_TEMP/retained-guest-oci" "$GUEST_INDEX" "$GUEST_COMPATIBILITY"
          scripts/publish_guest_oci.sh --artifacts "$RUNNER_TEMP/archives" \
            --layout "$RUNNER_TEMP/guest-oci" --version "$GUEST_VERSION" \
            --compatibility "$GUEST_COMPATIBILITY" --revision "$GUEST_REVISION" \
            --verifier proxy/target/release/examples/verify_guest_oci
          [[ $(oras resolve --oci-layout "$RUNNER_TEMP/guest-oci:$GUEST_VERSION") == "$GUEST_INDEX" ]]
      - name: Prepare and verify the nonbootable transport fixture
        id: prepare_transport_fixture
        if: ${{ inputs.publish_transport_fixture }}
        run: |
          python3 scripts/prepare_guest_transport_fixture.py \
            --seed-layout "$RUNNER_TEMP/retained-guest-oci" --seed-index "$GUEST_INDEX" \
            --output "$RUNNER_TEMP/transport-fixture" --revision "$GITHUB_SHA" \
            --verifier proxy/target/release/examples/verify_guest_oci
      - name: Authenticate with the linked repository token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Upload, verify and promote the complete guest release
        if: ${{ !inputs.publish_transport_fixture }}
        run: |
          scripts/publish_guest_oci.sh --artifacts "$RUNNER_TEMP/archives" \
            --layout "$RUNNER_TEMP/guest-oci" --version "$GUEST_VERSION" \
            --compatibility "$GUEST_COMPATIBILITY" --revision "$GUEST_REVISION" \
            --verifier proxy/target/release/examples/verify_guest_oci \
            --publish ghcr.io/craigbalding/safeyolo-guest
      - name: Upload the transport fixture without production tags
        if: ${{ inputs.publish_transport_fixture }}
        run: |
          index=$(jq -r '.index.digest' "$RUNNER_TEMP/transport-fixture/fixture.json")
          scripts/publish_guest_transport_fixture.sh "$RUNNER_TEMP/transport-fixture/layout" \
            "$index" proxy/target/release/examples/verify_guest_oci \
            ghcr.io/craigbalding/safeyolo-guest "$RUNNER_TEMP/transport-fixture/publication"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() && inputs.publish_transport_fixture && steps.prepare_transport_fixture.outcome == 'success' }}
        with:
          name: guest-transport-fixture-result
          path: |
            ${{ runner.temp }}/transport-fixture/fixture.json
            ${{ runner.temp }}/transport-fixture/publication
          if-no-files-found: error
