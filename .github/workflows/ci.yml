name: CI

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
# Reduces runner minutes for iterative PR pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-addons:
    name: Test Addons (Python ${{ matrix.python-version }})${{ matrix.os != 'ubuntu-latest' && format(' ({0})', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Normal PRs and pushes use quick checks. Full retained tests run overnight.
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["3.12", "3.13"]') || fromJSON('["3.12"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Quick runner and workflow checks
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          uv run --frozen pytest -q tests/test_blackbox_harness.py tests/test_blackbox_sinkhole.py \
            tests/test_kvm_p1_route.py tests/test_p2_installed_fixture.py \
            tests/test_installed_host_smoke.py tests/test_blackbox_cadence_contract.py \
            tests/test_proxy_rust_ci_events.py tests/test_workflow_action_pins.py

      - name: All retained Python tests overnight
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run --frozen pytest tests/ -v --tb=short --ignore=tests/blackbox/ --ignore=tests/proxy_contracts/

  test-cli:
    name: Test CLI${{ matrix.os != 'ubuntu-latest' && format(' ({0})', matrix.os) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Stage-0 coord acceptance extracts the exact PR base revision and
          # runs the exact candidate head (not GitHub's synthetic PR merge)
          # against the same SQLite + JetStream stores.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install CLI test system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 socat

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Stage-0 two-revision coord upgrade acceptance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SAFEYOLO_RUN_TWO_REVISION_ACCEPTANCE: "1"
          SAFEYOLO_COORD_ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SAFEYOLO_COORD_ACCEPTANCE_REPORT: ${{ runner.temp }}/stage0-acceptance.json
        run: |
          export SAFEYOLO_COORD_ACCEPTANCE_BASE_SHA="$(git rev-parse HEAD~1)"
          uv run --frozen pytest cli/tests/test_coord_kernel_upgrade_acceptance.py -v --tb=short

      - name: Upload Stage-0 coord acceptance evidence
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coord-stage0-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/stage0-acceptance.json

      - name: Quick CLI checks
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          uv run --frozen pytest -q cli/tests/test_config.py cli/tests/test_api.py \
            cli/tests/test_sockets.py cli/tests/test_rust_proxy.py cli/tests/test_policy_cli.py

      - name: All retained CLI tests overnight
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run --frozen pytest cli/tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The skill-marker drift check diffs against the PR base or the
          # previous push. `fetch-depth: 0` gives it the history it needs.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.24"
          prune-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check Python syntax
        run: find cli/src -name "*.py" -exec uv run python -m py_compile {} \;

      - name: Validate Dispatch publication tree
        run: uv run python scripts/check_dispatch_site.py

      - name: Test assurance contracts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          uv run python scripts/check_test_assurance.py --range "$BASE..HEAD"

      - name: Lint with ruff
        run: uv run ruff check cli/src/ tests/ --exclude tests/blackbox/

      # Blackbox docstring schema — every test class and function must
      # declare Title/What/Why. Uses AST validation (no pytest collection),
      # so runs without VM, sinkhole, or runsc — just parses the source.
      - name: Blackbox docstring schema
        run: uv run python tests/blackbox/_docstring_lint.py

      # docs/blackbox-coverage.md is generated from test docstrings.
      # --check mode fails if the on-disk doc is stale, catching
      # regressions where a test was updated but the doc wasn't regen'd.
      - name: Blackbox coverage doc in sync
        run: uv run python tests/blackbox/gen_docs.py --check

      # Skill marker / reference drift: any source line carrying a
      # `# SKILL: <ref>` marker cannot change without a matching update to
      # the referenced skill reference. Picks the right diff range for
      # pull_request vs push, falling back to HEAD~1 for the zero-sha
      # initial-commit case.
      - name: Skill marker drift check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          python3 scripts/check_skill_markers.py --range "$BASE..HEAD"

      # Triage-graph render freshness: the YAML is source of truth, the
      # sibling .mmd is regenerated by scripts/render_skill_graph.py.
      # --check fails if a rebuild would change any .mmd, catching the
      # "edited YAML but forgot to regenerate mermaid" mistake.
      - name: Skill triage graph render check
        run: uv run python scripts/render_skill_graph.py --check

      # User-facing docs cannot reference `safeyolo <cmd>` invocations or
      # flags that do not exist in the current Typer surface. Needs
      # SafeYolo importable, which the earlier `uv sync` step provides.
      - name: Doc CLI-flag drift check
        run: uv run python scripts/check_doc_cli_flags.py

      # Pinned values in source (rootfs size, mise/gh versions, attribution
      # CIDR, admin API bind, uid mapping) must match what user-facing docs
      # quote. Assertions live in scripts/doc_constants.toml.
      - name: Doc constants drift check
        run: uv run python scripts/check_doc_constants.py

      # The blackbox workflow is the source of truth for scheduled full lanes
      # and public artifact publication. Marked cadence tables must match it.
      - name: Blackbox cadence docs in sync
        run: uv run python scripts/check_blackbox_cadence.py

      # Repo-relative link check on the user-facing doc allowlist. External
      # URLs deliberately skipped to keep CI offline-safe.
      - name: Doc repo-relative link check
        run: uv run python scripts/check_doc_links.py

      # Forbidden-phrase check: fails if any user-facing doc contains a
      # blacklisted phrase (stale mechanism claims for code removed months
      # ago). See scripts/doc_forbidden.toml.
      - name: Doc forbidden-phrase check
        run: uv run python scripts/check_doc_forbidden.py
