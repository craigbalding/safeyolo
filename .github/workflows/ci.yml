name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
# Reduces runner minutes for iterative PR pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-addons:
    name: Test Addons (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs run only 3.12 for faster feedback; push to main runs full matrix.
        # Rationale: most regressions caught by one version; full coverage on merge.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.9.24"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run addon tests
        run: uv run pytest tests/ -v --tb=short --ignore=tests/blackbox/

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Stage-0 coord acceptance extracts the exact PR base revision and
          # runs its real APIs against the same SQLite + JetStream stores.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.9.24"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install CLI test system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends socat

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Stage-0 two-revision coord upgrade acceptance
        env:
          SAFEYOLO_RUN_TWO_REVISION_ACCEPTANCE: "1"
          SAFEYOLO_COORD_ACCEPTANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SAFEYOLO_COORD_ACCEPTANCE_REPORT: ${{ runner.temp }}/stage0-acceptance.json
        run: >-
          uv run pytest cli/tests/test_coord_kernel_upgrade_acceptance.py
          -v --tb=short

      - name: Upload Stage-0 coord acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coord-stage0-acceptance
          path: ${{ runner.temp }}/stage0-acceptance.json

      - name: Run CLI tests
        run: uv run pytest cli/tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The skill-marker drift check diffs against the PR base or the
          # previous push. `fetch-depth: 0` gives it the history it needs.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.9.24"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check Python syntax
        run: find cli/src -name "*.py" -exec uv run python -m py_compile {} \;

      - name: Test assurance contracts
        run: uv run python scripts/check_test_assurance.py

      - name: Lint with ruff
        run: uv run ruff check cli/src/ tests/ --exclude tests/blackbox/

      # Blackbox docstring schema — every test class and function must
      # declare Title/What/Why. Uses AST validation (no pytest collection),
      # so runs without VM, sinkhole, or runsc — just parses the source.
      - name: Blackbox docstring schema
        run: uv run python tests/blackbox/_docstring_lint.py

      # docs/blackbox-coverage.md is generated from test docstrings.
      # --check mode fails if the on-disk doc is stale, catching
      # regressions where a test was updated but the doc wasn't regen'd.
      - name: Blackbox coverage doc in sync
        run: uv run python tests/blackbox/gen_docs.py --check

      # Skill marker / reference drift: any source line carrying a
      # `# SKILL: <ref>` marker cannot change without a matching update to
      # the referenced skill reference. Picks the right diff range for
      # pull_request vs push, falling back to HEAD~1 for the zero-sha
      # initial-commit case.
      - name: Skill marker drift check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          python3 scripts/check_skill_markers.py --range "$BASE..HEAD"

      # Triage-graph render freshness: the YAML is source of truth, the
      # sibling .mmd is regenerated by scripts/render_skill_graph.py.
      # --check fails if a rebuild would change any .mmd, catching the
      # "edited YAML but forgot to regenerate mermaid" mistake.
      - name: Skill triage graph render check
        run: uv run python scripts/render_skill_graph.py --check

      # User-facing docs cannot reference `safeyolo <cmd>` invocations or
      # flags that do not exist in the current Typer surface. Needs
      # SafeYolo importable, which the earlier `uv sync` step provides.
      - name: Doc CLI-flag drift check
        run: uv run python scripts/check_doc_cli_flags.py

      # Pinned values in source (rootfs size, mise/gh versions, attribution
      # CIDR, admin API bind, uid mapping) must match what user-facing docs
      # quote. Assertions live in scripts/doc_constants.toml.
      - name: Doc constants drift check
        run: uv run python scripts/check_doc_constants.py

      # Repo-relative link check on the user-facing doc allowlist. External
      # URLs deliberately skipped to keep CI offline-safe.
      - name: Doc repo-relative link check
        run: uv run python scripts/check_doc_links.py

      # Forbidden-phrase check: fails if any user-facing doc contains a
      # blacklisted phrase (stale mechanism claims for code removed months
      # ago). See scripts/doc_forbidden.toml.
      - name: Doc forbidden-phrase check
        run: uv run python scripts/check_doc_forbidden.py
