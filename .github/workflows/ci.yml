# Temporary #1527 focused producer/consumer proof; not a merge candidate.
name: CI
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '1'
      SAFEYOLO_BUILD_REVISION: ${{ github.sha }}
      SAFEYOLO_BUILD_PROFILE: production
      SAFEYOLO_CARGO_RESERVE_GIB: '10'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - name: Install uv for the existing source-binding check
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.9.24
        prune-cache: true
    - name: Check acceptance tool source bindings before compilation
      run: |
        uv export --frozen --only-group dev --no-emit-workspace --format requirements-txt --output-file "$RUNNER_TEMP/source-bindings.txt" > /dev/null
        uv venv --python 3.12 .venv-source-bindings
        .venv-source-bindings/bin/python - "$RUNNER_TEMP/source-bindings.txt" <<'PY'
        import runpy
        import subprocess
        import sys
        import tomllib
        from pathlib import Path

        lock = tomllib.loads(Path("uv.lock").read_text())
        requirements = [f"{package['name']}=={package['version']}" for package in lock["package"]
                        if package["name"] in ("pytest", "pyyaml")]
        subprocess.run(["uv", "pip", "install", "--python", sys.executable, "--require-hashes",
                        "--constraint", sys.argv[1], *requirements], check=True)
        runpy.run_path("cli/tests/test_host_setup_scripts.py")["test_safeyolo_acceptance_graph_tool_hashes_match_sources"]()
        PY
    - name: Install the pinned Rust toolchain
      working-directory: proxy
      run: |
        rustup show active-toolchain
        printf 'RUSTUP_TOOLCHAIN=%s\n' "$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        cmd-format: bash "${{ github.workspace }}/scripts/rust_cache_command.sh" {0}
        workspaces: |
          proxy -> target
          guest/command -> target
        shared-key: production-focused-pr
        cache-bin: false
        save-if: 'false'
    - name: Assess restored verifier and build footprint
      run: |
        df -Pk "$RUNNER_TEMP"
        du -sk proxy/target || true
        if [[ -x proxy/target/release/examples/verify_guest_oci ]]; then file proxy/target/release/examples/verify_guest_oci; fi
    - name: Reuse matching Linux guest OCI verifier
      id: reuse_verifier
      if: 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        INPUT_PLATFORM: linux-amd64
        REQUIRE_SUCCESSFUL_RUN: 'false'
      run: |
        qualification=()
        if [[ "$REQUIRE_SUCCESSFUL_RUN" == true ]]; then qualification+=(--require-successful-run); fi
        python3 scripts/select_blackbox_artifacts.py --native-input guest-oci-verifier \
          --platform "$INPUT_PLATFORM" --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
          --branch "$DEFAULT_BRANCH" --output "$RUNNER_TEMP/guest-oci-verifier" "${qualification[@]}"
    - name: Build Linux guest OCI verifier
      if: true && steps.reuse_verifier.outputs.reused != 'true'
      shell: bash
      run: |
        options=()
        directory=debug
        if [[ "$SAFEYOLO_BUILD_PROFILE" == production ]]; then options+=(--release); directory=release; fi
        scripts/cargo_with_space.sh build --manifest-path proxy/Cargo.toml --locked --example verify_guest_oci "${options[@]}"
        mkdir -p "$RUNNER_TEMP/guest-oci-verifier"
        install -m 0755 "proxy/target/$directory/examples/verify_guest_oci" "$RUNNER_TEMP/guest-oci-verifier/verify_guest_oci"
        source scripts/native_package.sh
        python3 scripts/select_blackbox_artifacts.py --native-input guest-oci-verifier --save-native-input \
          --platform "$(host_platform)" --profile "$SAFEYOLO_BUILD_PROFILE" --revision "$SAFEYOLO_BUILD_REVISION" \
          --output "$RUNNER_TEMP/guest-oci-verifier"
    - name: Check Linux guest OCI verifier executable
      if: 'true'
      shell: bash
      run: |
        source scripts/native_package.sh
        native_executable "$RUNNER_TEMP/guest-oci-verifier/verify_guest_oci" "$(host_platform)"
    - name: Upload Linux guest OCI verifier
      if: 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: linux-guest-oci-verifier-amd64-production
        path: |
          ${{ runner.temp }}/guest-oci-verifier/verify_guest_oci
          ${{ runner.temp }}/guest-oci-verifier/native-input.json
        if-no-files-found: error
  test-addons:
    name: Test Addons (Python ${{ matrix.python-version }})${{ matrix.os != 'ubuntu-latest' && format(' ({0})', matrix.os)
      || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.13'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.9.24
        prune-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --frozen --group dev
    - name: Download production native test inputs
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ${{ runner.os == 'macOS' && 'darwin-host-arm64-production' || 'linux-host-amd64-production' }}
        path: proxy/target/release
        run-id: 43204497532
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Download production guest test inputs
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: linux-guest-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}-production
        path: guest/command/target/release
        run-id: 43204497532
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Restore native test executable permissions
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        chmod +x proxy/target/release/safeyolo proxy/target/release/safeyolo-coord proxy/target/release/safeyolo-proxy
        chmod +x guest/command/target/release/safeyolo-guest guest/command/target/release/safeyolo-coord
        source scripts/native_package.sh
        verify_native_artifacts proxy/target/release guest/command/target/release production "$(host_platform)"
    - name: Download Linux guest OCI verifier
      if: runner.os == 'Linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: linux-guest-oci-verifier-amd64-production
        path: ${{ runner.temp }}/guest-oci-verifier
    - name: Prepare Linux publisher tools
      if: runner.os == 'Linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      env:
        SAFEYOLO_BUILD_REVISION: ${{ github.sha }}
      run: |
        scripts/install_oras.sh "$RUNNER_TEMP/test-tools"
        verifier="$RUNNER_TEMP/guest-oci-verifier/verify_guest_oci"
        chmod +x "$verifier"
        source scripts/native_package.sh
        native_executable "$verifier" "$(host_platform)"
        jq -e --arg revision "$SAFEYOLO_BUILD_REVISION" --arg platform "$(host_platform)" \
          --arg checksum "$(file_sha256 "$verifier")" --arg lock "$(file_sha256 proxy/Cargo.lock)" \
          '.schema == "safeyolo.native-input/v1" and .source_revision == $revision and
           .platform == $platform and .profile == "production" and .kind == "guest-oci-verifier" and
           .settings.profile == "release" and .settings.cargo_lock_sha256 == $lock and
           .files == {verify_guest_oci: $checksum}' "$RUNNER_TEMP/guest-oci-verifier/native-input.json"
        cat "$RUNNER_TEMP/guest-oci-verifier/native-input.json"
        printf 'ORAS=%s/test-tools/oras\nGUEST_OCI_VERIFIER=%s\n' "$RUNNER_TEMP" "$verifier" >> "$GITHUB_ENV"
    - name: Retain original runner tool versions
      shell: bash
      run: |
        {
          uname -a
          cat /etc/os-release
          id
          uv --version
          uv run --frozen python -VV
          uv run --frozen pytest --version
          command -v tar du zstd sudo
          command -v oras jq || true
          printf 'ORAS=%s GUEST_OCI_VERIFIER=%s\n' "${ORAS:-unset}" "${GUEST_OCI_VERIFIER:-unset}"
          tar --version
          du --version
          zstd --version
          sudo --version
        } 2>&1 | tee "${{ runner.temp }}/publisher-tool-versions.log"
        "$ORAS" version
        file "$GUEST_OCI_VERIFIER"
    - name: Remaining named publisher cases
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      env:
        SAFEYOLO_NATIVE_ARTIFACTS: ${{ github.workspace }}/proxy/target/release
        SAFEYOLO_RUST_PROXY: ${{ github.workspace }}/proxy/target/release/safeyolo-proxy
        SAFEYOLO_GUEST_ARTIFACTS: ${{ github.workspace }}/guest/command/target/release
        SAFEYOLO_GUEST_HELPER: ${{ github.workspace }}/guest/command/target/release/safeyolo-guest
      shell: bash
      run: |
        uv run --frozen pytest tests/ \
          -k 'test_actual_oras_local_release_and_no_registry_writes or test_explicit_custom_profile_publishes_one_consumer_with_input_provenance or test_custom_workflow_verifies_exact_selected_inputs_before_authentication or test_custom_workflow_publishes_same_bytes_and_requires_complete_readback or test_custom_layout_upload_download_preserves_bytes_and_extracts_the_layout_root or test_actual_oras_publication_retry_versions_and_generations or test_corrupt_readback_does_not_promote or test_invalid_release_refused_before_upload or test_digest_only_transport_has_no_channel_write or test_real_oras_receipt_attachment_discovery_and_inventory_retrieval' \
          --ignore=tests/blackbox/ --ignore=tests/proxy_contracts/ \
          -vv -rs --tb=long --setup-show --maxfail=1 \
          --timeout=60 --timeout-method=signal -o faulthandler_timeout=30 \
          2>&1 | tee "${{ runner.temp }}/publisher-remaining-original.log"
    - name: Preserve diagnosis output
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: publisher-ubuntu313-repaired
        path: |
          ${{ runner.temp }}/publisher-tool-versions.log
          ${{ runner.temp }}/publisher-remaining-original.log
          ${{ runner.temp }}/guest-oci-verifier/native-input.json
          ${{ runner.temp }}/test-tools/oras-inputs.json
    needs: build
'on':
  workflow_dispatch: null
