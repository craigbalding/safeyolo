schema = "safeyolo.factory/v1"
name = "claude-mixed"
room = "claude-mixed"

[operator_input]
to = "worker"
types = ["DIRECTION"]

[roles.worker]
agent = "proof-claude-mixed"
harness = "claude"
args = ["--model", "haiku"]
contract = "role.md"

[roles.codex]
agent = "proof-codex"
harness = "codex"
contract = "role.md"

[roles.pi]
agent = "proof-pi"
harness = "pi"
contract = "role.md"

[work]
authorities = ["worker"]
deciders = ["worker"]
independent = true
