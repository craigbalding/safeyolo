# Authored control meaning and dispositions from issue #1557.
# Existence, exact identities and selectors are resolved from maintained source.

[[controls]]
id = "BB-01"
control = "Direct network egress"
source = "https://github.com/craigbalding/safeyolo/blob/c9543b5c68fd86d218e61e32320864b337c52b9d/tests/blackbox/isolation/test_vm_isolation.py"
what = "TCP, IPv6 and metadata routes cannot bypass the proxy."
existing = "Guest BB; nightly."
conformance = "Host TCP receivers compare delivered bytes with independent before/after controls. Assigned non-loopback destinations and actual network context are retained. User/root IPv4/IPv6 and owned metadata delivery checks have [independent Linux systrap acceptance at 91f805e0](https://github.com/craigbalding/safeyolo/issues/1560#issuecomment-7141516865). KVM/VZ delivery remains unproved."
effort = "M"
comments = "Exercise ordinary agent and guest root."
owner = "#1560"
decisions = ["authorization"]

[[controls]]
id = "BB-02"
control = "DNS/UDP egress"
source = "https://github.com/craigbalding/safeyolo/blob/c9543b5c68fd86d218e61e32320864b337c52b9d/tests/blackbox/isolation/test_vm_isolation.py"
what = "Queries/datagrams cannot leak even when no response returns."
existing = "Guest BB; nightly."
conformance = "Owned UDP/TCP receivers record unique DNS payloads independently of replies. The disposable guest selects the owned libc resolver temporarily and restores the prior file state. Raw datagram observations retain their 91f805e0 scope. The corrected libc resolver has [independent Linux systrap acceptance at cd86f5d7](https://github.com/craigbalding/safeyolo/issues/1560#issuecomment-7142642432). KVM/VZ delivery remains unproved."
effort = "M"
comments = "Share receiver infrastructure with BB-01."
owner = "#1560"
decisions = ["authorization"]

[[controls]]
id = "BB-03"
control = "Guest-root containment"
source = "https://github.com/craigbalding/safeyolo/blob/c9543b5c68fd86d218e61e32320864b337c52b9d/tests/blackbox/isolation/test_vm_isolation.py"
what = "Guest administration cannot modify host configuration or access host processes/devices."
existing = "Guest BB; nightly."
conformance = "UID mapping/read-only checks remain. Host file/process canaries replace PID-name and null-pointer inferences. BPF uses valid architecture-specific attributes and nonnegative-FD semantics; device creation and use are distinct. The corrected elevated device/canary probe has [independent Linux systrap acceptance at cd86f5d7](https://github.com/craigbalding/safeyolo/issues/1560#issuecomment-7142642432). KVM/VZ containment remains unproved."
effort = "M"
comments = "Guest root is intentionally allowed; device-node creation and device use are different claims."
owner = "#1560"
decisions = ["other_sinks_and_launch"]

