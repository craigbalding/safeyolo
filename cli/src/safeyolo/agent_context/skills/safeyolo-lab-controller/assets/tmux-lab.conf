# UI profile for a SafeYolo guest lab tmux.
# This file launches no shell, harness, or provider. UI-only hooks call the
# layout helper path that the safeyolo-lab launcher registers.

# Use one guest prefix for direct and host-tmux terminal paths.
set-option -g prefix C-a
set-option -g prefix2 None
bind-key C-a send-prefix

set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-style 'bg=colour235,fg=colour250'
set-option -g status-left-length 200
set-option -g status-right-length 140
set-option -g status-left '#{?#{@safeyolo_lab_size_warning},#[bg=colour160]#[fg=white]#[bold] #{@safeyolo_lab_size_warning} #[default],#{?#{==:#{@safeyolo_lab_role},lesson},#[fg=colour45]#[bold] Lesson #[default]| Left/Right: pages | #{?#{@safeyolo_lab_sources_file},o: source | ,}#{?#{@safeyolo_lab_questions_file},q: questions | ,}F12: ask controller,#[fg=colour46]#[bold] SafeYolo lab #[default]#{?#{@safeyolo_lab_lesson_pane},| F12: open lesson,} | C-a q: panes | C-a e: mark | C-a E: explain }}'
set-option -g status-right '#{?#{@safeyolo_lab_size_warning},,#[fg=colour244]#{socket_path} #[fg=colour250]#{t:%Y-%m-%dT%H:%M:%SZ} }'
set-option -g 'status-format[1]' '#[align=left]#{?#{@safeyolo_lab_annotation_state},#[bg=#{@safeyolo_lab_annotation_bg}]#[fg=white]#[bold] #{@safeyolo_lab_annotation_id} #{@safeyolo_lab_annotation_state} #[default] #{@safeyolo_lab_annotation_pane} | #{?#{@safeyolo_lab_annotation_evidence},"#{@safeyolo_lab_annotation_evidence}" -> ,}#{?#{@safeyolo_lab_annotation_explanation},#{@safeyolo_lab_annotation_explanation},#{@safeyolo_lab_annotation_text}},}'
set-option -g message-style 'bg=colour166,fg=white,bold'
set-option -g display-panes-time 3000
set-option -g display-panes-colour colour33
set-option -g display-panes-active-colour colour46

set-option -g history-limit 100000
set-option -g remain-on-exit off
set-option -g allow-rename off
set-window-option -g automatic-rename off

set-window-option -g pane-border-status top
set-window-option -g pane-border-style 'fg=colour240'
set-window-option -g pane-active-border-style 'fg=colour46,bold'
set-window-option -g pane-border-format ' #{pane_id} #{@safeyolo_lab_role} #{pane_title}#{?#{@safeyolo_lab_state}, | #[bg=#{?#{@safeyolo_lab_annotation_bg},#{@safeyolo_lab_annotation_bg},colour24}]#[fg=white]#[bold] #{?#{@safeyolo_lab_annotation_id},#{@safeyolo_lab_annotation_id} ,}#{@safeyolo_lab_state} #[default] #{@safeyolo_lab_note},} '

set-window-option -g @safeyolo_lab_auto_layout on
set-window-option -g @safeyolo_lab_focus_target controller
set-window-option -g @safeyolo_lab_lesson_pane ''
set-window-option -g @safeyolo_lab_layout single
set-window-option -g @safeyolo_lab_size_warning ''
set-window-option -g @safeyolo_lab_annotation_pane ''
set-window-option -g @safeyolo_lab_annotation_id ''
set-window-option -g @safeyolo_lab_annotation_state ''
set-window-option -g @safeyolo_lab_annotation_bg ''
set-window-option -g @safeyolo_lab_annotation_text ''
set-window-option -g @safeyolo_lab_annotation_evidence ''
set-window-option -g @safeyolo_lab_annotation_explanation ''

bind-key q display-panes -d 3000
bind-key e run-shell -b '"#{@safeyolo_lab_annotation_script}" --client "#{client_name}" --toggle-highlight'
bind-key E run-shell -b '"#{@safeyolo_lab_annotation_script}" --client "#{client_name}" --popup'
bind-key -n F12 run-shell -b '"#{@safeyolo_lab_surface_script}" --client "#{client_name}" --pane "#{pane_id}"'
bind-key -n q if-shell -F '#{&&:#{==:#{@safeyolo_lab_role},lesson},#{@safeyolo_lab_questions_file}}' 'run-shell -b "\"#{@safeyolo_lab_questions_script}\" menu --client \"#{client_name}\" --pane \"#{pane_id}\""' 'send-keys q'
bind-key -n Q if-shell -F '#{&&:#{==:#{@safeyolo_lab_role},lesson},#{@safeyolo_lab_questions_file}}' 'run-shell -b "\"#{@safeyolo_lab_questions_script}\" menu --client \"#{client_name}\" --pane \"#{pane_id}\""' 'send-keys Q'
bind-key -n o if-shell -F '#{&&:#{==:#{@safeyolo_lab_role},lesson},#{@safeyolo_lab_sources_file}}' 'run-shell -b "\"#{@safeyolo_lab_sources_script}\" menu --client \"#{client_name}\" --pane \"#{pane_id}\""' 'send-keys o'

set-hook -g 'client-attached[190]' 'run-shell -b "#{@safeyolo_lab_layout_script} --socket #{socket_path} --session lab"'
set-hook -g 'client-resized[190]' 'run-shell -b "#{@safeyolo_lab_layout_script} --socket #{socket_path} --session lab"'
set-hook -g 'after-split-window[190]' 'run-shell -b "#{@safeyolo_lab_layout_script} --socket #{socket_path} --session lab"'
set-hook -g 'after-kill-pane[190]' 'run-shell -b "#{@safeyolo_lab_layout_script} --socket #{socket_path} --session lab"'
