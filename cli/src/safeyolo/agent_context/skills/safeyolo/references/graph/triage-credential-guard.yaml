# Triage graph: "why is credential-guard questioning my request?"
#
# Entry question: an outbound request carrying an Authorization / API-key
# header (or a credential-shaped value in URL/body) was blocked, modified,
# or flagged by SafeYolo's credential-guard sensor. This graph disambiguates
# rule-matched vs entropy-fallback (`unknown_secret`) vs leak detection vs
# destination mismatch, and points at the right self-correction or operator
# ask.
#
# See schema comment in `triage-request-failing.yaml` for field definitions.

see_also:
  - graph: triage-request-failing
    when: "the failure is a status code without X-Blocked-By (probably upstream, not credential-guard)"
  - graph: triage-approval-required
    when: "the response body has action == wait_for_approval"
  - graph: triage-service-gateway
    when: "the desired call has a gated equivalent (gmail, jira, etc.) and using a raw credential is the wrong tool"

nodes:
  # ---- Symptoms --------------------------------------------------------
  - id: sym.credguard_428_destination_mismatch
    kind: symptom
    label: "428 with `type: destination_mismatch`"
    detail: "Credential fingerprint recognised; destination not in allowed_hosts for that credential."
    keywords: ["destination_mismatch", "wrong host", "credential-guard", "428", "not allowed for this token"]
    source: authored

  - id: sym.credguard_428_requires_approval
    kind: symptom
    label: "428 with `type: requires_approval`"
    detail: "Credential first-seen at this destination; operator must approve."
    keywords: ["requires_approval", "credential-guard", "first use", "safeyolo watch"]
    source: authored

  - id: sym.credguard_403_leak
    kind: symptom
    label: "403 with a `credential leak detected` reason"
    detail: "Scanner pattern matched a credential in body/URL (e.g. ghp_, gho_, sk-, RSA PRIVATE KEY)."
    keywords: ["leak", "detected", "scanner pattern", "ghp_", "gho_", "sk-", "private key", "block", "critical"]
    source: authored

  - id: sym.credguard_unknown_secret
    kind: symptom
    label: "Block reason mentions `unknown_secret` / `tier: 2`"
    detail: "Entropy fallback fired: header value looked like a secret but matched no rule."
    keywords: ["unknown_secret", "tier 2", "entropy", "high entropy", "medium confidence"]
    source: authored

  - id: sym.credguard_no_perm_hit
    kind: symptom
    label: "Bearer token in request, no credential:use permission on target host"
    detail: "Credential classified but no matching allow rule; policy default is deny."
    keywords: ["no permission", "credential:use", "not allowed", "policy denied", "no allow rule"]
    source: authored

  - id: sym.credguard_which_cred
    kind: symptom
    label: "Not sure which credential I'm actually sending upstream"
    detail: "The request has multiple auth-shaped headers, or I inherited an env-var credential I didn't set."
    keywords: ["which credential", "which token", "auth header", "GH_TOKEN", "OPENAI_API_KEY", "inspection"]
    source: authored

  # ---- Evidence --------------------------------------------------------
  - id: ev.credguard_read_response_body
    kind: evidence
    label: "Parse block response body for `type`, `action`, `rule_name`, `fingerprint`, `allowed_hosts`"
    source: authored

  - id: ev.credguard_check_config_rules
    kind: evidence
    label: "GET /config -- inspect `credential_rules` (policy-supplied only; DEFAULT_RULES load separately unless use_default_credential_rules=false)"
    source: authored

  - id: ev.credguard_check_policy_permissions
    kind: evidence
    label: "GET /policy -- find `credential:use` permissions on target host; note allowed credential list"
    source: authored

  - id: ev.credguard_inspect_outbound_headers
    kind: evidence
    label: "Log my own outbound Authorization / X-API-Key / cookie header before sending; do not print the raw value, only shape (length, prefix)"
    detail: "Never print raw credentials into chat, files, or logs."
    source: authored

  - id: ev.credguard_check_scan_patterns
    kind: evidence
    label: "GET /config -- inspect `scan_patterns` for the pattern that matched (leak case)"
    source: authored

  - id: ev.credguard_explain_request_id
    kind: evidence
    label: "GET /explain?request_id=req-... for the classification decision trail"
    source: authored

  - id: ev.credguard_check_trace_request_id
    kind: evidence
    label: "GET /trace?request_id=req-... — was credential-guard's request-hook step evaluated/no_detection, evaluated/detected, bypassed, error, or not_loaded?"
    detail: |
      Requires the request to have carried X-SafeYolo-Trace: 1. Look at
      the trace step where addon == 'credential-guard' and hook ==
      'request'. state + reason + outcome fully classify what happened:
        - evaluated / no_detection: guard ran, saw no credentials
        - evaluated / detected: guard ran, matched N credentials
          (details.detection_count) — a subsequent step or block
          response covers the disposition
        - bypassed / policy_disabled: PDP said off for this scope
        - bypassed / prior_response: an earlier addon responded first
        - error / <ExcType>: the request hook raised
        - not_loaded: credential-guard never ran (proxy startup broken)
      See references/agent-api.md for the full wire vocabulary.
    source: authored

  - id: ev.credguard_check_allowed_hosts
    kind: evidence
    label: "Compare block response `allowed_hosts` to the actual URL host"
    source: authored

  # ---- Classifications -------------------------------------------------
  - id: cls.credguard_rule_matched
    kind: classification
    label: "Credential matched a `DEFAULT_RULES` or policy-loaded rule; treated as classified type"
    source: authored

  - id: cls.credguard_entropy_fallback
    kind: classification
    label: "Credential did not match any rule; entropy fallback classified as `unknown_secret`"
    source: authored

  - id: cls.credguard_leak_pattern
    kind: classification
    label: "Scanner pattern detected a credential in body/URL/header value (data-loss-prevention)"
    source: authored

  - id: cls.credguard_dest_wrong_for_this_cred
    kind: classification
    label: "Credential is recognised but the destination is not in its `allowed_hosts`"
    source: authored

  - id: cls.credguard_first_use
    kind: classification
    label: "Credential + destination is a new pair; requires operator approval"
    source: authored

  # Trace-derived classifications (issue #213). Key on the state+reason
  # tuple from /trace. Literals below MUST match constants in
  # references/agent-api.md.
  - id: cls.credguard_trace_no_detection
    kind: classification
    label: "credential-guard ran (state=evaluated) and reported outcome=no_detection"
    detail: "The guard saw no credentials on this request. If the request still failed with a credential-related error, the failure is upstream or the credential was on a scan-only path."
    source: authored

  - id: cls.credguard_trace_detected
    kind: classification
    label: "credential-guard ran (state=evaluated) and reported outcome=detected"
    detail: "The guard matched credentials; details.detection_count > 0. A subsequent trace step or the block response body classifies the disposition (allow/deny/require_approval). Fall through to the block-body branch."
    source: authored

  - id: cls.credguard_trace_policy_disabled
    kind: classification
    label: "credential-guard is disabled by PDP for this scope (state=bypassed, reason=policy_disabled)"
    detail: "PolicyClient.is_addon_enabled returned False. Requires policy edit, not option flip."
    source: authored

  - id: cls.credguard_trace_prior_response
    kind: classification
    label: "credential-guard deferred (state=bypassed, reason=prior_response)"
    detail: "An earlier addon responded before credential-guard could evaluate. The preceding trace step / blocked_by names the earlier responder."
    source: authored

  - id: cls.credguard_trace_not_loaded
    kind: classification
    label: "credential-guard never ran (state=not_loaded)"
    detail: "The addon is missing from proxy.ADDON_CHAIN or failed to load. safeyolo doctor's Pipeline probe (traced) will confirm."
    source: authored

  - id: cls.credguard_trace_error
    kind: classification
    label: "credential-guard's hook raised (state=error, reason=<ExceptionType>)"
    detail: "The addon executed but threw. reason names the exception type; check mitmproxy logs."
    source: authored

  # ---- Conclusions -----------------------------------------------------
  - id: con.credguard_use_correct_dest
    kind: conclusion
    label: "Self-correct: send this credential to a host in its `allowed_hosts`"
    source: authored

  - id: con.credguard_remove_from_body
    kind: conclusion
    label: "Self-correct: remove the credential from body/URL and send via a proper auth header"
    source: authored

  - id: con.credguard_use_gateway
    kind: conclusion
    label: "Prefer a service-gateway capability over a raw credential (see triage-service-gateway)"
    source: authored

  - id: con.credguard_do_not_bypass
    kind: conclusion
    label: "Do NOT try to bypass detection (obfuscate, split, encode). Route via approval or gateway."
    source: authored

  # ---- Operator asks ---------------------------------------------------
  - id: ask.credguard_watch_for_first_use
    kind: operator_ask
    label: "Ask operator to run `safeyolo watch` and approve/deny this credential+destination pair"
    source: authored

  - id: ask.credguard_pre_approve_hmac
    kind: operator_ask
    label: "If a specific credential should be pre-approved for this host, ask operator to add its hmac fingerprint to policy `credential:use`"
    source: authored


edges:
  # Every credential-guard symptom starts by reading the block body
  - {from: sym.credguard_428_destination_mismatch, to: ev.credguard_read_response_body, kind: next_check}
  - {from: sym.credguard_428_requires_approval,    to: ev.credguard_read_response_body, kind: next_check}
  - {from: sym.credguard_403_leak,                 to: ev.credguard_read_response_body, kind: next_check}
  - {from: sym.credguard_unknown_secret,           to: ev.credguard_read_response_body, kind: next_check}
  - {from: sym.credguard_no_perm_hit,              to: ev.credguard_check_policy_permissions, kind: next_check}
  - {from: sym.credguard_which_cred,               to: ev.credguard_inspect_outbound_headers, kind: next_check}

  # Response body drives classification
  - {from: ev.credguard_read_response_body, to: cls.credguard_dest_wrong_for_this_cred, kind: implies, when: "type == destination_mismatch"}
  - {from: ev.credguard_read_response_body, to: cls.credguard_first_use,                kind: implies, when: "type == requires_approval"}
  - {from: ev.credguard_read_response_body, to: cls.credguard_leak_pattern,             kind: implies, when: "action == block AND rule_name in scan patterns (github-pat, github-oauth, google-api-key, private-key, ...)"}
  - {from: ev.credguard_read_response_body, to: cls.credguard_entropy_fallback,         kind: implies, when: "tier == 2 OR rule_name == unknown_secret"}
  - {from: ev.credguard_read_response_body, to: cls.credguard_rule_matched,             kind: implies, when: "tier == 1 AND rule_name is a known type (github, openai, anthropic, ...)"}

  # Destination mismatch -> use the credential where allowed
  - {from: cls.credguard_dest_wrong_for_this_cred, to: ev.credguard_check_allowed_hosts, kind: next_check}
  - {from: ev.credguard_check_allowed_hosts,       to: con.credguard_use_correct_dest,   kind: implies, when: "URL host is a typo or wrong service"}

  # First-use -> approval
  - {from: cls.credguard_first_use, to: ask.credguard_watch_for_first_use, kind: escalates_to}
  - {from: cls.credguard_first_use, to: ask.credguard_pre_approve_hmac,    kind: escalates_to, when: "the credential will be reused often for this host"}

  # Leak -> remove from body/URL and use proper header
  - {from: cls.credguard_leak_pattern, to: ev.credguard_check_scan_patterns, kind: next_check}
  - {from: cls.credguard_leak_pattern, to: con.credguard_remove_from_body,   kind: implies}
  - {from: cls.credguard_leak_pattern, to: con.credguard_do_not_bypass,      kind: implies}

  # Entropy fallback -> either it's actually a credential (fix it) or a false-positive (ask to relax)
  - {from: cls.credguard_entropy_fallback, to: ev.credguard_check_config_rules, kind: next_check}
  - {from: ev.credguard_check_config_rules, to: con.credguard_use_gateway, kind: implies, when: "no rules AND target service has a gateway option"}

  # No credential:use permission -> policy admin
  - {from: ev.credguard_check_policy_permissions, to: ask.credguard_pre_approve_hmac, kind: escalates_to, when: "no credential:use permission exists for this host AND the credential is expected"}
  - {from: ev.credguard_check_policy_permissions, to: con.credguard_use_correct_dest, kind: implies, when: "credential:use permission exists elsewhere but not for this host"}

  # Which-credential -> read outbound headers -> feed the classification path
  - {from: ev.credguard_inspect_outbound_headers, to: ev.credguard_read_response_body, kind: next_check, when: "block response was received"}
  - {from: ev.credguard_inspect_outbound_headers, to: con.credguard_do_not_bypass,     kind: implies, when: "I would need to hide the credential to succeed -- indicates the call is not sanctioned"}

  # Escape hatch: correlate via /explain when the picture is unclear
  - {from: ev.credguard_read_response_body, to: ev.credguard_explain_request_id, kind: next_check, when: "type/action fields are unfamiliar"}

  # Trace escape hatch (issue #213): when /explain leaves gaps or when
  # the question is "did credential-guard even run?", /trace answers
  # deterministically. Requires the request to have carried
  # X-SafeYolo-Trace: 1.
  - {from: ev.credguard_explain_request_id, to: ev.credguard_check_trace_request_id, kind: next_check, when: "/explain empty/ambiguous OR the question is which addon ran vs which recorded"}

  # Trace evidence → per-state classification
  - {from: ev.credguard_check_trace_request_id, to: cls.credguard_trace_no_detection,   kind: implies, when: "step has state=evaluated AND outcome=no_detection"}
  - {from: ev.credguard_check_trace_request_id, to: cls.credguard_trace_detected,       kind: implies, when: "step has state=evaluated AND outcome=detected"}
  - {from: ev.credguard_check_trace_request_id, to: cls.credguard_trace_policy_disabled,kind: implies, when: "step has state=bypassed AND reason=policy_disabled"}
  - {from: ev.credguard_check_trace_request_id, to: cls.credguard_trace_prior_response, kind: implies, when: "step has state=bypassed AND reason=prior_response"}
  - {from: ev.credguard_check_trace_request_id, to: cls.credguard_trace_not_loaded,     kind: implies, when: "credential-guard appears in not_loaded[]"}
  - {from: ev.credguard_check_trace_request_id, to: cls.credguard_trace_error,          kind: implies, when: "step has state=error"}

  # Trace classifications resolve to actionable conclusions
  - {from: cls.credguard_trace_no_detection,   to: con.credguard_use_correct_dest, kind: implies, when: "the failure was not about the credential itself — check destination / upstream response"}
  - {from: cls.credguard_trace_detected,       to: ev.credguard_read_response_body,kind: next_check, when: "loop back to the block-body branch — the detection led to a disposition captured there"}
  - {from: cls.credguard_trace_policy_disabled,to: ask.credguard_pre_approve_hmac, kind: escalates_to, when: "policy needs to enable credential-guard for this host/agent scope"}
  - {from: cls.credguard_trace_prior_response, to: cls.credguard_dest_wrong_for_this_cred, kind: implies, when: "the earlier responder is often a destination check — inspect its blocked_by and cycle back"}
  - {from: cls.credguard_trace_not_loaded,     to: ask.credguard_watch_for_first_use, kind: escalates_to, when: "credential-guard never ran — proxy or ADDON_CHAIN is broken; safeyolo doctor's Pipeline probe (traced) will confirm"}
  - {from: cls.credguard_trace_error,          to: ask.credguard_watch_for_first_use, kind: escalates_to, when: "the addon threw; mitmproxy logs have the traceback for reason=<ExceptionType>"}


entries:
  - symptom: sym.credguard_428_destination_mismatch
  - symptom: sym.credguard_428_requires_approval
  - symptom: sym.credguard_403_leak
  - symptom: sym.credguard_unknown_secret
  - symptom: sym.credguard_no_perm_hit
  - symptom: sym.credguard_which_cred
