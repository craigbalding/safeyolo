# Triage graph: "a request through SafeYolo failed / was blocked / behaved weirdly".
#
# I (the agent operating in a SafeYolo sandbox) use this to bind an observed
# symptom to an entry node, walk the edges as I collect evidence, and land on
# a bounded conclusion or an operator ask — rather than re-deriving the shape
# of SafeYolo's block/upstream/plane story every time.
#
# Schema (kept minimal on purpose; extend when a real triage needs something
# this doesn't cover):
#
#   see_also:                                # optional; cross-graph hints
#     - graph: <other-graph-file-basename>
#       when: "prose condition"
#
#   nodes:
#     - id: unique-slug
#       kind: symptom | evidence | classification | conclusion | operator_ask
#       label: one-line human-readable name
#       detail: prose (optional, only where the label needs it)
#       keywords: [strings]                  # optional; symptom fuzzy-matching
#       source: source path or `authored` (for provenance when I regenerate)
#
#   edges:
#     - from: node-id
#       to: node-id
#       kind: next_check | implies | rules_out | escalates_to
#       when: short condition string (evidence-shape or classification)
#
#   entries:
#     - symptom: node-id       # nodes I can bind an observed symptom to
#
# Traversal protocol I follow when I use this graph in-context:
#   1. Match the observed symptom to an `entries` node. State the match out
#      loud, so the user reading over my shoulder sees the entry choice.
#   2. Follow `next_check` edges to collect evidence; state which endpoint I
#      hit and what field I'm reading.
#   3. Follow `implies` / `rules_out` edges based on the evidence value.
#   4. Land on a `conclusion` or `operator_ask` and stop.
#   5. **Graph gap:** if at any node the evidence I have is not covered by an
#      outgoing edge, say `Graph gap` explicitly, name the node id, and edit
#      this YAML with a new edge before moving on. Do NOT guess and continue.

see_also:
  - graph: triage-credential-guard
    when: "the failure looks credential-related (401 upstream on a credentialed request, credential-guard event, destination mismatch)"
  - graph: triage-approval-required
    when: "response was 428 with `wait_for_approval` action"
  - graph: triage-flow-inspection
    when: "the debugging is about /api/flows/search results rather than a live request"

nodes:
  # ---- Symptoms (what I observed) --------------------------------------
  - id: sym.upstream_401
    kind: symptom
    label: "Upstream returned 401"
    detail: "Client received a 401 from a normal-looking response; no SafeYolo block markers."
    keywords: [401, unauthorized, "auth failed", "bad token", "invalid credentials", upstream]
    source: authored

  - id: sym.status_403
    kind: symptom
    label: "Response was 403"
    keywords: [403, forbidden, denied, "policy denied", "not allowed"]
    source: authored

  - id: sym.status_428
    kind: symptom
    label: "Response was 428 (approval / self-correct)"
    keywords: [428, "precondition required", "wait_for_approval", "self-correct", "approval required"]
    source: authored

  - id: sym.status_429
    kind: symptom
    label: "Response was 429 (rate / budget)"
    keywords: [429, "too many requests", "rate limit", budget, "Retry-After"]
    source: authored

  - id: sym.status_503
    kind: symptom
    label: "Response was 503 (dependency / circuit)"
    keywords: [503, "service unavailable", "circuit breaker", "circuit tripped", dependency, "PDP down"]
    source: authored

  - id: sym.status_508
    kind: symptom
    label: "Response was 508 (loop guard)"
    keywords: [508, "loop detected", "loop guard", "double proxy", "re-entered"]
    source: authored

  - id: sym.flow_search_empty
    kind: symptom
    label: "/api/flows/search returned count:0 for traffic I know happened"
    keywords: ["count 0", "no flows", "flows missing", "flow search empty", "/api/flows/search"]
    source: authored

  - id: sym.gh_error_after_ok_polls
    kind: symptom
    label: "gh printed a transport-flavored error after OAuth polls returned 200s"
    detail: "e.g. HTTP/2 GOAWAY, connection reset, could-not-authenticate; the source of the phrasing is the CLI, not the wire."
    keywords: [gh, "gh auth", "OAuth polls", "device flow", "transport error", "could not authenticate"]
    source: authored

  - id: sym.http2_goaway_header_value
    kind: symptom
    label: "Client HTTP/2 stack reported GOAWAY / PROTOCOL_ERROR with a specific header value in the debug field"
    detail: "e.g. Go net/http2 emits `server sent GOAWAY ... ErrCode=PROTOCOL_ERROR, debug=\"...b'HEADER VALUE '\"`. The debug string names the offending value. Common causes: value has leading/trailing whitespace, control chars, or an obs-fold; the upstream HTTP/2 stack rejects it per RFC 9113 sec 8.2.1."
    keywords: [GOAWAY, PROTOCOL_ERROR, "HTTP/2 protocol error", "header value", whitespace, "RFC 9113", "connection reset"]
    source: authored

  - id: sym.request_timeout_no_response
    kind: symptom
    label: "Client timed out before it received an HTTP response"
    keywords: [timeout, "timed out", "no HTTP response", "connect timeout", "operation timed out"]
    source: authored

  # ---- Evidence (what I check next) ------------------------------------
  - id: ev.check_x_blocked_by
    kind: evidence
    label: "Inspect X-Blocked-By header on the failing response"
    source: authored

  - id: ev.check_response_body_json
    kind: evidence
    label: "Parse response body for `type`, `action`, `reflection`, `reason`, `Retry-After`"
    source: authored

  - id: ev.check_lookup_host
    kind: evidence
    label: "GET /lookup?host=HOST — network:request effect for that host"
    source: authored

  - id: ev.check_policy_credential_use
    kind: evidence
    label: "GET /policy — look for credential:use permission on the target host"
    detail: "policy-plane rule that fires only when detection classified a credential"
    source: authored

  - id: ev.check_config_credential_rules
    kind: evidence
    label: "GET /config — read credential_rules array"
    detail: "empty list means the detection plane loaded no custom patterns"
    source: authored

  - id: ev.check_status_security_events
    kind: evidence
    label: "Operator runs `safeyolo logs --event security --tail 20` for the failing time window"
    source: authored

  - id: ev.check_explain_request_id
    kind: evidence
    label: "GET /explain?request_id=req-... using request_id from safeyolo logs"
    source: authored

  # Trace endpoint — "what SafeYolo processing actually ran". Distinct
  # from /explain (audit events, retrospective) — see references/agent-api.md
  # for the wire vocabulary (state, reason, per-addon outcome constants).
  - id: ev.check_trace_request_id
    kind: evidence
    label: "GET /trace?request_id=req-... — per-addon state+outcome+reason for the request pipeline"
    detail: |
      The request_id comes from the X-SafeYolo-Request-Id response
      header (present on every SafeYolo response, including block
      responses) OR from `safeyolo logs --request-id req-... --raw`.
      Requires opt-in tracing: the request must have carried
      `X-SafeYolo-Trace: 1`. Response payload documents state, reason,
      per-addon outcome — see the shipped wire-vocabulary reference.
    source: authored

  - id: ev.check_budgets
    kind: evidence
    label: "GET /budgets — remaining for the target host"
    source: authored

  - id: ev.check_circuits
    kind: evidence
    label: "GET /circuits — state for the target host"
    source: authored

  - id: ev.check_timeout_route
    kind: evidence
    label: "Check Agent API health, proxy environment, host lookup, budgets, and circuits for the timed-out host"
    source: authored

  - id: ev.retry_timeout_with_bounded_curl
    kind: evidence
    label: "Send one bounded curl request through the configured proxy to the exact timed-out URL; record status, headers, body, and duration"
    source: authored

  - id: ev.check_context_header_and_targets
    kind: evidence
    label: "Confirm request carried X-SafeYolo-Test-Context AND policy test_context.target_hosts non-empty"
    source: authored

  - id: ev.check_goaway_debug_string
    kind: evidence
    label: "Read the GOAWAY debug field for the specific reason (header name, value pattern, forbidden chars)"
    detail: "The client's HTTP/2 stack echoes the server's GOAWAY debug string verbatim. Look for a header value in quotes, whitespace markers, or explicit RFC reference."
    source: authored

  - id: ev.check_client_version_string
    kind: evidence
    label: "Verify the client sends a valid version string (e.g. `gh --version`, `curl --version`) — an empty version can produce a trailing space in a User-Agent template like 'GitHub CLI '"
    source: authored

  - id: ev.reproduce_with_curl_same_ua
    kind: evidence
    label: "Reproduce with curl from the same sandbox, sending the same User-Agent value verbatim: `curl -v -H 'User-Agent: <exact value>' https://HOST/PATH`"
    detail: "Isolates client-vs-proxy: if curl reproduces the GOAWAY the proxy is the source; if curl succeeds the client sent the malformed header."
    source: authored

  - id: ev.check_client_updates_upstream
    kind: evidence
    label: "Look online for a newer release of the client CLI/SDK and check its changelog and issue tracker for this specific failure signature"
    detail: |
      Third-party client software (gh, curl, pip, mise, node, docker,
      kubectl, ...) has been diagnosed as the fault. Agent training
      data is stale relative to real-time upstream release activity;
      check the client project's release page, changelog, and
      open+closed issues for the specific error signature (paste in
      the exact wire-visible string -- e.g. the GOAWAY debug value,
      the exact error code, the stack trace top line). A recent
      release may already fix it; an existing issue may confirm the
      maintainers know about it.
      Common sources: github.com/OWNER/REPO/releases + issues,
      project pypi.org / npmjs.com / crates.io page, official
      changelog / news.
    keywords: [update, upgrade, "newer release", changelog, "issue tracker",
               "check online", "third party client", "already fixed"]
    source: authored

  # ---- Classifications (which plane owns this) --------------------------
  - id: cls.upstream_only
    kind: classification
    label: "Upstream response; no SafeYolo plane action"
    source: authored

  - id: cls.policy_block
    kind: classification
    label: "Policy-plane block (network_guard / credential_guard / service_gateway)"
    source: authored

  - id: cls.approval_gate
    kind: classification
    label: "Policy-plane approval-required (safeyolo watch)"
    source: authored

  - id: cls.budget_exhausted
    kind: classification
    label: "Policy-plane budget exhausted"
    source: authored

  - id: cls.circuit_open
    kind: classification
    label: "Circuit-breaker tripped for this host"
    source: authored

  - id: cls.observability_gate
    kind: classification
    label: "Observability-plane gap (recording preconditions not met)"
    source: authored

  - id: cls.header_wire_format_violation
    kind: classification
    label: "Header field reached the upstream in a form the HTTP/2 wire spec forbids (RFC 9113 sec 8.2.1)"
    source: authored

  - id: cls.client_sent_bad_header
    kind: classification
    label: "Client itself sent a malformed header value; not a SafeYolo action"
    source: authored

  - id: cls.proxy_reencode_bug
    kind: classification
    label: "SafeYolo/mitmproxy re-encoded a header in a way the upstream rejects"
    source: authored

  - id: cls.timeout_not_policy
    kind: classification
    label: "SafeYolo health and policy allow the route; the timeout produced no policy response"
    source: authored

  # Trace-derived classifications. Key on the full state+outcome+reason
  # tuple from /trace so branching is on stable evidence, not free-form
  # interpretation. Literals match constants documented in
  # references/agent-api.md (STATE_*, REASON_*, per-addon OUTCOME_*).
  - id: cls.trace_evaluated_normal
    kind: classification
    label: "Addon ran and reported a normal outcome (state=evaluated, addon-specific outcome)"
    detail: "For a security addon that concluded nothing to enforce (no_detection / no_match / allowed / not_a_gateway_request / not_target_host). Not the failure — look upstream or reconsider premise."
    source: authored

  - id: cls.trace_bypassed_addon_disabled
    kind: classification
    label: "Addon loaded but off via mitmproxy option (state=bypassed, reason=addon_disabled)"
    detail: "Operator flipped the global enable flag. If this addon was expected to run, the disablement is the answer."
    source: authored

  - id: cls.trace_bypassed_policy_disabled
    kind: classification
    label: "Addon loaded but disabled by PDP for this scope (state=bypassed, reason=policy_disabled)"
    detail: "PolicyClient.is_addon_enabled returned False for this host/client. Policy edit needed, not option flip."
    source: authored

  - id: cls.trace_bypassed_prior_response
    kind: classification
    label: "Addon deferred to an earlier responder (state=bypassed, reason=prior_response)"
    detail: "Something upstream in the chain synthesised a response first. The blocked_by / preceding trace step names the earlier responder — that's the addon to investigate."
    source: authored

  - id: cls.trace_not_loaded
    kind: classification
    label: "Addon expected but never ran for this request (state=not_loaded)"
    detail: "Module missing from proxy.ADDON_CHAIN, failed to load, or was removed. Not the same as bypassed — the code did not execute."
    source: authored

  - id: cls.trace_error
    kind: classification
    label: "Addon's hook raised (state=error, reason=<ExceptionType>)"
    detail: "The addon executed but threw. reason names the exception type; check mitmproxy logs for the full traceback."
    source: authored

  - id: cls.trace_truncated
    kind: classification
    label: "Trace hit the per-record step cap (truncated=true)"
    detail: "Something is emitting a lot of trace steps for one request — could be a loop, could be legitimate diagnostic instrumentation. Investigate step distribution. The doctor probe should never truncate on a normal request."
    source: authored

  - id: cls.trace_unavailable
    kind: classification
    label: "/trace returned nothing or errored — pipeline evidence is unavailable"
    detail: "Request wasn't traced (no X-SafeYolo-Trace: 1 marker), trace expired from the bounded store, or /trace itself is broken. Retry with the trace header. If the request cannot be re-issued, this branch terminates."
    source: authored

  # ---- Conclusions & operator asks --------------------------------------
  - id: con.self_correct_request
    kind: conclusion
    label: "Self-correct the request (destination / credential / method) and retry"
    source: authored

  - id: con.honor_retry_after
    kind: conclusion
    label: "Honor Retry-After, back off, retry once budget resets"
    source: authored

  - id: con.upstream_auth_issue
    kind: conclusion
    label: "Upstream rejected the credential; not a SafeYolo action"
    detail: "Common flavours: bad token, OAuth SSO not authorized for org, token scope insufficient, revoked."
    source: authored

  - id: con.timeout_was_transient
    kind: conclusion
    label: "The exact URL now responds through the proxy; classify the earlier timeout as transient and retry the original operation once"
    source: authored

  - id: ask.watch_for_approval
    kind: operator_ask
    label: "Ask operator to run `safeyolo watch` and approve the specific host/capability/binding"
    source: authored

  - id: ask.diag_agent
    kind: operator_ask
    label: "Ask operator to run `safeyolo agent diag <name>` (attribution / bridge / end-to-end route)"
    source: authored

  - id: ask.policy_add_host
    kind: operator_ask
    label: "Ask operator: `safeyolo policy host add HOST --agent AGENT`"
    source: authored

  - id: ask.logs_request_id
    kind: operator_ask
    label: "Ask operator for the request_id via `safeyolo logs --request-id req-... --raw`"
    source: authored

  - id: ask.report_client_bug
    kind: operator_ask
    label: "Report a client bug upstream (include version + exact malformed value); use `--with-token` as a workaround"
    source: authored

  - id: ask.suggest_client_upgrade
    kind: operator_ask
    label: "Determine how the client was installed, propose the specific upgrade command, and ask the operator to approve running it -- do not upgrade unilaterally, do not make the operator choose the command"
    detail: |
      The agent must not upgrade without permission: the operator's
      current project may depend on the current version's behaviour.
      The agent also must not push the decision of *how* to upgrade
      onto the operator -- the agent has the shell and can determine
      the install path (mise / brew / apt / pip / npm / cargo / etc.)
      from `which`, `readlink`, package metadata, and shell history.
      Present the finding, cite the newer release or issue by URL,
      propose a specific upgrade command matched to the observed
      install path ("Shall I upgrade gh via `mise use -g gh@latest`?"),
      and get a yes/no. If the operator declines, fall back to the
      workaround.
    source: authored

  - id: ask.mitmproxy_version_and_doctor
    kind: operator_ask
    label: "Ask operator: `safeyolo doctor` and check the running mitmproxy version for known header-whitespace re-encoding fixes"
    source: authored

  - id: ask.retry_with_trace_header
    kind: operator_ask
    label: "Retry the failing operation with `X-SafeYolo-Trace: 1` on the request so /trace has pipeline evidence to return"
    detail: |
      The trace store is bounded and TTL'd. If the request was never
      traced, /trace has nothing to return. Ask the operator (or
      reissue) the request with the opt-in header, then run the trace
      branch from the top.
    source: authored


edges:
  # From symptoms to first-cut evidence checks
  - {from: sym.upstream_401, to: ev.check_x_blocked_by, kind: next_check}
  - {from: sym.status_403,   to: ev.check_x_blocked_by, kind: next_check}
  - {from: sym.status_428,   to: ev.check_x_blocked_by, kind: next_check}
  - {from: sym.status_429,   to: ev.check_x_blocked_by, kind: next_check}
  - {from: sym.status_503,   to: ev.check_x_blocked_by, kind: next_check}
  - {from: sym.status_508,   to: ev.check_x_blocked_by, kind: next_check}
  - {from: sym.gh_error_after_ok_polls, to: ev.check_status_security_events, kind: next_check}
  - {from: sym.request_timeout_no_response, to: ev.check_timeout_route, kind: next_check}
  - {from: ev.check_timeout_route, to: cls.timeout_not_policy, kind: implies, when: "Agent API healthy; proxy variables present; lookup allows; budget remains; circuit is closed"}
  - {from: cls.timeout_not_policy, to: ev.retry_timeout_with_bounded_curl, kind: next_check}
  - {from: ev.retry_timeout_with_bounded_curl, to: con.timeout_was_transient, kind: implies, when: "the exact URL returns a normal HTTP response within the bound"}
  - {from: ev.retry_timeout_with_bounded_curl, to: ask.diag_agent, kind: escalates_to, when: "the exact URL also times out or the proxy route is unavailable"}

  # X-Blocked-By presence classifies plane
  - {from: ev.check_x_blocked_by, to: ev.check_response_body_json, kind: next_check, when: "header present"}
  - {from: ev.check_x_blocked_by, to: cls.upstream_only,            kind: implies,     when: "header absent AND status is upstream-shaped (401/403/404/5xx)"}

  # Body JSON drives the exact policy branch
  - {from: ev.check_response_body_json, to: cls.policy_block,     kind: implies, when: "type refers to network_guard or credential_guard route"}
  - {from: ev.check_response_body_json, to: cls.approval_gate,    kind: implies, when: "action == wait_for_approval"}
  - {from: ev.check_response_body_json, to: cls.budget_exhausted, kind: implies, when: "type mentions budget or Retry-After present"}
  - {from: ev.check_response_body_json, to: cls.circuit_open,     kind: implies, when: "X-Blocked-By == circuit-breaker"}

  # Upstream_only leads to the actual upstream diagnosis path
  - {from: cls.upstream_only, to: ev.check_policy_credential_use, kind: rules_out, when: "confirming no credential:use policy would have caught it silently"}
  - {from: cls.upstream_only, to: con.upstream_auth_issue,        kind: implies,    when: "status == 401"}

  # Policy_block branch has plane-specific verification
  - {from: cls.policy_block, to: ev.check_lookup_host,             kind: next_check}
  - {from: cls.policy_block, to: ev.check_config_credential_rules, kind: next_check, when: "credential-guard involved"}
  - {from: ev.check_lookup_host, to: ask.policy_add_host,          kind: implies,     when: "effect == deny AND host is expected"}
  - {from: ev.check_lookup_host, to: con.self_correct_request,     kind: implies,     when: "effect == deny AND host is a mistake"}

  # Budget / circuit branches to their conclusions
  - {from: cls.budget_exhausted, to: ev.check_budgets, kind: next_check}
  - {from: ev.check_budgets,     to: con.honor_retry_after, kind: implies}
  - {from: cls.circuit_open,     to: ev.check_circuits, kind: next_check}
  - {from: ev.check_circuits,    to: con.honor_retry_after, kind: implies}

  # Approval gate → operator ask
  - {from: cls.approval_gate, to: ask.watch_for_approval, kind: escalates_to}

  # Flow-search-empty branch — the mistake I made today
  - {from: sym.flow_search_empty, to: ev.check_context_header_and_targets, kind: next_check}
  - {from: ev.check_context_header_and_targets, to: cls.observability_gate, kind: implies, when: "either precondition is missing"}
  - {from: cls.observability_gate, to: con.self_correct_request, kind: implies, when: "recording is what I wanted; either send the header or add host to test_context.target_hosts"}

  # Correlation escape hatch — from any evidence branch, if the picture is unclear, get the request_id and use /explain
  - {from: ev.check_response_body_json, to: ask.logs_request_id, kind: next_check, when: "picture is unclear after body inspection"}
  - {from: ask.logs_request_id,         to: ev.check_explain_request_id, kind: next_check}

  # Trace escape hatch — /explain answers "what audit events fired"; /trace
  # answers "what pipeline processing actually ran". When /explain leaves
  # gaps (empty events, ambiguous set, or the failure is about which addon
  # ran vs which recorded) escalate to /trace. Requires the request to
  # have carried X-SafeYolo-Trace: 1; if not, this edge terminates and the
  # skill's ask is "retry the request with the trace header".
  - {from: ev.check_explain_request_id, to: ev.check_trace_request_id, kind: next_check, when: "/explain empty/ambiguous OR failure is about which addon ran, not which recorded"}

  # Trace evidence fans out per state+outcome+reason. Literals below MUST
  # match the constants in references/agent-api.md — the drift test in
  # test_trace_wire_vocabulary.py enforces they stay aligned.
  - {from: ev.check_trace_request_id, to: cls.trace_evaluated_normal,        kind: implies, when: "expected addon step has state=evaluated with an addon-specific outcome (no_detection, no_match, allowed, ...)"}
  - {from: ev.check_trace_request_id, to: cls.trace_bypassed_addon_disabled, kind: implies, when: "expected addon step has state=bypassed AND reason=addon_disabled"}
  - {from: ev.check_trace_request_id, to: cls.trace_bypassed_policy_disabled,kind: implies, when: "expected addon step has state=bypassed AND reason=policy_disabled"}
  - {from: ev.check_trace_request_id, to: cls.trace_bypassed_prior_response, kind: implies, when: "expected addon step has state=bypassed AND reason=prior_response"}
  - {from: ev.check_trace_request_id, to: cls.trace_not_loaded,              kind: implies, when: "expected addon appears in not_loaded[] (never ran)"}
  - {from: ev.check_trace_request_id, to: cls.trace_error,                   kind: implies, when: "expected addon step has state=error (hook raised)"}
  - {from: ev.check_trace_request_id, to: cls.trace_truncated,               kind: implies, when: "truncated=true in the /trace payload"}
  - {from: ev.check_trace_request_id, to: cls.trace_unavailable,             kind: implies, when: "/trace returned 404, or the request wasn't traced (no X-SafeYolo-Trace: 1 header), or the trace expired"}

  # Trace classifications resolve to conclusions or asks
  - {from: cls.trace_evaluated_normal,        to: cls.upstream_only,               kind: implies, when: "the security addon reported no reason to enforce; if the request still failed, it's an upstream or premise issue"}
  - {from: cls.trace_bypassed_addon_disabled, to: ask.diag_agent,                  kind: escalates_to, when: "the addon was expected to enforce; ask operator to enable it via `safeyolo` addon options"}
  - {from: cls.trace_bypassed_policy_disabled,to: ask.policy_add_host,             kind: escalates_to, when: "policy needs to activate the addon for this host/agent scope"}
  - {from: cls.trace_bypassed_prior_response, to: ev.check_x_blocked_by,           kind: next_check,   when: "the earlier responder's blocked_by tells us which addon actually blocked; loop back to the standard branch on that addon"}
  - {from: cls.trace_not_loaded,              to: ask.mitmproxy_version_and_doctor,kind: escalates_to, when: "an expected addon never ran — proxy startup or ADDON_CHAIN is broken; `safeyolo doctor` will fail the Pipeline probe (traced) check"}
  - {from: cls.trace_error,                   to: ask.mitmproxy_version_and_doctor,kind: escalates_to, when: "the addon threw during evaluation; mitmproxy logs will have the full traceback for the reason=<ExceptionType>"}
  - {from: cls.trace_truncated,               to: ask.mitmproxy_version_and_doctor,kind: escalates_to, when: "trace exceeded the per-record step cap; not a normal request pattern"}
  - {from: cls.trace_unavailable,             to: ask.retry_with_trace_header,     kind: escalates_to, when: "the request wasn't traced; retry the failing operation with X-SafeYolo-Trace: 1 to re-run this branch"}

  # Security-events check drives the gh-flavored branch
  - {from: ev.check_status_security_events, to: cls.upstream_only, kind: implies, when: "no security events on the target host in the failing window"}
  - {from: ev.check_status_security_events, to: cls.policy_block,  kind: implies, when: "any security event fired on the target host"}

  # HTTP/2 wire-format branch (client reports GOAWAY with a header value in debug)
  - {from: sym.http2_goaway_header_value, to: ev.check_goaway_debug_string, kind: next_check}
  - {from: ev.check_goaway_debug_string,  to: cls.header_wire_format_violation, kind: implies, when: "debug identifies a header value with leading/trailing whitespace, control chars, or obs-fold"}
  - {from: cls.header_wire_format_violation, to: ev.check_client_version_string, kind: next_check}
  - {from: cls.header_wire_format_violation, to: ev.reproduce_with_curl_same_ua, kind: next_check}
  - {from: ev.check_client_version_string,   to: cls.client_sent_bad_header, kind: implies, when: "version is empty or missing AND the offending value looks like a version-templated header (e.g. 'GitHub CLI ')"}
  - {from: ev.check_client_version_string,   to: ev.reproduce_with_curl_same_ua, kind: next_check, when: "version IS populated -- version alone doesn't explain the malformed value; verify what actually reaches the wire"}
  - {from: ev.reproduce_with_curl_same_ua,   to: cls.client_sent_bad_header, kind: implies, when: "curl sending the same malformed value REPRODUCES the wire-format rejection AND a baseline value succeeds -- proxy transmits both faithfully, so the client is the source of the malformed value"}
  - {from: ev.reproduce_with_curl_same_ua,   to: cls.proxy_reencode_bug,     kind: implies, when: "curl succeeds even sending the same malformed value BUT the client still fails -- the proxy is doing something specific to the failing client's connections (HTTP/2 upgrade path, client fingerprint, etc.)"}

  # "Client is at fault" always routes through an upstream update check
  # before escalating -- see ev.check_client_updates_upstream. This
  # counteracts the training-data-is-stale bias where an agent proposes
  # to file a bug or write a workaround for a defect a recent release
  # already fixes.
  - {from: cls.client_sent_bad_header, to: ev.check_client_updates_upstream, kind: next_check}
  # Shortcut: when the failure signature is distinctive enough that a
  # curl reproduction adds no signal, skip straight to the update check.
  # Distinctive means the debug field named a specific header value or
  # error string an issue tracker can be searched for verbatim.
  - {from: cls.header_wire_format_violation, to: ev.check_client_updates_upstream, kind: next_check, when: "the wire-format debug field is distinctive enough to search verbatim in the client's issue tracker"}

  - {from: ev.check_client_updates_upstream, to: ask.suggest_client_upgrade, kind: escalates_to, when: "a newer client release exists AND its changelog or a referenced issue matches this failure signature (or strongly implies the fix)"}
  - {from: ev.check_client_updates_upstream, to: ask.suggest_client_upgrade, kind: escalates_to, when: "a newer client release exists AND version delta is substantial (roughly >=3 minor releases or >90 days) -- verify against latest before reporting; a silent fix in an intervening release is more likely than a genuinely new bug"}
  - {from: ev.check_client_updates_upstream, to: ask.report_client_bug,     kind: escalates_to, when: "no newer release available, OR delta is small AND current head does not reference this failure -- treat as a genuinely new bug worth filing"}

  - {from: cls.proxy_reencode_bug,     to: ask.mitmproxy_version_and_doctor, kind: escalates_to}


