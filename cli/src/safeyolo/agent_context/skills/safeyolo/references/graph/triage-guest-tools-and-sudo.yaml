# Triage graph: "sudo / apt / mise / package install failing"
#
# Entry question: I tried to install a package, upgrade a runtime, or use
# `sudo` inside the guest, and something didn't work. This graph
# disambiguates guest sudo path, setpriv fallback, package download policy,
# and runtime-manager (mise/pyenv) failures behind the proxy.
#
# See schema comment in `triage-request-failing.yaml` for field definitions.

see_also:
  - graph: triage-tls-and-ca
    when: "the failure is TLS-flavored (cert verify, unknown authority)"
  - graph: triage-request-failing
    when: "package download returned a specific 428/429/503 status"
  - graph: triage-approval-required
    when: "download was blocked with wait_for_approval"

nodes:
  # ---- Symptoms --------------------------------------------------------
  - id: sym.tools_sudo_asks_password
    kind: symptom
    label: "`sudo -n` prompts for a password (guest sudo helper missing or broken)"
    keywords: ["sudo password", "sudo -n", "password required", "guest sudo"]
    source: authored

  - id: sym.tools_sudo_command_not_found
    kind: symptom
    label: "`sudo: command not found` inside the guest"
    keywords: ["sudo not found", "no sudo", "command not found"]
    source: authored

  - id: sym.tools_setpriv_permission_denied
    kind: symptom
    label: "`setpriv --reuid=0 ...` returns permission denied"
    keywords: ["setpriv", "permission denied", "reuid", "regid"]
    source: authored

  - id: sym.tools_apt_403_407
    kind: symptom
    label: "`apt-get install` fails with 403 / 407 / 502 during download"
    keywords: ["apt", "apt-get", "403", "407", "502", "package download failed"]
    source: authored

  - id: sym.tools_apt_key_verify_fail
    kind: symptom
    label: "`apt-get update` fails signature verification for the SafeYolo-proxied mirror"
    keywords: ["apt signature", "InRelease", "gpg verify", "NO_PUBKEY"]
    source: authored

  - id: sym.tools_mise_install_hangs
    kind: symptom
    label: "`mise install python@X` hangs or times out downloading the runtime"
    keywords: ["mise", "install hangs", "runtime download", "mise-versions"]
    source: authored

  - id: sym.tools_pip_ssl_or_timeout
    kind: symptom
    label: "`pip install PACKAGE` fails with SSL error or long timeout"
    keywords: ["pip", "pypi", "files.pythonhosted.org", "timeout", "ssl"]
    source: authored

  - id: sym.tools_download_28x_block
    kind: symptom
    label: "Package download returned a 428 (wait_for_approval) from SafeYolo"
    keywords: ["428", "wait_for_approval", "package host", "policy"]
    source: authored

  - id: sym.tools_ptrace_denied
    kind: symptom
    label: "ptrace / strace / gdb attach fails with EPERM (`Operation not permitted`) even when the target process is the same uid"
    detail: |
      Example: `strace -c -p PID` from the same uid inside the guest
      returns `ptrace(PTRACE_SEIZE, PID): Operation not permitted`, or
      `gdb attach` returns similar. Not a YAMA `ptrace_scope` issue --
      caps and YAMA are not what's blocking here.
    keywords: ["ptrace", "strace", "gdb attach", "PTRACE_SEIZE",
               "Operation not permitted", "EPERM", "attach failed"]
    source: authored

  # ---- Evidence --------------------------------------------------------
  - id: ev.tools_check_sudo_path
    kind: evidence
    label: "which sudo -- and readlink -f the result; setuid bit present?"
    source: authored

  - id: ev.tools_check_setpriv
    kind: evidence
    label: "test -x /usr/bin/setpriv -- guest fallback path when sudo is unavailable (Linux gVisor only)"
    source: authored

  - id: ev.tools_check_proxy_env
    kind: evidence
    label: "env | grep -E '^(HTTP|HTTPS)_PROXY=' -- most package tools need these set (mise, apt via apt.conf)"
    source: authored

  - id: ev.tools_check_apt_apt_conf
    kind: evidence
    label: "cat /etc/apt/apt.conf.d/*proxy* -- apt has its own proxy config separate from HTTP_PROXY"
    source: authored

  - id: ev.tools_check_pip_index_url
    kind: evidence
    label: "pip config list -- verify index-url and cert are configured (usually inherit env)"
    source: authored

  - id: ev.tools_check_lookup_package_host
    kind: evidence
    label: "GET /lookup?host=HOST for the package host (pypi.org, files.pythonhosted.org, deb.debian.org, mise-versions.jdx.dev, ...)"
    source: authored

  - id: ev.tools_check_budgets_for_host
    kind: evidence
    label: "GET /budgets -- remaining for the package host and __global__"
    source: authored

  - id: ev.tools_check_response_body
    kind: evidence
    label: "Read the SafeYolo block body -- type, action, reflection tell whether this is credential-guard / network-guard / budget"
    source: authored

  - id: ev.tools_check_release_apt_keyring
    kind: evidence
    label: "ls /usr/share/keyrings/ /etc/apt/keyrings/ -- the mirror's signing key must be locally trusted regardless of proxy"
    source: authored

  - id: ev.tools_check_gvisor_platform
    kind: evidence
    label: "Check whether the sandbox is running under gVisor and which platform (systrap vs kvm)"
    detail: |
      Signals that gVisor is the runtime: `dmesg | head` shows sentry
      lines; `/proc/1/comm` reads `runsc-sandbox` or similar; the
      host-side runsc process line names `--platform=systrap` or
      `--platform=kvm`. safeyolo defaults to systrap when
      `/dev/kvm` is not accessible on the host (typical for CI /
      unprivileged containers). systrap's sentry does not implement
      guest-side `ptrace()`; kvm has a chance of working.
    source: authored

  - id: ev.tools_check_setpriv_helps_ptrace
    kind: evidence
    label: "Try `setpriv --reuid=0 --regid=0 --clear-groups <ptrace-invocation>` -- if the same EPERM returns, caps are not what's blocking"
    detail: |
      Confirms the failure is at the syscall implementation layer,
      not at cap-checking. gVisor's sentry can return EPERM for a
      syscall it simply hasn't wired up, and no elevation inside the
      guest can help.
    source: authored

  - id: ev.check_client_updates_upstream
    kind: evidence
    label: "Look online for a newer release of the package manager / tool itself and check its changelog and issue tracker for this specific failure signature"
    detail: |
      The package manager or CLI tool (mise, pip, apt, npm, cargo,
      brew, ...) has been diagnosed as the fault -- proxy env, policy,
      budget, and signing keys have been ruled out. Agent training
      data is stale relative to real-time upstream release activity;
      check the tool's release page, changelog, and open+closed issues
      for the specific error signature (exact stack trace line, exit
      code, timeout mode, dependency-resolution error).
      Common sources: github.com/OWNER/REPO/releases + issues,
      project pypi.org / npmjs.com / crates.io page.
    keywords: [update, upgrade, "newer release", changelog, "issue tracker",
               "check online", "third party client", "already fixed"]
    source: authored

  # ---- Classifications -------------------------------------------------
  - id: cls.tools_sudo_helper_missing
    kind: classification
    label: "Guest sudo helper is broken (config missing / not setuid)"
    source: authored

  - id: cls.tools_setpriv_needed
    kind: classification
    label: "gVisor setpriv is the correct root-inside-guest path here"
    source: authored

  - id: cls.tools_proxy_env_missing_for_tool
    kind: classification
    label: "The package tool did not inherit HTTP_PROXY / HTTPS_PROXY / apt.conf proxy"
    source: authored

  - id: cls.tools_package_host_not_in_policy
    kind: classification
    label: "The package host is not allowed by the current policy (or needs approval)"
    source: authored

  - id: cls.tools_package_budget_exhausted
    kind: classification
    label: "Budget for the package host is exhausted; wait or negotiate a higher budget"
    source: authored

  - id: cls.tools_apt_key_untrusted
    kind: classification
    label: "apt signing key for the mirror is not trusted regardless of the proxy path"
    source: authored

  - id: cls.tools_package_manager_bug
    kind: classification
    label: "Package manager / tool itself has a bug: proxy env set, policy allows the host, budget healthy, keys trusted -- yet the tool still fails (mise install algorithm hang, pip resolver crash, apt bug, etc.)"
    source: authored

  - id: cls.tools_gvisor_syscall_unsupported
    kind: classification
    label: "gVisor's sentry does not implement the requested syscall on the current platform. EPERM here means 'not wired up,' not 'cap missing.' Neither `sudo` nor `setpriv` can lift this -- it's a substrate limitation, not a policy one."
    source: authored

  # ---- Conclusions -----------------------------------------------------
  - id: con.tools_use_setpriv
    kind: conclusion
    label: "Use `setpriv --reuid=0 --regid=0 --clear-groups CMD` (Linux gVisor only) instead of chasing sudo"
    source: authored

  - id: con.tools_set_proxy_env_for_tool
    kind: conclusion
    label: "Set HTTP_PROXY / HTTPS_PROXY inline or via a tool-specific config (apt.conf.d, pip.conf, npmrc)"
    source: authored

  - id: con.tools_use_configured_manager
    kind: conclusion
    label: "For runtimes prefer mise -- it caches under /home/agent/.mise and survives cold restarts"
    source: authored

  - id: con.tools_wait_for_budget
    kind: conclusion
    label: "Wait for the budget window to reset before retrying; do not loop"
    source: authored

  - id: con.tools_use_non_ptrace_tool
    kind: conclusion
    label: "Switch to a tool that does not require ptrace attach: `py-spy` (reads /proc/$pid/mem read-only), eBPF where the sentry allows it, language-native debuggers with alternative attach paths, or run under `strace -f` from process launch instead of attaching mid-run"
    source: authored

  # ---- Operator asks ---------------------------------------------------
  - id: ask.tools_repair_sudo
    kind: operator_ask
    label: "Ask operator to run `safeyolo agent shell <name> --root` and repair the guest sudo helper. Use this ONLY when guest sudo itself is broken, never for a policy or approval block."
    source: authored

  - id: ask.tools_policy_add_package_host
    kind: operator_ask
    label: "Ask operator to `safeyolo policy host add HOST --agent AGENT` for the specific package host"
    source: authored

  - id: ask.tools_watch_for_download_approval
    kind: operator_ask
    label: "Ask operator to run `safeyolo watch` and approve the specific download"
    source: authored

  - id: ask.tools_switch_to_kvm_platform_or_debug_outside
    kind: operator_ask
    label: "If the traced process genuinely needs ptrace: ask operator whether `/dev/kvm` is available on the host (safeyolo picks kvm platform when it is, and kvm may support the syscall); otherwise ask the operator to attach the debugger from the host side or run the traced process outside the sandbox for that specific triage. Do NOT ask to grant CAP_SYS_PTRACE inside the guest -- it will not help."
    source: authored

  - id: ask.suggest_client_upgrade
    kind: operator_ask
    label: "Determine how the package manager / tool was installed, propose the specific upgrade command, and ask the operator to approve running it -- do not upgrade unilaterally, do not make the operator choose the command"
    detail: |
      The agent must not upgrade without permission; the operator's
      project may pin the current version. The agent must also not
      push the *choice of command* onto the operator -- the agent
      can read `which`, `readlink`, package metadata, and mise / apt /
      brew state to determine the install path and propose a specific
      upgrade command (`mise install gh@latest && mise use -g gh@latest`,
      `sudo apt-get install --only-upgrade gh`, etc.). Present the
      newer release or matching issue by URL, propose the specific
      command, get yes/no. If declined, fall back to the workaround.
    source: authored

  - id: ask.report_client_bug
    kind: operator_ask
    label: "Report a package manager / tool bug upstream (include version, exact failure signature, minimal repro); apply a targeted workaround where one exists"
    source: authored


edges:
  # sudo entries
  - {from: sym.tools_sudo_asks_password,      to: ev.tools_check_sudo_path, kind: next_check}
  - {from: sym.tools_sudo_command_not_found,  to: ev.tools_check_sudo_path, kind: next_check}
  - {from: sym.tools_setpriv_permission_denied, to: ev.tools_check_setpriv, kind: next_check}

  - {from: ev.tools_check_sudo_path, to: cls.tools_sudo_helper_missing, kind: implies, when: "sudo not present OR not setuid OR misconfigured"}
  - {from: ev.tools_check_sudo_path, to: ev.tools_check_setpriv, kind: next_check, when: "no sudo AND we're on Linux gVisor"}
  - {from: ev.tools_check_setpriv,   to: cls.tools_setpriv_needed, kind: implies, when: "setpriv is present and executable"}
  - {from: cls.tools_setpriv_needed, to: con.tools_use_setpriv, kind: implies}
  - {from: cls.tools_sudo_helper_missing, to: ask.tools_repair_sudo, kind: escalates_to}

  # Package-install entries -> proxy env + policy checks
  - {from: sym.tools_apt_403_407,       to: ev.tools_check_apt_apt_conf, kind: next_check}
  - {from: sym.tools_apt_403_407,       to: ev.tools_check_lookup_package_host, kind: next_check}
  - {from: sym.tools_apt_key_verify_fail, to: ev.tools_check_release_apt_keyring, kind: next_check}
  - {from: sym.tools_mise_install_hangs,  to: ev.tools_check_proxy_env, kind: next_check}
  - {from: sym.tools_mise_install_hangs,  to: ev.tools_check_lookup_package_host, kind: next_check}
  - {from: sym.tools_pip_ssl_or_timeout,  to: ev.tools_check_pip_index_url, kind: next_check}
  - {from: sym.tools_pip_ssl_or_timeout,  to: ev.tools_check_lookup_package_host, kind: next_check}
  - {from: sym.tools_download_28x_block,  to: ev.tools_check_response_body, kind: next_check}

  # Proxy env missing
  - {from: ev.tools_check_proxy_env,   to: cls.tools_proxy_env_missing_for_tool, kind: implies, when: "HTTP_PROXY / HTTPS_PROXY unset"}
  - {from: ev.tools_check_apt_apt_conf, to: cls.tools_proxy_env_missing_for_tool, kind: implies, when: "no proxy in apt.conf.d"}
  - {from: ev.tools_check_pip_index_url, to: cls.tools_proxy_env_missing_for_tool, kind: implies, when: "pip cannot see proxy or index"}
  - {from: cls.tools_proxy_env_missing_for_tool, to: con.tools_set_proxy_env_for_tool, kind: implies}

  # Proxy env / policy / budget / keys all check out but the tool still
  # fails -> package manager / tool itself is the source. Always route
  # through the upstream update check before escalating, to counter the
  # training-data-is-stale bias.
  - {from: ev.tools_check_proxy_env,     to: cls.tools_package_manager_bug, kind: implies, when: "proxy env IS set AND lookup for the package host is allow AND the tool still hangs or crashes"}
  - {from: ev.tools_check_pip_index_url, to: cls.tools_package_manager_bug, kind: implies, when: "pip index and cert config are correct AND the tool still fails"}
  - {from: cls.tools_package_manager_bug,    to: ev.check_client_updates_upstream, kind: next_check}
  - {from: ev.check_client_updates_upstream, to: ask.suggest_client_upgrade, kind: escalates_to, when: "a newer tool release exists AND its changelog or a referenced issue matches this failure signature"}
  - {from: ev.check_client_updates_upstream, to: ask.suggest_client_upgrade, kind: escalates_to, when: "a newer tool release exists AND version delta is substantial (roughly >=3 minor releases or >90 days) -- verify against latest before reporting; a silent fix in an intervening release is more likely than a genuinely new bug"}
  - {from: ev.check_client_updates_upstream, to: ask.report_client_bug,     kind: escalates_to, when: "no newer release, OR delta is small AND head does not reference this failure -- treat as a genuinely new bug worth filing"}

  # Policy / budget
  - {from: ev.tools_check_lookup_package_host, to: cls.tools_package_host_not_in_policy, kind: implies, when: "effect == deny"}
  - {from: cls.tools_package_host_not_in_policy, to: ask.tools_policy_add_package_host, kind: escalates_to}
  - {from: ev.tools_check_lookup_package_host, to: ev.tools_check_budgets_for_host, kind: next_check, when: "effect == budget"}
  - {from: ev.tools_check_budgets_for_host,    to: cls.tools_package_budget_exhausted, kind: implies, when: "remaining <= 0"}
  - {from: cls.tools_package_budget_exhausted, to: con.tools_wait_for_budget, kind: implies}

  # Approval-flavored downloads
  - {from: ev.tools_check_response_body, to: ask.tools_watch_for_download_approval, kind: escalates_to, when: "action == wait_for_approval"}

  # apt key
  - {from: ev.tools_check_release_apt_keyring, to: cls.tools_apt_key_untrusted, kind: implies, when: "expected keyring for the mirror is missing"}
  - {from: cls.tools_apt_key_untrusted,       to: ask.tools_repair_sudo,        kind: escalates_to, when: "installing the keyring requires root"}

  # Encourage mise as the preferred runtime manager
  - {from: sym.tools_mise_install_hangs, to: con.tools_use_configured_manager, kind: implies}

  # ptrace / strace / gdb inside guest hits gVisor's unsupported-syscall wall.
  # setpriv elevation cannot lift this -- it's a substrate limitation.
  - {from: sym.tools_ptrace_denied,          to: ev.tools_check_setpriv_helps_ptrace, kind: next_check}
  - {from: sym.tools_ptrace_denied,          to: ev.tools_check_gvisor_platform,      kind: next_check}
  - {from: ev.tools_check_setpriv_helps_ptrace, to: cls.tools_gvisor_syscall_unsupported, kind: implies, when: "same EPERM returns under setpriv -- caps are not what's blocking"}
  - {from: ev.tools_check_gvisor_platform,   to: cls.tools_gvisor_syscall_unsupported, kind: implies, when: "platform is systrap (gVisor default without /dev/kvm)"}
  - {from: cls.tools_gvisor_syscall_unsupported, to: con.tools_use_non_ptrace_tool, kind: implies}
  - {from: cls.tools_gvisor_syscall_unsupported, to: ask.tools_switch_to_kvm_platform_or_debug_outside, kind: escalates_to, when: "the specific triage genuinely requires ptrace and no equivalent non-ptrace tool exists"}


entries:
  - symptom: sym.tools_sudo_asks_password
  - symptom: sym.tools_sudo_command_not_found
  - symptom: sym.tools_setpriv_permission_denied
  - symptom: sym.tools_apt_403_407
  - symptom: sym.tools_apt_key_verify_fail
  - symptom: sym.tools_mise_install_hangs
  - symptom: sym.tools_pip_ssl_or_timeout
  - symptom: sym.tools_download_28x_block
  - symptom: sym.tools_ptrace_denied
