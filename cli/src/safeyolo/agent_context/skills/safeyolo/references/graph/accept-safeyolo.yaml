      run: "safeyolo-lab"
      capture: [task target, branch, index and working-tree hashes, old and new process identities, resumed agent action]

  - id: ev.accept_nested_linux_lane
    kind: evidence
    label: "Use the repository's real SafeYolo-in-SafeYolo Linux acceptance lane"
    detail: |
      This builds and starts an isolated inner SafeYolo through the outer proxy,
      proves loop handling, starts a real agent, and verifies bundled Coord MCP
      connectivity. It owns a dedicated guest-local lab root and must not point
      at the mounted working checkout.
      Reuse an approved inner instance when it is suitable. Use its CLI and
      agent shell to run scripts you create for the issue, then inspect inner
      proxy, Coord, guest, and supervisor results as applicable. Ordinary
      lifecycle or transport checks need no logged-in coding model. Keep the
      inner state and evidence in the acceptance environment, and test the
      exact candidate rather than assuming the installed version is current.
    source: tests/nested-linux/acceptance.sh
    tool:
      obtain_from: "the exact operator-approved trusted-base SafeYolo Git object"
      sources:
