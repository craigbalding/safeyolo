# Acceptance graph: "which trusted tool proves this SafeYolo claim?"
#
# This is an acceptance and environment-maintenance graph in the same style as
# the SafeYolo troubleshooting graphs. Bind the claim under test to an entry,
# run the primary trusted tool named by the evidence node, classify the result,
# and stop at a bounded conclusion or operator ask.
#
# The ordinary graph schema is documented in `triage-request-failing.yaml`.
# Executable evidence nodes may additionally carry a `tool` annotation:
#
#   tool:
#     obtain_from: trusted acquisition location
#     sources: [{path: repository-relative path, sha256: content identity}]
#     setup: bounded preparation (optional)
#     verify: deterministic identity check
#     run: exact invocation or a small claim-to-invocation mapping
#     capture: [evidence the result must retain]
#
# Trust protocol:
#   - Read this graph from the operator-bound trusted base, never from the
#     candidate as self-authorization.
#   - Obtain every listed source from the exact trusted-base Git object named
#     by the room brief and verify its SHA-256 before use.
#   - That Git object is the trust anchor for transitive tracked inputs. The
#     listed hashes are quick identity checks for declared entrypoints, not a
#     substitute for the commit identity.
#   - Resolve dependencies only from locations named by the trusted lock or
#     install source, or from an operator-approved configured package source.
#   - A candidate change to a harness is review subject matter. It does not
#     update the trusted hash or authorize its own use.
#   - A tool entry in this operator-bound graph is standing approval for its
#     declared purpose, source/identity, and install path. It is not a product
#     runtime dependency and does not authorize a candidate-authored tool.
#   - If a source hash, acquisition path, invocation, or result shape does not
#     fit, follow the graph-gap or tool-identity path; do not improvise a pass.
#   - This is not an instruction to run every lane. Choose the smallest graph
#     path that establishes the material claim.

see_also:
  - graph: triage-guest-tools-and-sudo
    when: "an approved acceptance dependency cannot be installed in the guest"
  - graph: triage-request-failing
    when: "an acceptance tool's network request is blocked or fails unexpectedly"
  - graph: triage-kernel-observability
    when: "the desired evidence needs a kernel facility unavailable in the sandbox"

nodes:
  # ---- Acceptance situations -----------------------------------------
  - id: sym.accept_candidate
    kind: symptom
    label: "A candidate needs independent acceptance against affected SafeYolo boundaries"
    keywords: [candidate, pull request, acceptance, review]
    source: authored

  - id: sym.accept_background
    kind: symptom
    label: "Lens has background capacity and should improve acceptance readiness"
    keywords: [background, idle, readiness, maintain, coverage]
    source: authored

  - id: sym.accept_install_proxy
    kind: symptom
    label: "Installation, upgrade, proxy, policy, or credential behavior needs acceptance"
    keywords: [install, upgrade, proxy, policy, credential]
    source: authored

  - id: sym.accept_python_behavior
    kind: symptom
    label: "A focused Python behavior or regression needs fast deterministic evidence"
    keywords: [Python, unit, regression, pytest, Hypothesis, coverage]
    source: authored

  - id: sym.accept_policy_assurance
    kind: symptom
    label: "Policy transactions, concurrency, or generated sequences need adversarial assurance"
    keywords: [policy, transaction, concurrency, chaos, property, Hypothesis]
    source: authored

  - id: sym.accept_agent_isolation
    kind: symptom
    label: "Agent lifecycle, guest privilege, persistence, or isolation needs acceptance"
    keywords: [agent, lifecycle, sandbox, isolation, persistence, guest root]
    source: authored

  - id: sym.accept_coord
    kind: symptom
    label: "Coord, NATS, retention, or schema upgrade behavior needs acceptance"
    keywords: [coord, NATS, JetStream, retention, schema, upgrade]
    source: authored

  - id: sym.accept_factory_recovery
    kind: symptom
    label: "Factory supervisor and useful-work recovery needs acceptance"
    keywords: [factory, supervisor, restart, crash, recovery, dirty checkout]
    source: authored

  - id: sym.accept_nested_linux
    kind: symptom
    label: "SafeYolo-in-SafeYolo composition on Linux needs acceptance"
    keywords: [nested SafeYolo, Linux, runsc, composition]
    source: authored

  - id: sym.accept_rootfs
    kind: symptom
    label: "Guest rootfs construction, dependency inventory, or image contents need acceptance"
    keywords: [rootfs, image, skopeo, umoci, ext4, package, SBOM]
    source: authored

  - id: sym.accept_uds_transport
    kind: symptom
    label: "Proxy UDS transport, attribution, or no-direct-egress behavior needs acceptance"
    keywords: [UDS, Unix socket, attribution, transport, egress, PROXY]
    source: authored

  - id: sym.accept_macos_vz
    kind: symptom
    label: "The physical Apple Silicon VZ boundary needs acceptance"
    keywords: [macOS, Apple Silicon, VZ, virtualisation]
    source: authored

  - id: sym.accept_static_quality
    kind: symptom
    label: "Changed code needs deterministic repository quality checks"
    keywords: [lint, static analysis, complexity, code smell, pre-commit]
    source: authored

  - id: sym.accept_security_analysis
    kind: symptom
    label: "Changed production Python needs deterministic security and data-flow analysis"
    keywords: [CodeQL, security, data flow, taint, vulnerability]
    source: authored

  - id: sym.accept_state_integrity
    kind: symptom
    label: "State transitions or interfaces may admit impossible, partial, or confused states"
    keywords: [state, type, transition, optional, invariant, mypy]
    source: authored

  - id: sym.accept_race_risk
    kind: symptom
    label: "Concurrency, shared resources, ordering, or state leakage needs stress evidence"
    keywords: [race, concurrent, parallel, repeat, ordering, state leak]
    source: authored

  - id: sym.accept_dependency_security
    kind: symptom
    label: "The exact locked Python runtime dependency closure needs vulnerability review"
    keywords: [dependency, vulnerability, advisory, pip-audit, lockfile]
    source: authored

  # ---- Selection and trusted evidence --------------------------------
  - id: ev.accept_select_boundary
    kind: evidence
    label: "Choose one material affected, stale, failed, or currently unproven boundary"
    detail: |
      For candidate review, start with the claimed behavior and changed system
      boundary. For background work, prefer a recent failure, a missing real
      boundary, or a trusted tool that no longer runs. Do not run broad suites
      merely to fill time.
    source: authored

  - id: ev.accept_python_lane
    kind: evidence
    label: "Use focused pytest, pytest-cov, and Hypothesis for Python behavior"
    detail: |
      Select the smallest existing test node that exercises the changed
      behavior. Add coverage only when the claim concerns unexercised paths.
      Use Hypothesis for input spaces and state transitions, not as decoration
      around a few examples. Test-assurance checks verify the repository's
      explicitly pinned high-value acceptance functions.
    source: pyproject.toml
    tool:
      obtain_from: "pytest, pytest-cov, and Hypothesis distributions named and hash-locked in uv.lock, fetched through the approved SafeYolo proxy"
      sources:
        - path: pyproject.toml
          sha256: 0c9af5325d18a3fbfe5ee1fb577fa009d0ea057c75bf157017c4c69d7d5b99d8
        - path: uv.lock
          sha256: 7c62d9e115804af47aae79f49ab8b039eeb624242a3a48379f619f6c32f9dad0
        - path: scripts/check_test_assurance.py
          sha256: 3dc6bc589625ea3058b7ca20711d97f3007ca41b0ebd1653a671a4642dc91974
      setup: "uv sync --frozen --group dev"
      verify: "sha256sum pyproject.toml uv.lock scripts/check_test_assurance.py && uv run pytest --version"
      run:
        focused: "uv run pytest -q <focused-test-node>"
        focused_with_coverage: "uv run pytest -q <focused-test-node> --cov=<affected-package> --cov-report=term-missing"
        acceptance_identity: "uv run python scripts/check_test_assurance.py"
      capture: [trusted base, exact test nodes, pytest and plugin versions, seed when applicable, exit status, failing assertion]

  - id: ev.accept_policy_chaos_lane
    kind: evidence
    label: "Use the Hypothesis-backed policy transaction chaos runner"
    detail: |
      This is the primary generated-sequence tool for policy permissions,
      concurrent mutation, failure stages, and crash-recovery semantics. The
      normal mode is hermetic and retains replayable machine-readable output;
      guarded power-cut mode belongs only on an approved disposable KVM guest.
    source: tools/policy_chaos.py
    tool:
      obtain_from: "the exact trusted-base sources plus Hypothesis and tomlkit distributions hash-locked in uv.lock"
      sources:
        - path: tools/policy_chaos.py
          sha256: 265c7607126337da8dd3c895580fe9fa0ecaff94f6c5696b3a00693b21b476c6
        - path: experiments/policy_assurance/run_experiments.py
          sha256: 898fa727527e70de2f3cf9f33e0ca870e39f66385b0e80b21d0551b3f0ccb916
        - path: uv.lock
          sha256: 7c62d9e115804af47aae79f49ab8b039eeb624242a3a48379f619f6c32f9dad0
      setup: "uv sync --frozen --group dev; use a durable evidence directory outside the checkout"
      verify: "sha256sum tools/policy_chaos.py experiments/policy_assurance/run_experiments.py uv.lock"
      run: "uv run python -m tools.policy_chaos run --published-seeds --output <evidence-dir>/policy-chaos.json"
      capture: [trusted base, report JSON, assertion hashes, published seeds, replay command, exit status]

  - id: ev.accept_proxy_lane
    kind: evidence
    label: "Use real mitmproxy, per-agent UDS, sinkhole, curl/TLS, and host pytest through the proxy blackbox lane"
    detail: |
      The proxy lane installs the product, starts the actual mitmproxy addons
      and per-agent Unix listener, and drives HTTP, CONNECT/TLS, credentials,
      policy, rate limits, attribution, and upstream capture against the real
      sinkhole. It is the primary proxy-system tool, not a substitute for
      sandbox isolation.
    source: tests/blackbox/run-lane.sh
    tool:
      obtain_from: "the trusted-base harness; mitmproxy and Python tools are hash-locked in uv.lock and fetched through the approved SafeYolo proxy"
      sources:
        - path: install.sh
          sha256: abe01951e28d7aecc9d2726def4dccd5518e58704639bc261252a3990e05e977
        - path: tests/blackbox/run-lane.sh
          sha256: 091934297a817e2f9a82b8e9c2277582d6885869aa2dac8ac6b2479b1efeb820
        - path: tests/blackbox/run-tests.sh
          sha256: 430504dc2407be4acb28972243849d654322a0a35f56306218322f17944e43eb
        - path: uv.lock
          sha256: 7c62d9e115804af47aae79f49ab8b039eeb624242a3a48379f619f6c32f9dad0
      setup: "Use an approved host; the lane owns a separate .safeyolo-test instance, ports, certificates, and sinkhole."
      verify: "sha256sum install.sh tests/blackbox/run-lane.sh tests/blackbox/run-tests.sh uv.lock"
      run:
        install_and_proxy: "./tests/blackbox/run-lane.sh proxy --verbose"
        prepared_install: "./tests/blackbox/run-tests.sh --proxy --verbose"
      capture: [trusted base, mitmproxy version, proxy and UDS readiness, sinkhole observation, TLS result, exit status]

  - id: ev.accept_runsc_lane
    kind: evidence
    label: "Use real runsc/gVisor with systrap or KVM through the full isolation blackbox lane"
    detail: |
      This boots a real SafeYolo agent under runsc, asserts the selected
      platform, and runs both ordinary-user and guest-root isolation/lifecycle
      probes. Systrap is the deterministic no-KVM path; KVM must prove actual
      device selection and must never silently fall back.
    source: tests/blackbox/run-lane.sh
    tool:
      obtain_from: "runsc from gVisor's official signed apt repository, or its official tarball plus published SHA-512, through trusted-base safeyolo setup"
      sources:
        - path: tests/blackbox/run-lane.sh
          sha256: 091934297a817e2f9a82b8e9c2277582d6885869aa2dac8ac6b2479b1efeb820
        - path: tests/blackbox/run-tests.sh
          sha256: 430504dc2407be4acb28972243849d654322a0a35f56306218322f17944e43eb
        - path: cli/src/safeyolo/commands/setup.py
          sha256: 63c87cd0790a9b29f177487eed9a021cc569605dcda1d2413a98ded581dabad7
        - path: cli/src/safeyolo/platform/linux.py
          sha256: d0b5e30d685a95a828049825a88db87168e6a8951b29e68a61fb2d1150a49307
      setup: "Use an approved Linux host; run the product bootstrap/setup path and preserve SAFEYOLO_RUNSC_DEBUG=1 for diagnostic evidence."
      verify: "sha256sum tests/blackbox/run-lane.sh tests/blackbox/run-tests.sh cli/src/safeyolo/commands/setup.py cli/src/safeyolo/platform/linux.py && runsc --version && safeyolo doctor --json"
      run:
        gvisor_systrap: "SAFEYOLO_RUNSC_DEBUG=1 ./tests/blackbox/run-lane.sh systrap --verbose"
        gvisor_kvm: "SAFEYOLO_RUNSC_DEBUG=1 ./tests/blackbox/run-lane.sh kvm --verbose"
      capture: [trusted base, runsc version, asserted platform, uid map, guest-root boundary, lifecycle result, runsc logs, exit status]

  - id: ev.accept_vz_lane
    kind: evidence
    label: "Use safeyolo-vm on physical Apple Silicon for VZ isolation and snapshot acceptance"
    detail: |
      Build the Swift helper from the trusted source on the approved physical
      Apple Silicon host. The VZ blackbox lane covers the proxy, microVM,
      guest-root, isolation, and lifecycle boundary. The snapshot smoke tool
      separately exercises save, restore, and fingerprint mismatch behavior.
      Hosted macOS cannot establish this boundary.
    source: vm/Makefile
    tool:
      obtain_from: "safeyolo-vm built from the exact trusted-base Swift sources with the operator-approved Apple toolchain"
      sources:
        - path: vm/Makefile
          sha256: 046089d69acb8c20b507cf4be386b071ab6e6cbb61baabc4b514aa4e9366f898
        - path: vm/Package.swift
          sha256: cacd73db22ee6e881da5cbbcdd9de7f8d56a920951b6feca6ac65d637bcbc47b
        - path: vm/test/snapshot-smoke.sh
          sha256: 9a5a36cd87bc0426fc20277fe71d56e0bb1edb6ca14e95504ca9c5427f35fe9d
        - path: tests/blackbox/run-lane.sh
          sha256: 091934297a817e2f9a82b8e9c2277582d6885869aa2dac8ac6b2479b1efeb820
      setup: "Use the approved physical Apple Silicon host; make -C vm install; prepare a disposable BYOA agent for snapshot smoke."
      verify: "sha256sum vm/Makefile vm/Package.swift vm/test/snapshot-smoke.sh tests/blackbox/run-lane.sh && safeyolo-vm version && safeyolo-vm check"
      run:
        full_vz: "./tests/blackbox/run-lane.sh vz --verbose"
        snapshot_restore: "bash vm/test/snapshot-smoke.sh <disposable-agent>"
      capture: [trusted base, safeyolo-vm version, physical host identity, VZ assertion, snapshot fingerprint result, exit status]

  - id: ev.accept_coord_lane
    kind: evidence
    label: "Use the focused real-NATS Coord retention and two-revision upgrade acceptance"
    detail: |
      These tests own an isolated dynamic-port NATS instance and exercise real
      JetStream and schema migration behavior. They are stronger evidence for
      Coord durability than mocked API tests.
    source: cli/tests/test_coord_kernel_upgrade_acceptance.py
    tool:
      obtain_from: "the trusted-base tests; nats-server from the official nats-io GitHub release with archive and binary SHA-256 pins in nats_runtime.py"
      sources:
        - path: cli/tests/test_coord_kernel_upgrade_acceptance.py
          sha256: c92ee94eba54e99b58d99e29e799919835d543a24b21c3808d51feaa9f997086
        - path: cli/tests/test_coord_jetstream_acceptance.py
          sha256: abb3e9019ab4fc45ad7e2b4a2dd850c5dca3c3638e361111a3f385d1c2bb40ff
        - path: cli/src/safeyolo/coord/nats_runtime.py
          sha256: a2f9dd5a949291da7aa9a52e973c4333437eb39583a0e62124a6f5b8e41f0f9d
      setup: "Use the trusted base's locked Python environment; the tests allocate their own NATS ports."
      verify: "sha256sum cli/tests/test_coord_kernel_upgrade_acceptance.py cli/tests/test_coord_jetstream_acceptance.py cli/src/safeyolo/coord/nats_runtime.py"
      run: "uv run pytest -q cli/tests/test_coord_kernel_upgrade_acceptance.py cli/tests/test_coord_jetstream_acceptance.py"
      capture: [trusted base, Python and nats-server versions, NATS endpoint ownership, schema before and after, exit status]

  - id: ev.accept_supervisor_contract_lane
    kind: evidence
    label: "Use focused supervisor and doctor tests for deterministic state-machine coverage"
    detail: |
      This proves parsing, checkpoint, process-identity, restart-policy, and
      doctor contracts. It does not prove that a real restarted coding agent
      resumes the same dirty checkout; follow the live recovery node for that
      claim.
    source: cli/tests/test_codex_coord_supervisor.py
    tool:
      obtain_from: "the exact operator-approved trusted-base SafeYolo Git object"
      sources:
        - path: cli/tests/test_codex_coord_supervisor.py
          sha256: 4f07426bb84f38018b0caba0d83febd57c1fc3a6ad00efaa6e35e8d890125102
        - path: cli/tests/test_agent_command_supervisor.py
          sha256: c826bd2f974cc6299d9bd365cf0c703a0c746d97596ee038819b5e6b4caf228d
        - path: cli/tests/test_factory_doctor.py
          sha256: c60580f35fb85d75f49278654ae21d292520cc2c540062dd8507150401510ba5
      setup: "Use the trusted base's locked Python environment."
      verify: "sha256sum cli/tests/test_codex_coord_supervisor.py cli/tests/test_agent_command_supervisor.py cli/tests/test_factory_doctor.py"
      run: "uv run pytest -q cli/tests/test_codex_coord_supervisor.py cli/tests/test_agent_command_supervisor.py cli/tests/test_factory_doctor.py"
      capture: [trusted base, focused test selection, exit status, exact failing test]

  - id: ev.accept_factory_recovery_lab
    kind: evidence
    label: "Use a controlled nested lab to prove real supervisor and checkout recovery"
    detail: |
      The lab controller provides labeled panes, identity-checked fault
      injection, evidence capture, and teardown. The repository does not yet
      contain a bounded reusable scenario that proves a restarted supervisor
      resumes the same task, branch, index, and dirty files. Until that gap is
      filled, perform the controlled procedure explicitly and classify the
      missing scenario as a coverage gap rather than treating unit tests as
      equivalent evidence.
    source: cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/scripts/safeyolo-lab
    tool:
      obtain_from: "the safeyolo-lab-controller skill staged from the exact operator-approved trusted-base SafeYolo Git object"
      sources:
        - path: cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/scripts/safeyolo-lab
          sha256: c0f2dc3314c3e1325c2d9e10d5c84e605dbd413ed1e10cbe81c6fe3fea25a4ee
        - path: cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/scripts/capture-evidence.sh
          sha256: 5f990bdc860c18e8c7e8312d875d767febb32dceb2ed2f5328a596703ebb3990
        - path: cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/scripts/lab-snapshot.sh
          sha256: 83267d87867b13f82e1cc41dbc34bf081c1116cc2c54ec6d16fead857bf64b63
      setup: "Use one disposable nested factory with a single durable Forge checkout and retained evidence directory."
      verify: "sha256sum cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/scripts/{safeyolo-lab,capture-evidence.sh,lab-snapshot.sh}"
      run: "safeyolo-lab"
      capture: [task target, branch, index and working-tree hashes, old and new process identities, resumed agent action]

  - id: ev.accept_nested_linux_lane
    kind: evidence
    label: "Use the repository's real SafeYolo-in-SafeYolo Linux acceptance lane"
    detail: |
      This builds and starts an isolated inner SafeYolo through the outer proxy,
      proves loop handling, starts a real agent, and verifies bundled Coord MCP
      connectivity. It owns a dedicated guest-local lab root and must not point
      at the mounted working checkout.
    source: tests/nested-linux/acceptance.sh
    tool:
      obtain_from: "the exact operator-approved trusted-base SafeYolo Git object"
      sources:
        - path: tests/nested-linux/acceptance.sh
          sha256: 226301055603e4a2123a30821debc831e279ce3af27d2d29acad644d54951679
        - path: tests/nested-linux/flow_probe.py
          sha256: 769e1ac6ef5eb73a9af67bf286dc89b144c2ddd7df556164136cedde77f76c64
        - path: tests/nested-linux/mcp_probe.py
          sha256: b9f721bc11b5dceaafea0422b5143d516111465507f0491f331670da3695f822
      setup: "Use an approved Linux SafeYolo agent with guest sudo and sufficient disk/memory; preserve the outer proxy variables."
      verify: "sha256sum tests/nested-linux/acceptance.sh tests/nested-linux/flow_probe.py tests/nested-linux/mcp_probe.py"
      run: "SAFEYOLO_NESTED_ACCEPT=1 ./tests/nested-linux/acceptance.sh"
      capture: [trusted base, outer and inner platform, inner agent identity, proxy loop result, Coord MCP result, exit status]

  - id: ev.accept_rootfs_lane
    kind: evidence
    label: "Use skopeo, umoci, chroot package installation, and ext4 tooling through the trusted rootfs builder"
    detail: |
      This is the primary rootfs construction probe: skopeo acquires the OCI
      base, umoci preserves ownership and xattrs, the rootfs's signed package
      sources install declared packages, and e2fsprogs emits the VZ image.
      Record the resolved OCI digest because the current default Debian tag is
      not pinned; that is a reproducibility gap, not permission to conceal it.
    source: guest/build-rootfs.sh
    tool:
      obtain_from: "trusted-base build scripts; skopeo, umoci, and e2fsprogs from operator-approved signed OS repositories or the checksum-pinned umoci fallback in safeyolo bootstrap"
      sources:
        - path: guest/build-all.sh
          sha256: 18b1bcb2a3c203e2ee993d3ca9d0ebe5ae6d4c81998c358fb8ad26100c3b4c07
        - path: guest/build-rootfs.sh
          sha256: 10d081983d70d5ddf436af03572af030c3f2bcf21080114f1493fc131844edc1
        - path: guest/rootfs-customize-hook.sh
          sha256: 50b7c68b38d9427be8701c4c5a0bae70006ad0985d080824bc5e91420d8a80b0
      setup: "Use an approved Linux builder or the repository's narrow Lima builder; set OUTPUT_DIR to a disposable acceptance directory."
      verify: "sha256sum guest/build-all.sh guest/build-rootfs.sh guest/rootfs-customize-hook.sh && skopeo --version && umoci --version && mkfs.ext4 -V"
      run:
        linux_rootfs: "OUTPUT_DIR=<disposable-output-dir> ./guest/build-rootfs.sh"
        full_vz_artifacts: "BUILD_KERNEL=1 OUTPUT_DIR=<disposable-output-dir> ./guest/build-all.sh"
      capture: [trusted base, tool versions, resolved OCI digest, package sources, artifact manifest and hashes, ownership map, exit status]

  - id: ev.accept_uds_lane
    kind: evidence
    label: "Use current blackbox UDS transport plus focused socket and attribution pytest"
    detail: |
      The system proof is the current proxy or platform blackbox path: it binds
      the real mitmproxy UnixInstance, drives HTTP and CONNECT over the UDS, and
      checks sandbox reachability and attribution. Use focused CLI pytest for
      parsing, mount construction, native runsc stream donation, or doctor
      diagnostics; do not substitute the excluded historical uds-networking
      prototypes for current production acceptance.
    source: tests/blackbox/host/uds_transport.py
    tool:
      obtain_from: "the exact trusted-base blackbox and focused pytest sources; Python tools hash-locked in uv.lock"
      sources:
        - path: tests/blackbox/run-tests.sh
          sha256: 430504dc2407be4acb28972243849d654322a0a35f56306218322f17944e43eb
        - path: tests/blackbox/host/uds_transport.py
          sha256: c6ea54d568d0d8d47c73722f2241a2374d8c06181ab71408d7e008e53df08a67
        - path: cli/tests/test_sockets.py
          sha256: 1fd1b1f63296f8a8ae031aba9b7a89bf15dc13933bb059c40581927168670221
        - path: cli/tests/test_linux_platform_oci.py
          sha256: d00c0223b83f44c0fbdfad63d4ada82d6f0936c9256129c041da063f9ba2531e
      setup: "Use the prepared proxy lane for system evidence or the locked Python environment for a focused implementation probe."
      verify: "sha256sum tests/blackbox/run-tests.sh tests/blackbox/host/uds_transport.py cli/tests/test_sockets.py cli/tests/test_linux_platform_oci.py"
      run:
        real_proxy_uds: "./tests/blackbox/run-tests.sh --proxy --verbose"
        focused_implementation: "uv run pytest -q cli/tests/test_sockets.py cli/tests/test_linux_platform_oci.py"
      capture: [trusted base, real or focused boundary, UDS path identity, agent attribution, transport result, exit status]

  - id: ev.accept_ruff_lane
    kind: evidence
    label: "Use Ruff and the trusted pre-commit hooks for changed-file quality and complexity checks"
    detail: |
      Run pre-commit against material changed files, then use Ruff's explicit
      complexity and oversized-function rules for changed production Python.
      Findings are review evidence rather than automatic vetoes. Architecture
      fitness rules beyond these configured checks remain a graph gap.
    source: ruff.toml
    tool:
      obtain_from: "Ruff hash-locked in uv.lock and pre-commit hooks pinned by revision in the trusted-base configuration"
      sources:
        - path: ruff.toml
          sha256: ec622855546870fcea36325759af749cd95480b10df98c95b6a8a95ccca73213
        - path: .pre-commit-config.yaml
          sha256: 802f279395812ff087e09ad750e4f36226e10e4dfb1de29c0a87bab487eb826c
        - path: uv.lock
          sha256: 7c62d9e115804af47aae79f49ab8b039eeb624242a3a48379f619f6c32f9dad0
      setup: "Use the trusted base's locked Python environment and already-approved hook dependencies."
      verify: "sha256sum ruff.toml .pre-commit-config.yaml uv.lock && uv run ruff --version"
      run:
        changed_hooks: "uv run pre-commit run --files <material-changed-files>"
        complexity: "uv run ruff check <changed-production-python> --select C901,PLR0911,PLR0912,PLR0913,PLR0915"
      capture: [trusted base, changed-file list, Ruff and hook identities, exit status, exact findings]

  - id: ev.accept_mypy_lane
    kind: evidence
    label: "Use mypy to challenge affected state and interface contracts"
    detail: |
      Check the changed production modules and their directly affected package,
      then compare candidate findings with the trusted base. This repository is
      not yet globally mypy-clean: existing findings remain useful debt and
      candidate deltas remain review evidence, but neither result alone proves
      state-machine correctness. Pair material state claims with focused or
      Hypothesis stateful tests.
    source: tools/acceptance/pyproject.toml
    tool:
      obtain_from: "mypy declared and hash-locked in the isolated tools/acceptance uv project, fetched through the approved SafeYolo proxy"
      sources:
        - path: tools/acceptance/pyproject.toml
          sha256: 95d5d041dea3951f039ad4ffeebf8fb2897dd216df6ddf2bd1da0e03e7804d2c
        - path: tools/acceptance/uv.lock
          sha256: ee045a54387a26c6cfe27c60422f2e56a64b73001f41d108e90f01e90415299f
      setup: "uv sync --project tools/acceptance --frozen --only-group static"
      verify: "sha256sum tools/acceptance/{pyproject.toml,uv.lock} && uv run --project tools/acceptance --frozen --no-sync mypy --version"
      run:
        changed_modules: "uv run --project tools/acceptance --frozen --no-sync mypy --config-file tools/acceptance/pyproject.toml <changed-production-python>"
        affected_package: "uv run --project tools/acceptance --frozen --no-sync mypy --config-file tools/acceptance/pyproject.toml <smallest-affected-package>"
      capture: [trusted base and candidate revisions, exact paths, mypy version, base findings, candidate findings, new or changed findings, exit status]

  - id: ev.accept_concurrency_stress_lane
    kind: evidence
    label: "Use pytest-repeat and pytest-xdist to stress ordering and shared-state assumptions"
    detail: |
      Repeat one deterministic focused test to expose intermittent ordering or
      cleanup defects, and run multiple independent hermetic nodes in separate
      xdist workers to challenge shared ports, files, environment, and global
      process state. xdist does not make one test internally concurrent, and a
      passing sample does not prove race freedom. Retain worker count, repeat
      count, seed, and any first failing iteration.
    source: tools/acceptance/requirements-stress.txt
    tool:
      obtain_from: "pytest-repeat and pytest-xdist in the hash-bearing tools/acceptance stress requirements export, layered over the exact root project environment"
      sources:
        - path: pyproject.toml
          sha256: 0c9af5325d18a3fbfe5ee1fb577fa009d0ea057c75bf157017c4c69d7d5b99d8
        - path: uv.lock
          sha256: 7c62d9e115804af47aae79f49ab8b039eeb624242a3a48379f619f6c32f9dad0
        - path: tools/acceptance/requirements-stress.txt
          sha256: 5ef03fb3b4dbceda038ab1c919061096bb3c1e0548d244da0015f7ea4939e20e
      setup: "uv sync --frozen --group dev; select only hermetic focused nodes and give each test-owned external service a distinct endpoint"
      verify: "sha256sum pyproject.toml uv.lock tools/acceptance/requirements-stress.txt && uv run --frozen --with-requirements tools/acceptance/requirements-stress.txt python -c \"import importlib.metadata as m; print(m.version('pytest-repeat'), m.version('pytest-xdist'))\""
      run:
        repeated_node: "PYTHONASYNCIODEBUG=1 uv run --frozen --with-requirements tools/acceptance/requirements-stress.txt pytest -q --count=20 <focused-test-node>"
        parallel_isolation: "PYTHONASYNCIODEBUG=1 uv run --frozen --with-requirements tools/acceptance/requirements-stress.txt pytest -q -n 2 --dist loadscope <two-or-more-hermetic-focused-test-nodes>"
      capture: [trusted base and candidate revisions, exact test nodes, plugin versions, worker and repeat counts, seed, first failing iteration, exit status]

  - id: ev.accept_semgrep_lane
    kind: evidence
    label: "Use the local tested Semgrep rules for high-signal SafeYolo security invariants"
    detail: |
      Run only the trusted local rules: no registry auto-config, login, remote
      rules, or autofix. The initial rules challenge disabled TLS verification,
      shell-based subprocess execution, race-prone temporary names, and unsafe
      YAML loading. A finding is a precise review lead, not an automatic veto;
      inspect intent and compare candidate results with the trusted base.
    source: tools/acceptance/semgrep-rules.yml
    tool:
      obtain_from: "Semgrep declared and hash-locked in the isolated tools/acceptance uv project; rules and rule tests come from the exact trusted-base Git object"
      sources:
        - path: tools/acceptance/pyproject.toml
          sha256: 95d5d041dea3951f039ad4ffeebf8fb2897dd216df6ddf2bd1da0e03e7804d2c
        - path: tools/acceptance/uv.lock
          sha256: ee045a54387a26c6cfe27c60422f2e56a64b73001f41d108e90f01e90415299f
        - path: tools/acceptance/semgrep-rules.yml
          sha256: 36c03e46e234a6a4d1d72233c72096099d1bb1e798216d9413ddb817eb944555
        - path: tools/acceptance/semgrep-rules.py
          sha256: f85ac789cea596707cc98a22c5563963887caf0e69e17f4810ea84e79aef4b5f
      setup: "uv sync --project tools/acceptance --frozen --only-group static"
      verify: "sha256sum tools/acceptance/{pyproject.toml,uv.lock,semgrep-rules.yml,semgrep-rules.py} && uv run --project tools/acceptance --frozen --no-sync semgrep test --config tools/acceptance/semgrep-rules.yml tools/acceptance/semgrep-rules.py"
      run:
        changed_code: "uv run --project tools/acceptance --frozen --no-sync semgrep scan --metrics=off --disable-version-check --json --config tools/acceptance/semgrep-rules.yml <changed-production-python>"
        production_baseline: "uv run --project tools/acceptance --frozen --no-sync semgrep scan --metrics=off --disable-version-check --json --config tools/acceptance/semgrep-rules.yml cli/src/safeyolo"
      capture: [trusted base and candidate revisions, exact paths, Semgrep version from JSON, rule IDs and hashes, base findings, candidate findings, exit status]

  - id: ev.accept_dependency_audit_lane
    kind: evidence
    label: "Use pip-audit on an exact hash-bearing export of runtime dependencies"
    detail: |
      Export only the locked product runtime closure, excluding developer and
      acceptance tools, then query the selected vulnerability service. The
      lock establishes package identity; the feed is time-varying evidence, so
      retain service and observation time. Reuse Lens's persistent audit cache
      rather than repeating dozens of unchanged package lookups.
    source: uv.lock
    tool:
      obtain_from: "pip-audit declared and hash-locked in the isolated tools/acceptance uv project, fetched through the approved SafeYolo proxy"
      sources:
        - path: pyproject.toml
          sha256: 0c9af5325d18a3fbfe5ee1fb577fa009d0ea057c75bf157017c4c69d7d5b99d8
        - path: uv.lock
          sha256: 7c62d9e115804af47aae79f49ab8b039eeb624242a3a48379f619f6c32f9dad0
        - path: tools/acceptance/pyproject.toml
          sha256: 95d5d041dea3951f039ad4ffeebf8fb2897dd216df6ddf2bd1da0e03e7804d2c
        - path: tools/acceptance/uv.lock
          sha256: ee045a54387a26c6cfe27c60422f2e56a64b73001f41d108e90f01e90415299f
      setup: "uv sync --project tools/acceptance --frozen --only-group static; retain /home/agent/.cache/pip-audit across tasks"
      verify: "sha256sum pyproject.toml uv.lock tools/acceptance/{pyproject.toml,uv.lock} && uv run --project tools/acceptance --frozen --no-sync pip-audit --version"
      run:
        export_runtime: "uv export --quiet --frozen --no-dev --no-emit-project --format requirements.txt --output-file /tmp/safeyolo-runtime-requirements.txt"
        audit_runtime: "uv run --project tools/acceptance --frozen --no-sync pip-audit --requirement /tmp/safeyolo-runtime-requirements.txt --require-hashes --disable-pip --cache-dir /home/agent/.cache/pip-audit --timeout 30 --progress-spinner off --format json"
      capture: [trusted revision, pyproject and lock hashes, exported closure hash, pip-audit version, vulnerability service, observation time, advisories or infrastructure failure, exit status]

  - id: ev.accept_radon_lane
    kind: evidence
    label: "Use Radon for an independent complexity and maintainability view"
    detail: |
      Report only C-or-worse cyclomatic blocks and B/C maintainability files
      in the changed production area, then compare with the trusted base.
      Numeric scores are prompts for focused design review, not quality truth
      or automatic merge thresholds; investigate meaningful regressions and
      already-complex code made materially harder to reason about.
    source: tools/acceptance/pyproject.toml
    tool:
      obtain_from: "Radon declared and hash-locked in the isolated tools/acceptance uv project, fetched through the approved SafeYolo proxy"
      sources:
        - path: tools/acceptance/pyproject.toml
          sha256: 95d5d041dea3951f039ad4ffeebf8fb2897dd216df6ddf2bd1da0e03e7804d2c
        - path: tools/acceptance/uv.lock
          sha256: ee045a54387a26c6cfe27c60422f2e56a64b73001f41d108e90f01e90415299f
      setup: "uv sync --project tools/acceptance --frozen --only-group static"
      verify: "sha256sum tools/acceptance/{pyproject.toml,uv.lock} && uv run --project tools/acceptance --frozen --no-sync radon --version"
      run:
        cyclomatic: "uv run --project tools/acceptance --frozen --no-sync radon cc <changed-production-python> -s -n C -o SCORE"
        maintainability: "uv run --project tools/acceptance --frozen --no-sync radon mi <changed-production-python> -s --sort -n B -x C"
      capture: [trusted base and candidate revisions, exact paths, Radon version, base scores, candidate scores, material regressions, exit status]

  - id: ev.accept_codeql_lane
    kind: evidence
    label: "Use the checksum-pinned local CodeQL bundle for production Python security and data-flow analysis"
    detail: |
      The repository helper downloads the official GitHub CodeQL bundle only
      for supported platforms, verifies its pinned archive hash, builds the
      configured Python database, and runs the same query suite as CI. A local
      unsupported-platform skip is not passing security evidence; retain the
      exact-head CI CodeQL result instead.
    source: scripts/check_codeql.py
    tool:
      obtain_from: "official GitHub CodeQL release assets whose archive SHA-256 and action identity are pinned in .github/codeql/local-bundle.json"
      sources:
        - path: scripts/check_codeql.py
          sha256: c11863c7d4b3dbd2bee27c8482c3bf83b25464c7292c4bfa7d4bbe36550fd23f
        - path: .github/codeql/local-bundle.json
          sha256: 414eddd30321b51420614d374a09b9f725ff0fd418c0b1bd96af969d825bcc0d
        - path: .github/codeql/codeql-config.yml
          sha256: 7a10d8cff38ca0c49acd0e371d8a6e6f59408f807d611efcc07933bc3a9413da
      setup: "Use an approved supported host with sufficient disk; preserve the helper's persistent verified bundle cache."
      verify: "sha256sum scripts/check_codeql.py .github/codeql/local-bundle.json .github/codeql/codeql-config.yml && uv run python scripts/check_codeql.py --install-only"
      run: "uv run python scripts/check_codeql.py"
      capture: [trusted base, CodeQL version and bundle hash, database language and source root, SARIF findings, exit status]

  - id: ev.accept_classify_result
    kind: evidence
    label: "Classify what the trusted probe actually established"
    detail: |
      Separate a product defect from a broken acceptance environment, an
      unavailable approved resource, a changed/untrusted tool, and a missing
      real boundary. A command exiting zero is evidence only for the claims its
      exercised boundary actually covers.
    source: authored

  # ---- Classifications ------------------------------------------------
  - id: cls.accept_claim_proven
    kind: classification
    label: "The trusted probe exercised the material boundary and produced current passing evidence"
    source: authored

  - id: cls.accept_product_defect
    kind: classification
    label: "The trusted probe reached the intended boundary and exposed a product or candidate defect"
    source: authored

  - id: cls.accept_environment_defect
    kind: classification
    label: "The approved acceptance environment or its trusted dependencies are unhealthy"
    source: authored

  - id: cls.accept_tool_identity_mismatch
    kind: classification
    label: "The available tool source or hash does not match the trusted-base graph"
    source: authored

  - id: cls.accept_coverage_gap
    kind: classification
    label: "No current trusted probe exercises the material real-system boundary"
    source: authored

  - id: cls.accept_resource_missing
    kind: classification
    label: "The correct probe needs an operator-approved resource not currently bound to Lens"
    source: authored

  # ---- Conclusions and operator asks ---------------------------------
  - id: con.accept_record_evidence
    kind: conclusion
    label: "Record the exact evidence and keep the reusable environment ready"
    source: authored

  - id: con.accept_report_defect
    kind: conclusion
    label: "Report the concrete defect with boundary, reproducer, and exact evidence"
    source: authored

  - id: con.accept_repair_environment
    kind: conclusion
    label: "Repair the approved acceptance environment, then rerun the same trusted probe"
    source: authored

  - id: con.accept_extend_harness
    kind: conclusion
    label: "Build the smallest reusable trusted probe that closes this graph gap"
    source: authored

  - id: ask.accept_trusted_tool_update
    kind: operator_ask
    label: "Ask the operator to approve the specific new tool source/version/hash"
    source: authored

  - id: ask.accept_resource
    kind: operator_ask
    label: "Ask the operator for the specific missing platform, service, or capability"
    source: authored

edges:
  - {from: sym.accept_candidate, to: ev.accept_select_boundary, kind: next_check, when: "identify the candidate's material claims and affected boundaries"}
  - {from: sym.accept_background, to: ev.accept_select_boundary, kind: next_check, when: "choose one recent, stale, failed, or unproven useful boundary"}

  - {from: ev.accept_select_boundary, to: ev.accept_python_lane, kind: next_check, when: "a focused Python behavior or regression is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_policy_chaos_lane, kind: next_check, when: "generated policy sequences, concurrency, or failure stages are material"}
  - {from: ev.accept_select_boundary, to: ev.accept_proxy_lane, kind: next_check, when: "install, mitmproxy, policy enforcement, credentials, HTTP, or TLS is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_runsc_lane, kind: next_check, when: "Linux runsc, systrap, KVM, guest-root, isolation, or lifecycle is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_vz_lane, kind: next_check, when: "Apple VZ, safeyolo-vm, or snapshot behavior is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_coord_lane, kind: next_check, when: "Coord retention, JetStream, or schema upgrade is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_supervisor_contract_lane, kind: next_check, when: "supervisor or factory state-machine behavior is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_factory_recovery_lab, kind: next_check, when: "real crash and useful-work recovery is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_nested_linux_lane, kind: next_check, when: "nested Linux composition is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_rootfs_lane, kind: next_check, when: "rootfs construction, package inventory, or image contents are material"}
  - {from: ev.accept_select_boundary, to: ev.accept_uds_lane, kind: next_check, when: "UDS transport, attribution, or proxy-only egress is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_ruff_lane, kind: next_check, when: "changed-file quality or complexity is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_mypy_lane, kind: next_check, when: "state shape, optionality, or interface contracts are material"}
  - {from: ev.accept_select_boundary, to: ev.accept_concurrency_stress_lane, kind: next_check, when: "ordering, cleanup, shared resources, or intermittent behavior are material"}
  - {from: ev.accept_select_boundary, to: ev.accept_semgrep_lane, kind: next_check, when: "a local high-signal security invariant is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_dependency_audit_lane, kind: next_check, when: "the exact runtime dependency closure needs current vulnerability evidence"}
  - {from: ev.accept_select_boundary, to: ev.accept_radon_lane, kind: next_check, when: "structural complexity or maintainability regression is material"}
  - {from: ev.accept_select_boundary, to: ev.accept_codeql_lane, kind: next_check, when: "security, taint, or data-flow analysis is material"}

  - {from: sym.accept_install_proxy, to: ev.accept_proxy_lane, kind: next_check, when: "exercise the installed real proxy and sinkhole boundary"}
  - {from: sym.accept_python_behavior, to: ev.accept_python_lane, kind: next_check, when: "select the smallest existing pytest or Hypothesis node"}
  - {from: sym.accept_policy_assurance, to: ev.accept_policy_chaos_lane, kind: next_check, when: "generated transaction sequences or concurrency are material"}
  - {from: sym.accept_policy_assurance, to: ev.accept_proxy_lane, kind: next_check, when: "the claim is actual loaded-proxy enforcement rather than the policy transaction engine"}
  - {from: sym.accept_agent_isolation, to: ev.accept_runsc_lane, kind: next_check, when: "the affected production platform is Linux/gVisor"}
  - {from: sym.accept_agent_isolation, to: ev.accept_vz_lane, kind: next_check, when: "the affected production platform is physical Apple Silicon/VZ"}
  - {from: sym.accept_coord, to: ev.accept_coord_lane, kind: next_check, when: "use isolated real-NATS tests"}
  - {from: sym.accept_factory_recovery, to: ev.accept_supervisor_contract_lane, kind: next_check, when: "first establish deterministic supervisor contracts"}
  - {from: ev.accept_supervisor_contract_lane, to: ev.accept_factory_recovery_lab, kind: next_check, when: "the claim includes a real restart or useful-work continuity"}
  - {from: sym.accept_nested_linux, to: ev.accept_nested_linux_lane, kind: next_check, when: "an approved Linux agent is available"}
  - {from: sym.accept_nested_linux, to: cls.accept_resource_missing, kind: implies, when: "no approved Linux SafeYolo agent can host the inner instance"}
  - {from: sym.accept_rootfs, to: ev.accept_rootfs_lane, kind: next_check, when: "an approved Linux or narrow Lima build environment is available"}
  - {from: sym.accept_rootfs, to: cls.accept_resource_missing, kind: implies, when: "no approved rootfs build environment is available"}
  - {from: sym.accept_uds_transport, to: ev.accept_uds_lane, kind: next_check, when: "select current system or focused implementation evidence"}
  - {from: sym.accept_macos_vz, to: ev.accept_vz_lane, kind: next_check, when: "an approved physical Apple Silicon VZ host is available"}
  - {from: sym.accept_macos_vz, to: cls.accept_resource_missing, kind: implies, when: "only a hosted macOS runner or no VZ host is available"}
  - {from: sym.accept_static_quality, to: ev.accept_ruff_lane, kind: next_check, when: "lint, changed-file hooks, or configured complexity rules cover the claim"}
  - {from: sym.accept_static_quality, to: ev.accept_radon_lane, kind: next_check, when: "an independent numeric complexity comparison would sharpen review"}
  - {from: sym.accept_static_quality, to: ev.accept_mypy_lane, kind: next_check, when: "the change affects typed state or interface contracts"}
  - {from: sym.accept_static_quality, to: ev.accept_codeql_lane, kind: next_check, when: "security or interprocedural data-flow analysis is material"}
  - {from: sym.accept_static_quality, to: cls.accept_coverage_gap, kind: implies, when: "the needed architecture fitness rule is not configured"}
  - {from: sym.accept_security_analysis, to: ev.accept_codeql_lane, kind: next_check, when: "the changed code is production Python on a supported CodeQL platform"}
  - {from: sym.accept_security_analysis, to: ev.accept_semgrep_lane, kind: next_check, when: "the trusted local rules cover the changed security boundary"}
  - {from: sym.accept_security_analysis, to: ev.accept_dependency_audit_lane, kind: next_check, when: "the risk is in the locked runtime dependency closure"}
  - {from: sym.accept_security_analysis, to: cls.accept_resource_missing, kind: implies, when: "only a platform without a pinned native CodeQL bundle is available"}
  - {from: sym.accept_state_integrity, to: ev.accept_mypy_lane, kind: next_check, when: "challenge impossible or confused states at Python interfaces"}
  - {from: sym.accept_state_integrity, to: ev.accept_policy_chaos_lane, kind: next_check, when: "state transitions need generated dynamic sequences"}
  - {from: sym.accept_state_integrity, to: ev.accept_python_lane, kind: next_check, when: "a focused state-transition regression can be exercised directly"}
  - {from: sym.accept_race_risk, to: ev.accept_concurrency_stress_lane, kind: next_check, when: "bounded repeated or multi-process stress can expose the suspected coupling"}
  - {from: sym.accept_race_risk, to: ev.accept_policy_chaos_lane, kind: next_check, when: "policy transaction interleavings or crash stages are material"}
  - {from: sym.accept_dependency_security, to: ev.accept_dependency_audit_lane, kind: next_check, when: "audit the exact locked product runtime closure"}

  - {from: ev.accept_python_lane, to: ev.accept_classify_result, kind: next_check, when: "focused tests complete or fail"}
  - {from: ev.accept_policy_chaos_lane, to: ev.accept_classify_result, kind: next_check, when: "the chaos report completes or records a finding/infrastructure error"}
  - {from: ev.accept_proxy_lane, to: ev.accept_classify_result, kind: next_check, when: "the real proxy lane completes or fails"}
  - {from: ev.accept_runsc_lane, to: ev.accept_classify_result, kind: next_check, when: "the asserted runsc platform lane completes or fails"}
  - {from: ev.accept_vz_lane, to: ev.accept_classify_result, kind: next_check, when: "the physical VZ probe completes or fails"}
  - {from: ev.accept_coord_lane, to: ev.accept_classify_result, kind: next_check, when: "focused acceptance completes or fails"}
  - {from: ev.accept_supervisor_contract_lane, to: ev.accept_classify_result, kind: next_check, when: "focused tests complete and no real restart claim remains"}
  - {from: ev.accept_factory_recovery_lab, to: ev.accept_classify_result, kind: next_check, when: "the controlled recovery observation completes"}
  - {from: ev.accept_factory_recovery_lab, to: cls.accept_coverage_gap, kind: implies, when: "no bounded repeatable real-recovery scenario exists"}
  - {from: ev.accept_nested_linux_lane, to: ev.accept_classify_result, kind: next_check, when: "nested acceptance completes or fails"}
  - {from: ev.accept_rootfs_lane, to: ev.accept_classify_result, kind: next_check, when: "the clean rootfs build and artifact inspection complete or fail"}
  - {from: ev.accept_uds_lane, to: ev.accept_classify_result, kind: next_check, when: "the current UDS system or focused probe completes or fails"}
  - {from: ev.accept_ruff_lane, to: ev.accept_classify_result, kind: next_check, when: "configured hooks and selected Ruff rules complete"}
  - {from: ev.accept_mypy_lane, to: ev.accept_classify_result, kind: next_check, when: "base and candidate type-contract findings are comparable"}
  - {from: ev.accept_concurrency_stress_lane, to: ev.accept_classify_result, kind: next_check, when: "the bounded repeated or parallel sample completes or exposes a failure"}
  - {from: ev.accept_semgrep_lane, to: ev.accept_classify_result, kind: next_check, when: "trusted local rule tests and the selected scan complete"}
  - {from: ev.accept_dependency_audit_lane, to: ev.accept_classify_result, kind: next_check, when: "the exact closure is queried or the feed/cache path fails concretely"}
  - {from: ev.accept_radon_lane, to: ev.accept_classify_result, kind: next_check, when: "base and candidate complexity evidence is comparable"}
  - {from: ev.accept_codeql_lane, to: ev.accept_classify_result, kind: next_check, when: "CodeQL analyzes the source or produces a concrete unsupported/infrastructure result"}

  - {from: ev.accept_classify_result, to: cls.accept_claim_proven, kind: implies, when: "the correct trusted tool exercised the material boundary and passed"}
  - {from: ev.accept_classify_result, to: cls.accept_product_defect, kind: implies, when: "the trusted tool reached the boundary and reproduced incorrect behavior"}
  - {from: ev.accept_classify_result, to: cls.accept_environment_defect, kind: implies, when: "setup or a previously approved dependency is broken"}
  - {from: ev.accept_classify_result, to: cls.accept_tool_identity_mismatch, kind: implies, when: "source path or SHA-256 differs from the trusted graph"}
  - {from: ev.accept_classify_result, to: cls.accept_coverage_gap, kind: implies, when: "the probe did not exercise the claim's real boundary"}
  - {from: ev.accept_classify_result, to: cls.accept_resource_missing, kind: implies, when: "the correct probe requires a resource outside Lens's approved bindings"}

  - {from: cls.accept_claim_proven, to: con.accept_record_evidence, kind: implies, when: "evidence names the exact source, revision, boundary, and result"}
  - {from: cls.accept_product_defect, to: con.accept_report_defect, kind: implies, when: "the reproducer is specific and repeatable"}
  - {from: cls.accept_environment_defect, to: con.accept_repair_environment, kind: implies, when: "repair uses already approved resources and trusted dependencies"}
  - {from: cls.accept_tool_identity_mismatch, to: con.accept_repair_environment, kind: implies, when: "the exact listed source can be restored from the bound trusted base"}
  - {from: cls.accept_tool_identity_mismatch, to: ask.accept_trusted_tool_update, kind: escalates_to, when: "the trusted source cannot be restored from the bound base"}
  - {from: cls.accept_coverage_gap, to: con.accept_extend_harness, kind: implies, when: "the missing probe can be built with approved resources and repository tooling"}
  - {from: cls.accept_resource_missing, to: ask.accept_resource, kind: escalates_to, when: "name the exact resource and evidence it enables"}

