        focused_implementation: "CARGO_BUILD_JOBS=1 scripts/cargo_with_space.sh test --manifest-path proxy/Cargo.toml --locked --test native_host_cli <affected-test-name>"
      capture: [trusted base, real or focused boundary, UDS path identity, agent attribution, transport result, exit status]

  - id: ev.accept_ruff_lane
    kind: evidence
    label: "Use Ruff and the trusted pre-commit hooks for changed-file quality and complexity checks"
    detail: |
      Run pre-commit against material changed files, then use Ruff's explicit
      complexity and oversized-function rules for changed production Python.
      Findings are review evidence rather than automatic vetoes. Architecture
      fitness rules beyond these configured checks remain a graph gap.
    source: ruff.toml
    tool:
      obtain_from: "Ruff hash-locked in uv.lock and pre-commit hooks pinned by revision in the trusted-base configuration"
      sources:
        - path: ruff.toml
          sha256: ec622855546870fcea36325759af749cd95480b10df98c95b6a8a95ccca73213
        - path: .pre-commit-config.yaml
          sha256: 91ada1101761243365bb0ae0ce5ebf99d8e97d51c59c71a56aad31013af9a5f1
        - path: uv.lock
          sha256: fd244df9e559bed2b211bbe93f257831fce8e1087b19cfc7d9d3da2fd1bc3050
      setup: "Use the trusted base's locked Python environment and already-approved hook dependencies."
      verify: "sha256sum ruff.toml .pre-commit-config.yaml uv.lock && uv run ruff --version"
      run:
        changed_hooks: "uv run pre-commit run --files <material-changed-files>"
        complexity: "uv run ruff check <changed-production-python> --select C901,PLR0911,PLR0912,PLR0913,PLR0915"
      capture: [trusted base, changed-file list, Ruff and hook identities, exit status, exact findings]

  - id: ev.accept_mypy_lane
    kind: evidence
    label: "Use mypy to challenge affected state and interface contracts"
    detail: |
      Check the changed production modules and their directly affected package,
      then compare candidate findings with the trusted base. This repository is
      not yet globally mypy-clean: existing findings remain useful debt and
      candidate deltas remain review evidence, but neither result alone proves
      state-machine correctness. Pair material state claims with focused or
      Hypothesis stateful tests.
    source: tools/acceptance/pyproject.toml
    tool:
      obtain_from: "mypy declared and hash-locked in the isolated tools/acceptance uv project, fetched through the approved SafeYolo proxy"
      sources:
        - path: tools/acceptance/pyproject.toml
          sha256: 30ef94b727a4e867be6c6757b1b4512c07af3065511e27404e7101e254f2a737
        - path: tools/acceptance/uv.lock
          sha256: 1e5c3ea9b0a8559bd4b39debfe03afc064221f92fb06687e06691f6c0caca2bb
      setup: "uv sync --project tools/acceptance --frozen --only-group static"
      verify: "sha256sum tools/acceptance/{pyproject.toml,uv.lock} && uv run --project tools/acceptance --frozen --no-sync mypy --version"
      run:
        changed_modules: "uv run --project tools/acceptance --frozen --no-sync mypy --config-file tools/acceptance/pyproject.toml <changed-production-python>"
        affected_package: "uv run --project tools/acceptance --frozen --no-sync mypy --config-file tools/acceptance/pyproject.toml <smallest-affected-package>"
      capture: [trusted base and candidate revisions, exact paths, mypy version, base findings, candidate findings, new or changed findings, exit status]

  - id: ev.accept_concurrency_stress_lane
    kind: evidence
    label: "Use pytest-repeat and pytest-xdist to stress ordering and shared-state assumptions"
    detail: |
      Repeat one deterministic focused test to expose intermittent ordering or
      cleanup defects, and run multiple independent hermetic nodes in separate
      xdist workers to challenge shared ports, files, environment, and global
      process state. xdist does not make one test internally concurrent, and a
      passing sample does not prove race freedom. Retain worker count, repeat
      count, seed, and any first failing iteration.
      For an in-process race, write a test with concurrent actors and an
      explicit synchronization point that reaches the suspected interleaving.
      Assert the resulting shared state; repetition alone does not create the
      schedule needed to expose the defect.
    source: tools/acceptance/requirements-stress.txt
    tool:
      obtain_from: "pytest-repeat and pytest-xdist in the hash-bearing tools/acceptance stress requirements export, layered over the exact root project environment"
      sources:
        - path: pyproject.toml
          sha256: 1e11bf66e0cf0aa1798847289cc72a247936951b5816265ca777b683fb64e9e6
        - path: uv.lock
          sha256: fd244df9e559bed2b211bbe93f257831fce8e1087b19cfc7d9d3da2fd1bc3050
        - path: tools/acceptance/requirements-stress.txt
          sha256: 5ef03fb3b4dbceda038ab1c919061096bb3c1e0548d244da0015f7ea4939e20e
      setup: "uv sync --frozen --group dev; select only hermetic focused nodes and give each test-owned external service a distinct endpoint"
      verify: "sha256sum pyproject.toml uv.lock tools/acceptance/requirements-stress.txt && uv run --frozen --with-requirements tools/acceptance/requirements-stress.txt python -c \"import importlib.metadata as m; print(m.version('pytest-repeat'), m.version('pytest-xdist'))\""
      run:
        repeated_node: "PYTHONASYNCIODEBUG=1 uv run --frozen --with-requirements tools/acceptance/requirements-stress.txt pytest -q --count=20 <focused-test-node>"
        parallel_isolation: "PYTHONASYNCIODEBUG=1 uv run --frozen --with-requirements tools/acceptance/requirements-stress.txt pytest -q -n 2 --dist loadscope <two-or-more-hermetic-focused-test-nodes>"
      capture: [trusted base and candidate revisions, exact test nodes, plugin versions, worker and repeat counts, seed, first failing iteration, exit status]

  - id: ev.accept_semgrep_lane
    kind: evidence
    label: "Use the local tested Semgrep rules for high-signal SafeYolo security invariants"
    detail: |
      Run only the trusted local rules: no registry auto-config, login, remote
      rules, or autofix. The initial rules challenge disabled TLS verification,
      shell-based subprocess execution, race-prone temporary names, and unsafe
      YAML loading. A finding is a precise review lead, not an automatic veto;
      inspect intent and compare candidate results with the trusted base.
    source: tools/acceptance/semgrep-rules.yml
    tool:
      obtain_from: "Semgrep declared and hash-locked in the isolated tools/acceptance uv project; rules and rule tests come from the exact trusted-base Git object"
      sources:
