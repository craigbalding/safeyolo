  - id: ev.accept_factory_recovery_lab
    kind: evidence
    label: "Use a controlled nested lab to prove real supervisor and checkout recovery"
    detail: |
      The lab controller provides labeled panes, identity-checked fault
      injection, evidence capture, and teardown. Use those facilities to write
      and run the recovery scenario the issue needs. For example, record an
      assigned task, branch, index, and dirty files; interrupt the supervised
      process; restart it; then observe whether it resumes the same work and
      preserves those files. Retain the procedure and actual before/after
      results. A missing prebuilt scenario is work to create, not a reason to
      substitute unit tests for the real recovery observation.
    source: cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/scripts/safeyolo-lab
    tool:
      obtain_from: "the safeyolo-lab-controller skill staged from the exact operator-approved trusted-base SafeYolo Git object"
      sources:
