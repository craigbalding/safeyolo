  - id: ev.accept_coord_lane
    kind: evidence
    label: "Use focused native Coord tests with an owned real NATS instance"
    detail: |
      The native CLI tests use isolated roots and owned NATS endpoints. They
      challenge listener selection, permissions, retained room state and
      process ownership. Reuse the affected fixture or native operation for
      publish, receive, retention or restart behavior. Startup alone does not
      establish durability. For support-authority reports, select
      federation::support::authority with --ignored and pinned NATS 2.14.5.
      It uses four independent roots, identities, TLS roots and brokers on one
      host. It checks typed upstream/downstream reach, destination-owned facts,
      alternate paths, identity and trust changes, pagination, disclosure and
      interrupted reads. It does not prove arbitrary guest-program influence
      or unknown-owner independence. Historical Python upgrade fixtures are test
      references. For the supported previous generated NATS account upgrade,
      set SAFEYOLO_COORD_BASE_BINARY to the CLI built from
      e138ebefba90919311e9e60cc272b140e78b5d61 and select
      upgrade::previous_generated_store_upgrades_with_and_without_federation
      with --ignored. Use a disk-backed TMPDIR. It checks actual previous CLI
      state, messages/work/attention and consumer cursors, both federation modes,
      failed activation and recovery. It does not prove peer fault isolation or
      resource fairness for the other follow-up outcomes.
      For the Stage 0 current-master boundary, set SAFEYOLO_COORD_BASE_BINARY
      to the retained current-master CLI and select the native_stage0 test
      with --ignored. It uses three authenticated clients and real process
      crashes; it does not substitute for model-driven three-agent dogfood.
      For the native inventory boundary, select
      inventory::native_inventory_uses_current_grants_and_fixture_provider_evidence_across_restart
      with --ignored and the pinned NATS binary. It exercises actual service
      grant/revoke, authenticated room state, identity replacement and restart.
      Its controlled provider snapshots prove the trusted observation boundary,
      not a deployed external lease. Unsupported deployed observations remain
      unknown. The actual three-agent comparison is a separate required observation.
      For new operator-approved collaboration, run the delegated_approvals
      integration target with filter collaboration, --ignored, a disk-backed
      TMPDIR, SAFEYOLO_NATS_TEST_INSTANCE=1 and the pinned NATS binary. It uses
      the actual product room creator, canonical approval receipts, authenticated
      Agent API, inspected messages and current/offline/restarted delivery. It
      covers denied/expired requests, current identity removal, scoped delegation,
      interrupted preparation/commit, pending-read revocation and UTF-8/encoded
      size bounds. These controlled runs do not establish guest isolation or a
      model wake.
      For private approval results, run the delegated_approvals integration
      target with filter private_, --ignored and the pinned NATS binary. It
      uses authenticated Agent API calls, credential expiry, disconnected
      requesters, broker/proxy/run restart, irreversible withholding, publication
      gaps and bounded broker pressure. Controlled run records do not prove guest
      isolation or an automatic model wake.
      For durable work ownership, select
      work::native_work_claims_replay_identity_revocation_and_crash_recovery
      with --ignored. Set SAFEYOLO_WORK_RETAIN_SECONDS=1800 for the actual
      30-minute ownership boundary. The test overlaps the wait with its other
      checks and reports the observed elapsed time. A shorter run cannot prove
      that duration. The three-model work exercise remains separate.
      For material signals and operator attention, select
      signals::native_signals_author_page_watch_replay_and_restart with
      --ignored. It uses the authenticated Agent API, owned real NATS,
      native watch and the Admin API. It checks permission revocation,
      author-only correction, failed-write rollback, lost-response recovery,
      metadata-only audit and exact immutable revision rendering. The actual
      three-model symptom/inference/correction exercise remains separate.
      For current operator work, select
      signals::native_watch_recovers_final_signal_and_approval_changes_without_a_later_event
      with --ignored. It uses the real authenticated Admin stream and native
      watch for pre-existing signals and approvals, the subscription/snapshot
      boundary, missed final create/clear notifications with no later event,
      fast signal/approval creation and resolution between host reads with
      the final resolution frames dropped, idle viewer requests, unavailable
      state and reconnect. Its operator
      recovery runs with NATS stopped and the audit destination impaired.
      Current-state controls do not establish audit recording or historical replay.
      For live terminal recovery, also select
      signals::native_watch_pty_recovers_complete_pending_state_while_a_choice_is_unfinished
      with --ignored. Its real pseudo-terminal retains unfinished input across
      reconnect, catches an offline arrival and recovers all current requests
      after a failed pending read without another mutation.
      For selected decisions and deferral, use the native_operator_cli target
      with the native_watch_keeps_selected_input filter. It checks several
      requests, an arrival during input, stable numbers, concurrent resolution,
      canonical pending state and a later explicitly permitted network attempt.
      Also select the two signals::native_watch_clears_ tests with --ignored
      for requests seen only in attachment snapshots during an audit outage.
      Both consume the initial control before resolving the request entirely
      between shared host checks. Signals and approvals must clear within five
      seconds without a later business event or idle viewer polling.
      For combined room status, select
      room_status::native_room_status_current_authority_restart_and_cli with
      --ignored. It compares authenticated Agent API and operator CLI state,
      challenges false chat claims, current ownership, completions, corrections,
      grant revocation and restart. Actual 30-minute operator absence and three
      actual model participants remain separate required observations.
      For exact work candidates and attestations, select
      attestations::native_attestations_exact_candidate_authorship_replay_and_recovery
      with --ignored. It checks authenticated authorship, retained stale evidence,
      independent conflicting dispositions, candidate changes, current status,
      revocation races, pre-commit process interruption and lost responses while
      NATS publication is unavailable. The three-model exact-target exercise
      remains a separate required observation.
      For current-holder output publication, select
      outputs::retained_external_outputs_recover_once_or_reject_stale_publication
      with --ignored. It retains code/report artifacts before interrupting the
      real Agent API, discards a committed response with NATS unavailable, then
      recovers one publication or rejects stale publication after reassignment
      or cancellation. It checks authenticated producer attribution, retained
      output history and stale evidence after correction. Set TMPDIR to an owned
      disk-backed scratch directory outside the checkout. This deterministic
      boundary test does not prove a real supervised-agent journey.
      For assigned exact-subject checks and peer challenges, select
      reviews::code_and_report_checks_challenges_corrections_and_independent_dispositions
      with --ignored. It runs rejection, challenge, retained correction,
      response and independent disposition for code/report artifacts through
      authenticated native clients and real NATS/proxy processes. It includes
      interrupted check answer recovery, old-receipt replay, revision reads,
      named reviewer/decider authority and operator verdict correction. Use an
      owned disk-backed TMPDIR outside the checkout. This controlled journey
      does not prove a real supervised-agent wakeup or model response.
      For approved Factory policy and actual interactive participation, select
      factory::factory_selection_enforces_native_obligations_for_direct_callers
      and factory::interactive_coding_client_and_factory_supervisor_share_native_work
      with --ignored. Set SAFEYOLO_COORD_INTERACTIVE_HOME and
      SAFEYOLO_COORD_MODEL_HOME to distinct private authorized native Codex homes,
      and SAFEYOLO_CODEX_BIN to the native executable. The actual interactive
      producer and Factory-supervised reviewer share one native loop, including
      rejection, challenge, correction, explicit disposition and acceptance.
      The controller supplies operator prompts and explicit policy selection,
      not producer mutations or reviewer conclusions. See docs/coord-operations.md
      for prerequisites and the owned Linux process boundary.
      For read-only GitHub references, select
      github::native_github_read_uses_caller_service_and_preserves_local_work
      with --ignored. Its controlled external TLS fixture uses real service
      grants, vaulted credential injection, authenticated work and real NATS.
      It checks local ownership, reference replay, external failures, bounded
      reads and in-flight service/room revocation. These responses are fixtures;
      actual GitHub transport and three-model use remain separate observations.
      For collaboration through one home SafeYolo, select
      federation::two_safeyolos_share_only_home_authority_across_partition_restart_and_revocation
      with --ignored. It starts two independent native instance roots, proxies
      and NATS processes, and authenticated TLS NATS request/reply. A TCP fault injector cuts
      a mutation's route. The test checks one concurrent claimant, qualified
      identity, local-only history, targeted remote attention, home brief
      versions, unavailable GitHub access on both callers, discarded-response
      replay, restart, reconnection and peer/member revocation. It also checks
      display-name reuse after the last grant or peer revocation, current-name
      uniqueness, unchanged authorship and original-operation replay. It proves this
      two-instance boundary on one owned host; WAN behavior, external GitHub
      access and three actual model participants remain separate observations.
      For explicit loopback protection, select
      federation::loopback_preserves_authority_retained_notifications_and_recovery
      with the same inputs. For dedicated broker certificate validation,
      renewal and explicit CA rotation, select federation::modes with --ignored.
      These controls retain credentials, membership, peer generations and
      room state. They check invalid keys, names and trust, pending activation
      and recovery after owned restart. Neither control proves separate-host
      Tailscale delivery; use installed owners on their verified tailnet nodes
      for that boundary.
      For delivery isolation and resource recovery, select federation::reliability
      with --ignored and --test-threads=1. Three independently initialized roots
      and brokers exercise a sealed peer stream, disconnected recipient, cached
      connections, bounded long/short waits, cancellation, per-source health,
      slow observer lock and current disclosure rights. A child publisher exits
      after actual JetStream acknowledgement; owner-side projection repair wakes
      the remote waiter. Set a disk-backed TMPDIR and preserve the normal native
      source/profile binding. These are three instances on one host, not three VMs.
      For qualified factory direction and remote deciding authority, select
      federation::operator with --ignored. It uses two independent native roots,
      actual NATS, the acknowledged support/delegation previews, B-owned work
      and approvals, source restart and scoped factory/approval denials.
      Its controlled ingress records do not prove the installed operator journey.
      For guided configuration, select federation::guided with --ignored and
      --test-threads=1. Piped human answers exercise addressed connection handoffs,
      owner activation, generated/imported/renewed TLS, separately scoped authority,
      interruption and stale previews. The native_operator_cli target's
      guided_credential_scope filter selects a real pending request without
      copying fingerprints or deciding it. These CLI controls do not establish
      installed Command Centre operation or real model supervision.
      For delegated remote support, select federation::support with --ignored.
      It exercises scoped broker publish/subscribe denials, room-independent
      grants, current qualified identities, owner receipts, discarded replies,
      expiry/narrowing/revocation, source and owner restart, target run replacement,
      and independent multi-source positions across disconnect and reconnect.
      A mutating request deliberately sent to another trusted owner is refused
      before effects. Independent JetStream and Core outages check continued
      Core support, honest unreachability and existing local owner recovery.
      These native tests use controlled ingress runs on one host. They do not
      establish an installed guest repair or the required real support-model
      journey across two actual hosts. Reuse source-equivalent local backend
      controls; retain the new remote consumer observation separately.
      For canonical support audit recovery, select federation::support::audit
      with --ignored and --test-threads=1. Direct authenticated NATS peers
      exercise destination decisions, a full one-entry audit queue and owner
      termination between saved results and canonical delivery. Recovery keeps
      stable event identities without repeating effects or completing an
      unverified operation. Local grant write/termination and post-lock refusal
      controls use the peer_support target with the audit_delivery filter.
      Its guest_command_rechecks_the_target_after_waiting_for_control control
      also checks final-audit write failure and identical-ID reuse after a
      completed controlled command. Use the existing mapped namespace fixture;
      these controls do not repeat installed backend qualification.
      For optional operator catch-up, select
      catch_up::native_catch_up_keeps_current_authority_and_inspectable_bounded_history
      with --ignored. It exercises the read-only CLI against authenticated agent
      mutations and real NATS: narrative contradiction, regeneration, simultaneous
      readers, bounded long history and continuation, inspectable exact messages,
      malformed/unavailable evidence, restart and revoked access. The test retains
      its private fixture and original prompt/results. Actual model generation
      and three model participants remain a separate observation.
