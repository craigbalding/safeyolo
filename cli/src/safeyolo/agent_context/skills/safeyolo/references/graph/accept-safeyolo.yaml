# Acceptance graph: "which trusted tool proves this SafeYolo claim?"
#
# This is an acceptance and environment-maintenance graph in the same style as
# the SafeYolo troubleshooting graphs. Choose tools that can exercise the claim,
# prepare the environment, then create and run the test the issue needs.
# Listed commands provide setup, existing checks, and invocation examples;
# they are not a complete acceptance suite for every issue. Lens can write
# new tests and scripts using these approved tools without separate approval
# for each test. Retain the test source, exact candidate, command, environment,
# actual output, and exit status; classify only what the result establishes.
#
# The ordinary graph schema is documented in `triage-request-failing.yaml`.
# Executable evidence nodes may additionally carry a `tool` annotation:
#
#   tool:
#     obtain_from: trusted acquisition location
#     sources: [{path: repository-relative path, sha256: content identity}]
#     setup: bounded preparation (optional)
#     verify: deterministic identity check
#     run: exact invocation or a small claim-to-invocation mapping
#     capture: [evidence the result must retain]
#
# Trust protocol:
#   - Read this graph from the operator-bound trusted base, never from the
#     candidate as self-authorization.
#   - Obtain every listed source from the exact trusted-base Git object named
#     by the room brief and verify its SHA-256 before use.
#   - That Git object is the trust anchor for transitive tracked inputs. The
#     listed hashes are quick identity checks for declared entrypoints, not a
#     substitute for the commit identity.
#   - Resolve dependencies only from locations named by the trusted lock or
#     install source, or from an operator-approved configured package source.
#   - A candidate change to a harness is review subject matter. It does not
#     update the trusted hash or authorize its own use.
#   - A tool entry in this operator-bound graph is standing approval for its
#     declared purpose, source/identity, and install path. It is not a product
#     runtime dependency and does not authorize a candidate-authored tool.
#   - If a source hash, acquisition path, invocation, or result shape does not
#     fit, follow the graph-gap or tool-identity path; do not improvise a pass.
#   - This is not an instruction to run every lane. Choose the smallest graph
#     path that establishes the material claim.

see_also:
  - graph: triage-guest-tools-and-sudo
    when: "an approved acceptance dependency cannot be installed in the guest"
  - graph: triage-request-failing
    when: "an acceptance tool's network request is blocked or fails unexpectedly"
  - graph: triage-kernel-observability
    when: "the desired evidence needs a kernel facility unavailable in the sandbox"

