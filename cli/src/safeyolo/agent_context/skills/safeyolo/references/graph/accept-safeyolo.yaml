  # ---- Selection and trusted evidence --------------------------------
  - id: ev.accept_select_boundary
    kind: evidence
    label: "Choose one material affected, stale, failed, or currently unproven boundary"
    detail: |
      For candidate review, start with the claimed behavior and changed system
      boundary. For background work, prefer a recent failure, a missing real
      boundary, or a trusted tool that no longer runs. Identify an action and
      an observable result that would establish the claim. Reuse a suitable
      existing check; otherwise write and execute a focused test using the
      selected tools. Do not run broad suites merely to fill time.
    source: authored

  - id: ev.accept_python_lane
    kind: evidence
    label: "Use focused pytest, pytest-cov, and Hypothesis for Python behavior"
    detail: |
      Use pytest to drive the affected Python API or command and assert its
      results. Reuse the smallest existing test that covers the claim, or
      write and run a focused test when none does. Add coverage only when the
      claim concerns unexercised paths.
      Use Hypothesis for input spaces and state transitions, not as decoration
      around a few examples. Test-assurance checks verify the repository's
      explicitly pinned high-value acceptance functions.
    source: pyproject.toml
    tool:
      obtain_from: "pytest, pytest-cov, and Hypothesis distributions named and hash-locked in uv.lock, fetched through the approved SafeYolo proxy"
      sources:
        - path: pyproject.toml
          sha256: 1e11bf66e0cf0aa1798847289cc72a247936951b5816265ca777b683fb64e9e6
        - path: uv.lock
          sha256: fd244df9e559bed2b211bbe93f257831fce8e1087b19cfc7d9d3da2fd1bc3050
        - path: scripts/check_test_assurance.py
          sha256: 3dc6bc589625ea3058b7ca20711d97f3007ca41b0ebd1653a671a4642dc91974
      setup: "uv sync --frozen --group dev"
      verify: "sha256sum pyproject.toml uv.lock scripts/check_test_assurance.py && uv run pytest --version"
      run:
        focused: "uv run pytest -q <focused-test-node>"
        focused_with_coverage: "uv run pytest -q <focused-test-node> --cov=<affected-package> --cov-report=term-missing"
        acceptance_identity: "uv run python scripts/check_test_assurance.py"
      capture: [trusted base, exact test nodes, pytest and plugin versions, seed when applicable, exit status, failing assertion]

  - id: ev.accept_proxy_lane
    kind: evidence
    label: "Use the installed Rust proxy, per-agent UDS, sinkhole, curl/TLS, and host pytest through the proxy blackbox lane"
    detail: |
      The proxy lane installs the product, starts the selected native proxy
      and per-agent Unix listeners, and drives HTTP, CONNECT/TLS, credentials,
      policy, rate limits, attribution, and upstream capture against the real
      sinkhole. It is the primary proxy-system tool, not a substitute for
      sandbox isolation.
      Use the prepared proxy and sinkhole to send request sequences for the
      issue. Write a focused test that checks both the client response and
      what reached the upstream sinkhole. For example, change a policy between
      requests and check that the running proxy applies it. Reuse the current
      harness setup; do not require the whole lane for each new assertion.
    source: tests/blackbox/run-lane.sh
    tool:
      obtain_from: "the trusted-base installer and harness; Python dependencies are hash-locked in uv.lock and Rust dependencies in proxy/Cargo.lock"
      sources:
        - path: install.sh
          sha256: dfb8215a4898a01dc79acba65d0cf99bf0da57201ff86e470cf88153843e9d2e
        - path: tests/blackbox/run-lane.sh
          sha256: 7e5e42f5c7fc0123d674fc6b8f7d19411ede516ed0170309e0eef34d25df5d33
        - path: tests/blackbox/run-tests.sh
          sha256: ce39f4eb427f5553c95913e8ce95c328ae4f75732a20a4eab662a2f7b8027ab7
        - path: uv.lock
          sha256: fd244df9e559bed2b211bbe93f257831fce8e1087b19cfc7d9d3da2fd1bc3050
      setup: "Use an approved host with native bundle/build inputs and a fresh SAFEYOLO_CONFIG_DIR; the lane owns its separate test instance, ports, certificates and sinkhole."
      verify: "sha256sum install.sh tests/blackbox/run-lane.sh tests/blackbox/run-tests.sh uv.lock"
      run:
        install_and_proxy: "./tests/blackbox/run-lane.sh proxy --verbose"
        prepared_install: "./tests/blackbox/run-tests.sh --proxy --verbose"
      capture: [trusted base, native proxy identity, proxy and UDS readiness, sinkhole observation, TLS result, exit status]

  - id: ev.accept_runsc_lane
    kind: evidence
    label: "Use real runsc/gVisor with systrap or KVM through the full isolation blackbox lane"
    detail: |
      This boots a real native SafeYolo agent under runsc and asserts the
      selected platform with ordinary-user and guest-root lifecycle/isolation
      probes. Systrap is the deterministic no-KVM path. KVM must prove actual
      device selection and must never silently fall back.
      Reuse a prepared disposable instance for a focused workload, restart,
      persistence or host-resource check. Observe actual enforcement; a saved
      setting alone does not prove the effect. The maintained shell builder
      supplies guest inputs; the retired Python bootstrap is not invoked.
      The optional Claude section reuses an exact selected dedicated installation
      with an operator-provisioned host subscription. It joins native setup,
      staged skill readability, completed tools, a checked workspace effect and
      current gateway run attribution. It does not approve requests or retry a
      model task. Trusted caller deployment and its selected inputs/report return
      require separate verification on the operator-owned host.
    source: tests/blackbox/run-lane.sh
