# SafeYolo baseline policy
#
# TOML format: everything about one host in one place.
# Each entry can have: allow, rate, bypass, rules.
# Use $list_name to reference a named list from [lists].
#
# Approved credentials are auto-added here by `safeyolo watch`.
# Addon tuning (entropy, circuit breaker, etc.) lives in addons.yaml.

version = "2.0"
description = "SafeYolo baseline policy"

budget = 12_000  # total req/min across all domains

# =============================================================================
# REQUIRED ADDONS (cannot be disabled)
# =============================================================================

required = [
    "credential_guard",
    "network_guard",
    "circuit_breaker",
]

scan_patterns = []

# =============================================================================
# NAMED LISTS — files of hosts/domains, referenced with $name in [hosts]
# =============================================================================

[lists]
package_registries = "lists/package-registries.txt"
known_bad = "lists/stevenblack-hosts.txt"

# =============================================================================
# HOSTS — credentials + rate limits + overrides, all in one place
# =============================================================================

[hosts]
# ── LLM APIs ──────────────────────────────────────────────────
"api.openai.com"      = { allow = ["openai:*"],    rate = 3_000 }
"api.anthropic.com"   = { allow = ["anthropic:*"],  rate = 3_000 }
"openrouter.ai"       = { allow = ["openrouter:*"], rate = 3_000 }
"api.x.ai"            = { allow = ["xai:*"],        rate = 3_000 }
"api.groq.com"        = { allow = ["groq:*"],       rate = 3_000 }

# ── Code hosting ──────────────────────────────────────────────
"api.github.com"      = { allow = ["github:*"],     rate = 300 }
"github.com"          = { allow = ["github:*"] }

# ── Google ────────────────────────────────────────────────────
"*.googleapis.com"    = { allow = ["google:*"], rate = 120 }

# ── Model/package hubs ────────────────────────────────────────
"huggingface.co"      = { allow = ["huggingface:*"], rate = 600 }
"*.huggingface.co"    = { allow = ["huggingface:*"], rate = 600 }

# ── Package registries (expanded from $package_registries list) ──
"$package_registries" = { rate = 1_200 }

# ── Known bad hosts (StevenBlack/hosts — malware + adware) ───
"$known_bad"          = { egress = "deny" }

# ── Domain overrides ──────────────────────────────────────────
"*.internal"          = { bypass = ["pattern_scanner"] }

# ── Service gateway (add after running `safeyolo agent authorize`) ──
# "mail.google.com" = { service = "gmail" }
# "api.slack.com"   = { service = "slack" }

# ── Defaults (wildcard) ───────────────────────────────────────
"*"                   = { egress = "allow", unknown_creds = "prompt",  rate = 600 }

# Built-in credential classifiers come from
# detection/credential_catalog.py. Add [credential.<name>] tables only for
# local or deployment-specific formats; those rules append to the catalogue.
