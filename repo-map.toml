version = 1
project = "safeyolo"

# Within each hint, paths are ordered from the primary inspection location.

[[hints]]
id = "python-check-entrypoints"
triggers = ["python", "pytest", "ruff", "test", "tests"]
advice = "Run focused Python checks from the repository root with uv run pytest <relevant-test-paths> and uv run ruff check <changed-python-paths>. These use the project environment; bare pytest or ruff may select a different interpreter or miss installed tools. CI and pre-commit configure Ruff lint, not a whole-file Ruff format gate. Fix reported lint without unrelated reformatting."
paths = []
source = "pyproject.toml; .github/workflows/ci.yml; .pre-commit-config.yaml; docs/DEVELOPERS.md"

[[hints]]
id = "python-defect-prevention"
triggers = ["codeql", "code scanning", "exception", "except", "cancellation", "unused", "cyclic import", "import cycle", "toml"]
advice = "Apply docs/DEVELOPERS.md#python-defect-prevention: reuse established helpers; catch expected failures with explicit recovery; explain harmless suppression; preserve cancellation; remove dead code without losing required effects. Check scanner findings against actual behaviour: Protocol ellipses and intentional re-exports are not automatically defects. Ruff and CodeQL have different coverage."
paths = []
source = "AGENTS.md; docs/DEVELOPERS.md#python-defect-prevention; ruff.toml"

[[hints]]
id = "installed-agent-context"
triggers = [
  "agent context",
  "skill staging",
  "installed skill",
  "sandbox baseline",
  "host setup",
]
advice = "Edit the authoritative files under cli/src/safeyolo/agent_context, then verify every staging/install path and its tests; do not patch an installed ~/.codex or ~/.agents copy as the product change."
paths = [
  "cli/src/safeyolo/agent_context/",
  "contrib/lib/stage-safeyolo-context.sh",
]
source = "cli/src/safeyolo/agent_context/skills/safeyolo/references/contributing-to-safeyolo.md"

[[hints]]
id = "factory-contract-plumbing"
triggers = [
  "factory",
  "supervisor",
  "role contract",
  "contract schema",
  "factory doctor",
  "coord attention",
  "checkpoint",
]
advice = "Treat the factory TOML, role contracts, staged contract identity, supervisor checkpoint behaviour, and doctor verification as one change boundary. Prefer recovery from Coord/checkpoint state over another queue or task store."
paths = [
  "proxy/src/factory.rs",
  "proxy/src/coord_supervisor.rs",
  "proxy/src/coord_setup.rs",
  "proxy/src/coord_tools.rs",
  "contrib/lib/stage-safeyolo-context.sh",
  "docs/factories.md",
  "docs/codex-coord-supervisor.md",
]
source = "docs/factories.md; docs/codex-coord-supervisor.md"

[[hints]]
id = "coord-kernel-boundary"
triggers = [
  "coord",
  "room message",
  "attention",
  "durable work",
  "work object",
  "handoff",
  "cursor",
]
advice = "Keep Coord transport identity and durable kernel objects authoritative. Attention is interruption, not visibility; do not infer assignment from retained room history or create a parallel work-state abstraction."
paths = [
  "proxy/src/coord_rooms.rs",
  "proxy/src/coord_rooms/",
  "proxy/src/bin/safeyolo-coord.rs",
  "docs/coord-kernel-capabilities.md",
  "docs/coord-trust-boundary.md",
]
source = "docs/coord-kernel-capabilities.md; docs/coord-trust-boundary.md"

[[hints]]
id = "installer-support-boundary"
triggers = [
  "install.sh",
  "installer",
  "reinstall",
  "requires-python",
  "python interpreter",
  "uv tool",
  "pipx",
]
advice = "Derive installer/runtime compatibility from pyproject.toml and exercise install.sh's real uv and recovery paths. Preserve proxy/CA variables and secure dependency overrides; test constructed commands hermetically before broad installation trials."
paths = [
  "install.sh",
  "pyproject.toml",
]
source = "README.md#install-from-source-advanced; pyproject.toml"

[[hints]]
id = "pattern-scanner-flow"
triggers = [
  "pattern scanner",
  "url scan",
  "percent decoded",
  "credential pattern",
]
advice = "Start with proxy/src/inspection.rs for pattern matching and proxy/src/http.rs (enforce_request_inspection, scan_response_with_lifetime) for request and response enforcement. Credential detection is in proxy/src/credential_guard.rs; retained evidence is in proxy/src/flow_store.rs. Sanitize findings before operational publication."
paths = [
  "proxy/src/inspection.rs",
  "proxy/src/http.rs",
  "proxy/src/credential_guard.rs",
  "proxy/src/flow_store.rs",
  "proxy/tests/inspection.rs",
]
source = "docs/ARCHITECTURE.md#request-path; docs/security-verification.md"

[[hints]]
id = "proxy-request-flow"
triggers = [
  "proxy startup",
  "request pipeline",
  "request hook",
  "websocket",
  "connect tunnel",
]
advice = "Trace the request through proxy startup (main.rs, lib.rs), the request driver http::forward and its decide stage, the network guard, and FlowStore/audit publication. Sanitize before operational publication and keep policy decisions separate from detector findings."
paths = [
  "proxy/src/main.rs",
  "proxy/src/http.rs",
  "proxy/src/network_guard.rs",
  "proxy/src/policy.rs",
  "proxy/src/flow_store.rs",
  "proxy/src/audit.rs",
  "docs/ARCHITECTURE.md",
]
source = "docs/ARCHITECTURE.md#request-path; docs/DEVELOPERS.md; docs/security-verification.md"

[[hints]]
id = "agent-lifecycle-platforms"
triggers = [
  "agent lifecycle",
  "agent run",
  "agent shell",
  "microvm",
  "gvisor",
  "runsc",
  "darwin platform",
  "macos vm",
  "linux sandbox",
]
advice = "Reuse the shared host lifecycle path, then verify the affected Linux/gVisor and macOS/VZ paths. Distinguish listener attribution, durable agent identity, sandbox generation and observed backend health. Persistent home/workspace and disposable runtime/rootfs state are different boundaries."
paths = [
  "proxy/src/host_lifecycle.rs",
  "proxy/src/host_platform.rs",
  "proxy/src/host_runs.rs",
  "docs/networking-vsock-uds.md",
  "docs/microvm-architecture.md",
]
source = "docs/networking-vsock-uds.md; docs/microvm-architecture.md"

[[hints]]
id = "lab-lifecycle"
triggers = [
  "safeyolo lab",
  "lab lifecycle",
  "tmux lab",
  "fault injection",
  "evidence capture",
  "teardown",
]
advice = "Keep Lab a thin lifecycle over existing agent and tmux mechanisms: objective first, one authorized reversible fault, bounded evidence, restoration, and same-path proof. Use ownership checks before reattach or teardown."
paths = [
  "proxy/src/lab.rs",
  "cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/",
  "proxy/tests/native_lab.rs",
  "tests/test_native_lab_helpers.py",
]
source = "cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/SKILL.md"

[[hints]]
id = "acceptance-tool-selection"
triggers = [
  "acceptance graph",
  "nested safeyolo",
  "security assessment",
  "race condition",
  "complexity analysis",
  "code smell",
]
advice = "Select the smallest acceptance-graph lane that exercises the real boundary. Use the graph's trusted entrypoint and retain evidence; deterministic analysis complements rather than substitutes for behavioural acceptance."
paths = [
  "cli/src/safeyolo/agent_context/skills/safeyolo/references/graph/accept-safeyolo.yaml",
  "docs/security-testing-design.md",
  "docs/nested-linux-lab.md",
]
source = "cli/src/safeyolo/agent_context/skills/safeyolo/references/graph/accept-safeyolo.yaml"
