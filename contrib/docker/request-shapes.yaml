# defaults and integer bounds are retained. Docker-specific conditions run in enforcement.rs.
# Empty Go string defaults are accepted for logging, propagation, cgroup namespaces
# and isolation. The implemented local log driver extends the specification enum.
# MemorySwappiness also accepts the CLI's -1 sentinel, which Engine normalizes to
# unset before validation. Memory bytes remain nonnegative; -1 is not their sentinel.
