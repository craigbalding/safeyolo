docker_enforcement: {profile: capabilities.<name>.docker_access, supported_api: Standalone Linux Engine
    API 1.45; unversioned ping/version discovery only., enforced_conditions: ['Creation and update use
      the expanded request shapes, exact field spelling, nested types, ranges and Docker defaults. Unknown
      constrained fields or variants are refused.', 'Workload mode refuses privilege, host namespaces,
      devices, added capabilities, weakened security options, overridden runtime/cgroup selection and
      unknown drivers.', Both Binds and Mounts enforce exact operator-approved bind sources and write
      modes. Shared mount propagation and daemon socket/system mount sources are unsupported., 'Every
      referenced existing container, exec, volume, network and creation image is inspected before the
      admitted operation. Existing volume driver options and actual effective mounts are checked.', 'Classic
      build tar contexts use ordinary container execution. Host network mode, remote contexts, BuildKit
      sessions and entitlements are unsupported.', 'Sandbox administration is available only with the
      adopted sandbox execution boundary and an explicit sandbox_admin capability. It delegates provider
      files, credentials, explicit host mounts and other inner workloads.'], source_evidence: [engine_145,
    linux_defaults, docker_access, request_shapes, client_resource_defaults, resource_sentinels,
    resource_bounds, endpoint_priority, endpoint_create, endpoint_connect,
    compose_endpoints], known_gaps: [Docker cannot atomically inspect resources
      and apply a mutation. Trusted administrators can change network or volume references during that
      interval. Primary container names resolve to immutable IDs., 'Supported default logging drivers
      are json-file, local and none. External log drivers/options are unsupported because they can select
      host files or external delivery.', Bindings to arbitrary host consumers require operator onboarding.
      No external execution egress guarantee or project isolation is provided here.]}
