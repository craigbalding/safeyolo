[project]
name = "safeyolo-acceptance-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
]

[dependency-groups]
static = [
    "mypy>=1.15",
    "pip-audit>=2.7",
    "pyyaml>=6.0",
    "radon>=6",
    "semgrep>=1.100",
]
stress = [
    "pytest-repeat>=0.9",
    "pytest-xdist>=3.6",
]

[tool.uv]
package = false
# Semgrep 1.179.0 pins MCP 1.29.0; 1.30.0 fixes GHSA-84m7-p3x7-pcfv.
# GHSA-mf5v-w3w3-f6cg requires OpenTelemetry API 1.45.2. Semgrep's five
# OpenTelemetry constraints select the older family. Override them together:
# the SDK, exporter and instrumentation require matching family versions.
# The dependency controls exercise Semgrep tracing and the propagation parser.
# Semgrep's wcmatch ~=8.3 constraint excludes the ReDoS repair in 11.2.
# This repository-owned override is covered by actual scanner/path controls;
# wcmatch selects its required bracex version through the resolver.
override-dependencies = [
    "wcmatch==11.2",
    "mcp==1.30.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-threading==0.66b2",
]

[tool.mypy]
# The existing repository is not yet clean under mypy. Lens uses this profile
# on affected production modules and compares findings with the trusted base;
# it is evidence for review, not a repository-wide pass/fail gate.
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
