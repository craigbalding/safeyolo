schema = "safeyolo.factory/v1"
name = "backlog"
room = "backlog"

[operator_input]
to = "coordinator"
types = ["ACTIVATE", "PAUSE", "RESUME", "PRIORITY", "NEXT", "DIRECTION"]

[roles.coordinator]
agent = "relay"
contract = "backlog-coordinator.md"

[roles.owner]
agent = "forge"
contract = "../agent-roles/issue-owner.md"
args = ["--model", "gpt-5.6-luna", "-c", "model_reasoning_effort=xhigh"]

[roles.owner.repair]
request = "REPAIR"
from = "coordinator"
args = ["--model", "gpt-5.6-sol", "-c", "model_reasoning_effort=medium"]
after_rounds = 5
max_rounds = 3
release_on = "REVIEW_READY"

[roles.reviewer]
agent = "lens"
contract = "../agent-roles/independent-reviewer.md"

[[updates]]
type = "CONTEXT"
from = "coordinator"
to = "owner"
fields = ["target"]

[[updates]]
type = "CONTEXT"
from = "coordinator"
to = "reviewer"
fields = ["target"]

[[handoffs]]
request = "TASK"
from = "coordinator"
to = "owner"
responses = ["DONE", "BLOCKED", "FAILED"]
response_to = ["coordinator"]

[[handoffs]]
request = "TASK"
from = "coordinator"
to = "reviewer"
responses = ["DONE", "BLOCKED", "FAILED"]
response_to = ["coordinator"]

[[handoffs]]
request = "REVIEW_READY"
from = "owner"
to = "reviewer"
responses = ["READY", "CHANGES_REQUIRED", "BLOCKED"]
response_to = ["owner", "coordinator"]
