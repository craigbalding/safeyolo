feature_use = "Defaults disabled; ring+std+tls12 preserve the selected provider and supported TLS versions."
exposure = "TLS/X.509 verification; Rustls forbids unsafe code. Its build script and shared ring C/assembly/webpki remain separate update boundaries."
decision = "Retain. No protocol/cryptographic replacement or TLS-version restriction."


[[libraries]]
