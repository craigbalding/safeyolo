default_features = true
handoff = "API routes and operator URL components."
apis = "percent_decode_str::{decode_utf8,decode_utf8_lossy}, utf8_percent_encode, NON_ALPHANUMERIC/AsciiSet in API routes and operator URL components."
feature_use = "Default std/alloc; callers deliberately choose strict or lossy UTF-8 and form-plus handling separately."
exposure = "Unsafe optimized scanning; shared through URL/reqwest. No build script."
decision = "Retain. Knockout saves zero packages. An estimated 30-60 lines plus malformed-percent/UTF-8 tests would only duplicate shared behavior."

[[libraries]]
name = "pulldown-cmark"
version = "0.13.5"
features = []
default_features = false
handoff = "mattermost/render.rs."
apis = "Parser, Event, Tag/TagEnd and CodeBlockKind in mattermost/render.rs."
feature_use = "Defaults already disabled; event parsing supports safe Markdown projection without HTML rendering helpers."
exposure = "Unsafe Markdown parsing/arena internals, generated tables and build script; unicase shared."
decision = "Retain. One exclusive package; adversarial Markdown/link/code semantics are not a bounded local parser."

[[libraries]]
name = "rcgen"
version = "0.14.10"
features = ["ring", "pem", "x509-parser"]
handoff = "Destination leaf key generation and certificate signing under the imported CA."
default_features = false
apis = "CertificateParams, Issuer, KeyPair, DnType, ExtendedKeyUsagePurpose and KeyUsagePurpose in tls.rs."
feature_use = "Defaults disabled; ring signing, pem serialization and x509-parser import are actual calls."
exposure = "Certificate/signature machinery, exclusive yasna/pem and bit-vec version; ring/native crypto shared."
decision = "Retain. Certificate construction/CA validation complexity is disproportionate to its call count."


[[libraries]]
name = "rand"
version = "0.10.2"
features = []
default_features = true
handoff = "circuit_runtime.rs, http.rs and mattermost/recovery.rs."
apis = "random::<f64> for circuit sampling and Mattermost retry jitter in circuit_runtime.rs, http.rs and mattermost/recovery.rs."
feature_use = "Default thread_rng/std_rng supplies the infallible sampling interface; tungstenite retains the same rand/defaults."
exposure = "Unsafe RNG/OS interface internals; rand 0.8 remains via NUID, 0.10 via WebSocket. Not used for SafeYolo secret generation."
decision = "Retain. Replacing sampling with ring or a local generator removes no crate/features and introduces conversion/distribution code."

[[libraries]]
name = "regex"
version = "1.13.1"
features = []
default_features = true
handoff = "Regex/RegexSet and bytes::Regex, captures, find/replace helpers across policy source, HTTP, release metadata and repo-map."
apis = "Regex/RegexSet and bytes::Regex, captures, find/replace helpers across policy source, HTTP, release metadata and repo-map."
feature_use = "Default Unicode/performance features implement current user patterns and text behavior; parser consumers also enable them."
exposure = "Pattern parsing and shared regex-automata/syntax update boundaries; optimized unsafe engine code remains upstream. The graph is shared with fancy-regex/tree-sitter/OCI/NATS."
decision = "Retain. No exclusive closure; no Unicode/regex semantics reductions."

[[libraries]]
name = "rustyline"
version = "18.0.1"
features = []
default_features = false
handoff = "coord_operator.rs."
apis = "DefaultEditor, ExternalPrinter, ReadlineError and line/history methods in coord_operator.rs."
feature_use = "Defaults already disabled; no home-directory, file-history or custom-binding defaults."
exposure = "Local patch retains terminal ownership/cleanup and style behavior; Unix unsafe terminal code, nix and Unicode segmentation."
decision = "Retain. Terminal editing, signals and Unicode behavior would require disproportionate first-party platform maintenance."

[[libraries]]
name = "ring"
version = "0.17.14"
features = []
handoff = "Credential HMAC, digest and random primitives used by the proxy and TLS signer."
default_features = true
apis = "digest::{digest,Context,SHA256}, hmac::{Key,sign}, rand::{SystemRandom,SecureRandom} in credential_hmac.rs, credentials.rs, services.rs and hashes."
