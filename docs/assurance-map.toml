  "proxy/src/http.rs::resolve_and_connect_egress",
  "proxy/src/test_context.rs::select_context",
]

[[decisions]]
id = "interception_tls"
inputs = "Host-selected combined CA PEM file, admitted CONNECT destination host, client SNI and current time."
authority = "The host CLI selects the existing mitmproxy CA file. The admitted CONNECT destination fixes the leaf name; the external_effects row maps the caller in http.rs::forward."
checks = "CA import checks certificate authority status, signing use and key match. Leaf issuance checks the destination and CA validity, bounds leaf validity, and rejects a different client SNI."
effects = "Read existing CA material, sign a destination leaf, construct a rustls server configuration and accept an intercepted TLS connection."
failure = "Missing or invalid CA fails startup. Invalid destination, expired CA or mismatched SNI fails the intercepted connection without creating a replacement root."
tests = ["proxy/tests/tls.rs", "proxy/tests/transport.rs", "cli/tests/test_rust_proxy.py", "tests/proxy_contracts/test_https_contract.py", "tests/proxy_contracts/test_https_trust_continuity.py", "tests/blackbox/installed_lifecycle.py", "tests/blackbox/installed_state_transition.py"]
symbols = [
  "cli/src/safeyolo/rust_proxy.py::_default_native_config",
  "proxy/src/lib.rs::Runtime::load",
  "proxy/src/tls.rs::CertificateAuthority::load",
  "proxy/src/tls.rs::CertificateAuthority::from_pem",
  "proxy/src/tls.rs::CertificateAuthority::server_config",
  "proxy/src/tls.rs::CertificateAuthority::issue",
  "proxy/src/tls.rs::resolve",
]

[[decisions]]
id = "credentials"
inputs = "Agent headers and gateway token are untrusted. The operator vault, service catalogue, policy and grant store supply credential authority."
authority = "Gateway token binding and route/contract/risk checks select a service capability. Authenticated services select a vaulted credential; an agent cannot select an arbitrary vault entry."
checks = "The guard fingerprints detected incoming credentials. An authenticated service replaces one authorized header and checks the outbound header again. A service without auth still needs gateway selection and does not read the vault. OAuth refresh uses its stored endpoint and a separate guarded outbound path."
effects = "Vault file reads/writes for authenticated services, authorized header injection, OAuth refresh POST and admitted request delivery."
failure = "Missing required binding, denied risk grant or failed injection stops delivery. An unavailable vault stops authenticated delivery. Routine audit uses fingerprints; stored raw HTTP flow bodies and headers remain operator-accessible evidence."
tests = ["proxy/tests/credential_guard.rs", "proxy/tests/gateway_workflow.rs", "tests/proxy_contracts/test_gateway_scope.py", "tests/proxy_contracts/test_guard_approval_audit.py", "tests/blackbox/installed_access.py", "tests/blackbox/installed_state_transition.py"]
symbols = [
  "proxy/src/credentials.rs::unlock",
  "proxy/src/credentials.rs::expose_secret",
  "proxy/src/credential_injection.rs::prepare",
  "proxy/src/credential_injection.rs::apply",
  "proxy/src/credential_guard.rs::enforce_ordered",
  "proxy/src/credential_guard.rs::evaluate",
  "proxy/src/services.rs::select",
  "proxy/src/grants.rs::check_grant",
  "proxy/src/http.rs::execute_refresh",
]

[[decisions]]
id = "provider_services"
inputs = "Agent gateway request, operator service definition and policy binding, configured same-name sandbox agent and its stable ID, and provider guest port. Request headers are untrusted."
authority = "The service registry and policy select the provider route only for a configured same-name agent. Gateway selection and the configured agent ID precede the stream opened by the mapped http.rs::forward and http.rs::open_outbound functions. The native platform code opens a runsc or SSH/socat stream to the selected guest port."
checks = "A provider host cannot pass through the gateway or use opaque CONNECT. The proxy removes agent-supplied identity headers and inserts the configured ID and name. A service without auth needs no vault credential. Native provider_stream::open validates the name and port. host_platform checks the running sandbox and opens its platform stream."
effects = "An authorized provider request starts the platform transport command and forwards bytes to the sandbox guest port. Traffic evidence records the provider route rather than an ordinary origin connection."
failure = "A denied gateway request, missing configured ID, unavailable platform transport, stopped sandbox or closed guest port fails locally. A provider route does not fall back to origin DNS or an existing outbound tunnel."
tests = ["tests/proxy_contracts/test_gateway_provider.py", "proxy/tests/gateway_workflow.rs"]
symbols = [
  "cli/src/safeyolo/commands/agent.py::authorize",
  "cli/src/safeyolo/rust_proxy.py::start",
  "proxy/src/admin_api/services.rs::authorize",
  "proxy/src/admin_api/services.rs::persist",
  "proxy/src/services.rs::GatewaySnapshot::provider_for_host",
  "proxy/src/services.rs::GatewaySnapshot::configured_agent_id",
  "proxy/src/provider_stream.rs::open",
  "proxy/src/host_platform.rs::open_guest_port",
  "proxy/src/host_platform.rs::is_sandbox_running",
]

[[decisions]]
id = "management_evidence"
inputs = "Host-local Admin API bearer and UDS Agent API bearer, route parameters, flow IDs and evidence-owner identity."
authority = "Operator token controls Admin routes. Agent token plus trusted listener identity controls Agent routes and owner-scoped flow access."
checks = "Admin binds 127.0.0.1 and compares bearer bytes in constant time. Agent API remains local for the reserved host; direct flow reads enforce evidence owner."
effects = "Policy and mode mutation, audit JSONL, SQLite flow storage, authorized raw body reads, terminal export and event stream."
failure = "Failed authentication and cross-owner flow access return local errors. Raw flow evidence can contain credentials; it is intentionally distinct from routine redacted audit events."
tests = ["proxy/tests/operator_controls.rs", "proxy/tests/agent_api_flows.rs", "proxy/tests/flow_store_details.rs", "tests/blackbox/installed_access.py", "tests/blackbox/isolation/installed_access.py", "tests/blackbox/installed_state_transition.py"]
