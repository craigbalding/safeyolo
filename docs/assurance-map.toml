[[decisions]]
id = "interception_tls"
inputs = "Host-selected combined CA PEM file, admitted CONNECT destination host, client SNI and current time."
authority = "The host CLI selects the existing mitmproxy CA file. The admitted CONNECT destination fixes the leaf name; the external_effects row maps the caller in http.rs::forward."
checks = "CA import checks certificate authority status, signing use and key match. Leaf issuance checks the destination and CA validity, bounds leaf validity, and rejects a different client SNI."
effects = "Read existing CA material, sign a destination leaf, construct a rustls server configuration and accept an intercepted TLS connection."
failure = "Missing or invalid CA fails startup. Invalid destination, expired CA or mismatched SNI fails the intercepted connection without creating a replacement root."
