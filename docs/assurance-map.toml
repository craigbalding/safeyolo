[[decisions]]
id = "policy_publication"
inputs = "Operator policy TOML, addon/catalogue files, granted approvals and process-local task registration."
authority = "Only host Admin mutations write the durable policy/grant state. A task registration changes process state only after explicit activation."
checks = "Compile and observe a candidate before atomic snapshot publication; locked read-modify-write protects durable edits. Once grants reserve before use and consume after a successful response."
effects = "Policy and grant file writes, runtime snapshot swap, audit events and task overlay publication."
failure = "Rejected load retains the prior accepted snapshot. A persistence failure prevents a successful grant completion. Process replacement clears task registration."
tests = ["proxy/tests/policy.rs", "proxy/tests/state_policy_transition.rs", "tests/proxy_contracts/test_agent_api_policy.py", "tests/blackbox/installed_lifecycle.py", "tests/blackbox/installed_state_transition.py"]
