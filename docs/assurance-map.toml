# One maintained source map for the first Rust proxy release. The source
# identifiers below are checked against parsed definitions on every run.
# Paths are relative to the repository root; symbol names follow "::".
baseline = "8ba22365616d83b8b8b18b87781f0e9b9ad1e439"
initial_review = "https://github.com/craigbalding/safeyolo/issues/838#issuecomment-5876216643"
native_inventory = "https://github.com/craigbalding/safeyolo/issues/621#issuecomment-5801132524"
patch_review = "https://github.com/craigbalding/safeyolo/issues/636#issuecomment-5736479281"

# Cargo.toml and Cargo.lock are hashed by the checker. The direct production
# library rows record API use, feature reasons, exposure and ownership decisions.
# tools/assurance/rust_dependencies.py measures their target-specific closures.
[[libraries]]
name = "async-nats"
version = "0.47.0"
features = ["jetstream", "ring", "nuid", "server_2_10", "server_2_11", "server_2_12"]
handoff = "Loopback coordination client and JetStream persistence."
default_features = false
apis = "ConnectOptions::{new,user_and_password,connect}, Client::{connection_state,request,publish}, HeaderMap; jetstream Context, stream Config/StorageType and pull consumers in agent_api/coord.rs and coord_rooms.rs."
feature_use = "JetStream provides durable rooms; ring keeps the existing TLS provider; nuid preserves inbox generation; server_2_10/11/12 preserve current stream/message fields. Disable unused nkeys, websockets, service, kv, object-store and crypto."
exposure = "Unchecked UTF-8 in header/subject internals; TLS/native roots and proc-macro serialization remain shared. Remove the exclusive NKey signing/Ed25519 and WebSocket/root-certificate branches. No local patch."
decision = "Reduce features. Owning NATS reconnect, acknowledgments, sequence/deduplication, retention and failure semantics would be disproportionate."


[[libraries]]
name = "base64"
version = "0.23.1"
features = []
default_features = true
handoff = "credentials.rs, native_client.rs, traffic exports and http_content.rs."
apis = "Engine::{encode,decode,decode_slice}, general_purpose::{STANDARD,URL_SAFE_NO_PAD,GeneralPurpose}, alphabet/config in credentials.rs, native_client.rs, traffic exports and http_content.rs."
feature_use = "std/alloc for owned strings and bytes; scalar GeneralPurpose engines only. simd-unsafe remains enabled by pem/reqwest defaults even after disabling the direct default."
exposure = "Unsafe optimized implementations and two resolved base64 versions. Both versions remain through other production callers; no build script."
decision = "Retain. Feature knockout saves nothing; shared primitive replacement or local codec would remove no package and would add malformed-input/padding semantics."

[[libraries]]
name = "brotli-decompressor"
version = "5.0.3"
features = []
default_features = true
handoff = "http_content.rs."
apis = "BrotliDecompressStream, BrotliResult, BrotliState and StandardAlloc in http_content.rs."
feature_use = "Default std allocator supports incremental bounded body decompression."
exposure = "Unsafe decoder/allocation internals; alloc-stdlib and alloc-no-stdlib are exclusive. No native build."
decision = "Retain. Adversarial compression format and streaming limits make absorption disproportionate."

[[libraries]]
name = "bzip2"
version = "0.6.1"
features = []
default_features = true
handoff = "http_content.rs."
apis = "Decompress::{new,decompress,total_in,total_out}, Status and Error in http_content.rs."
feature_use = "Default selects the maintained Rust libbz2 implementation for incremental/concatenated streams."
exposure = "Unsafe FFI-shaped wrapper over exclusive libbz2-rs-sys; this selected backend has no C compilation."
decision = "Retain. Compression corruption, concatenation and output-limit semantics belong upstream."

[[libraries]]
name = "bytes"
version = "1.12.1"
features = []
default_features = true
handoff = "bodies, flow recording and guest acquisition."
apis = "Bytes::{new,from,from_static,from_owner,copy_from_slice} and slices in bodies, flow recording and guest acquisition."
feature_use = "std and transitive serde; from_owner retains zeroizing owners without copying."
exposure = "Unsafe reference counting, owner erasure and buffer manipulation; shared throughout HTTP/NATS/OCI."
decision = "Retain. No exclusive closure; a Vec replacement would lose shared ownership/zeroizing-owner behavior or require parallel machinery."

[[libraries]]
name = "encoding_rs"
version = "0.8.41"
features = []
default_features = true
handoff = "http_content.rs."
apis = "Encoding::{for_label,new_decoder_without_bom_handling}, decoder decode_to_string variants and DecoderResult in http_content.rs."
feature_use = "Default alloc for decoded text; encoding labels/BOM handling remain required."
exposure = "Unsafe SIMD/encoding internals, build script, multiversion_no_op and rustversion proc macros; generated mapping tables."
decision = "Retain. Browser encoding tables and malformed byte semantics are specification-heavy."

[[libraries]]
name = "fernet"
version = "0.2.2"
features = ["rustcrypto"]
handoff = "Vault secret encryption and decryption using the existing Fernet format."
default_features = false
apis = "Fernet::{new,encrypt,decrypt} in credentials.rs."
feature_use = "Explicit rustcrypto avoids OpenSSL. Remove fernet_danger_timestamps: no current producer or test calls the optional encrypt_at_time/decrypt_at_time helpers; ordinary encrypt/decrypt retain their system-time implementation."
exposure = "Cryptographic protocol; RustCrypto AES/CBC/HMAC and zeroize derive boundary. No local patch."
decision = "Reduce unused timestamp API feature; retain the cryptographic implementation. A small call site does not justify owning authenticated encryption or secret handling."


[[libraries]]
name = "fancy-regex"
version = "0.19.2"
features = []
handoff = "Credential and content pattern inspection; local patch in proxy/vendor/fancy-regex."
default_features = true
apis = "Regex/RegexBuilder/RegexInput, captures, fallible iteration and cancellation/error variants in inspection.rs and policy regex helpers."
feature_use = "Default std, Unicode, performance and variable-lookbehind behavior implement current policy/inspection semantics."
exposure = "Accepted local patch: allocation/cancellation and Python backreferences; generated lowercase data with retained provenance. regex-automata shared."
decision = "Retain. Reuse #636 provenance/regressions; no regex-engine absorption or feature semantics change."


[[libraries]]
name = "flate2"
version = "1.1.10"
features = ["zlib-rs"]
default_features = false
handoff = "http_content.rs and websocket_relay/compression.rs."
apis = "Decompress/Compress, FlushDecompress/FlushCompress, Status and read::MultiGzDecoder in http_content.rs and websocket_relay/compression.rs."
feature_use = "Defaults disabled; zlib-rs is the selected Rust codec. Both HTTP and per-message WebSocket compression use streaming state."
exposure = "Unsafe codec implementation boundary; zlib-rs exclusive, no system zlib/C selection."
decision = "Retain. Streaming compression, truncation and flush semantics are not bounded glue."

[[libraries]]
name = "h2"
version = "0.4.19"
features = []
handoff = "HTTP/2 flow control and cancellation; local patch in proxy/vendor/h2."
default_features = true
apis = "ext::OriginalHeaderFields, StreamParseErrorObserver, StreamId, Error and Reason in HTTP completion/capture paths."
feature_use = "No explicit features; shared Hyper HTTP/2 path stays enabled."
exposure = "Accepted local patch, unchecked UTF-8 header internals, shared Tokio/bytes/tracing. HPACK and connection state remain upstream."
decision = "Retain. #636 validation/provenance unchanged; protocol replacement is disproportionate."


[[libraries]]
name = "http-body-util"
version = "0.1.5"
features = []
default_features = true
handoff = "BodyExt::{collect,boxed,frame}, Full, Empty, Limited and combinators::BoxBody across HTTP/admin/native client paths."
apis = "BodyExt::{collect,boxed,frame}, Full, Empty, Limited and combinators::BoxBody across HTTP/admin/native client paths."
feature_use = "Empty default plus shared byte buffers; body size limits and trailers require the maintained combinators."
exposure = "Unsafe pin/projection implementation; dependencies shared with Hyper."
decision = "Retain. Removing the direct edge saves no package; absorbing combinators adds cancellation/stream ownership obligations."

[[libraries]]
name = "hyper"
version = "1.11.1"
features = ["client", "server", "http1", "http2"]
handoff = "Agent/admin HTTP parsing, origin client and CONNECT framing; local patch in proxy/vendor/hyper."
default_features = true
apis = "Request/Response/Method/Uri/HeaderMap, Incoming; client/server conn http1/http2, upgrade and patched extensions in http.rs/native_client.rs."
feature_use = "client+server and http1+http2 are all actual production callers."
exposure = "Accepted local patch; unsafe parser/buffer internals; HTTP date crate is the only exclusive package on direct-edge removal."
decision = "Retain. HTTP admission, framing, completion and upgrade state machines must stay with the maintained implementation."


[[libraries]]
name = "hyper-util"
version = "0.1.20"
features = ["tokio"]
default_features = true
handoff = "native_client.rs, http.rs and connections."
apis = "rt::{TokioIo,TokioExecutor} in native_client.rs, http.rs and connections."
feature_use = "Explicit tokio adapter; client-legacy/client-proxy/http1 also activated by reqwest through OCI."
exposure = "Unsafe adapter/proxy internals; all packages shared."
decision = "Retain. A local IO adapter removes no crate because OCI retains hyper-util; avoid duplicating unsafe pin/IO glue."

[[libraries]]
name = "indexmap"
version = "2.14.2"
features = []
default_features = true
handoff = "policy/circuits/traffic."
apis = "IndexMap constructors, ordered iteration, entry, shift_remove and indexing in policy/circuits/traffic."
feature_use = "Default std; stable insertion order is observable in policy and JSON."
exposure = "Unsafe hash-table internals delegated to shared hashbrown; no unique removal closure."
decision = "Retain. BTreeMap changes ordering; Vec/map combinations add ownership code without removing shared packages."

[[libraries]]
name = "libc"
version = "0.2.189"
features = []
default_features = true
handoff = "host_platform.rs, linux_host and fd acceptance."
apis = "Unix descriptors/flags, flock/fcntl/kill/getuid, process/terminal calls; macOS sysctl/proc_pidinfo and platform constants in host_platform.rs, linux_host and fd acceptance."
feature_use = "Default std; extra_traits is unified transitively. Both Linux and macOS source uses remain."
exposure = "Raw unsafe operating-system ABI/FFI definitions and a build script; cfg-specific declarations."
decision = "Retain. Handwritten platform constants/layouts would add ABI risk and remove no shared package."

[[libraries]]
name = "memmap2"
version = "0.9.11"
features = []
handoff = "Read-only mapping of completed WebSocket spill files for inspection."
default_features = true
apis = "MmapOptions::map and Linux Advice::Sequential in websocket.rs for completed spill files."
feature_use = "No optional feature. macOS omits advise while retaining read-only mapping."
exposure = "Explicit unsafe caller contract: owned completed files stay unchanged while mappings are inspected; platform mmap/unmap ownership."
decision = "Retain after knockout (one package). Estimated 50-100 lines plus platform/lifetime/error tests for local mapping; read_to_end changes resident allocation for large spills. Neither improves ownership."


[[libraries]]
name = "num-bigint"
version = "0.4.8"
features = []
default_features = true
handoff = "circuits/numeric.rs, policy.rs and test_context.rs."
apis = "BigInt/BigUint/Sign, parsing, conversions, arithmetic and comparisons in circuits/numeric.rs, policy.rs and test_context.rs."
feature_use = "Default std; Python-sized integer/numeric semantics are observable."
exposure = "Unsafe optimized arithmetic internals; ASN.1 dependencies already retain bigint/integer/traits."
decision = "Retain. Zero exclusive closure and substantial numeric edge behavior."

[[libraries]]
name = "oci-client"
version = "0.18.0"
features = ["rustls-tls-no-provider"]
default_features = false
handoff = "guest_acquisition.rs."
apis = "Client, Reference, RegistryAuth, ClientConfig/Certificate, pull_manifest and streamed pull_blob in guest_acquisition.rs."
feature_use = "Defaults disabled; rustls-tls-no-provider uses the selected Rustls provider. Streaming/content authentication are required."
exposure = "Largest exclusive branch: OCI models, reqwest/tower/chrono and procedural derives; adversarial registry responses, auth and digest contracts."
decision = "Retain. Replacing this with existing Hyper would move registry challenge/auth, redirects, media negotiation, streams and errors into first-party code; not a bounded absorption."

[[libraries]]
name = "pkcs8"
version = "0.10.2"
features = ["std"]
handoff = "In-memory wrapping of an existing RSA PKCS#1 key for the CA signer."
default_features = true
apis = "PrivateKeyInfo, AlgorithmIdentifierRef, ObjectIdentifier, der::{Encode,asn1::AnyRef} in tls.rs."
feature_use = "std DER encoding wraps PKCS#1 RSA input in memory; pem is no longer transitively activated by unused NKeys."
exposure = "ASN.1/PKCS security format; shared der/spki, no direct unsafe/native build."
decision = "Retain. Shared closure is zero; hand-encoding keys risks length/OID/key-format errors."


[[libraries]]
name = "percent-encoding"
version = "2.3.2"
