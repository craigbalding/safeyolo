[[decisions]]
id = "foreign_and_embedded"
inputs = "Host-owned file descriptors, completed WebSocket spill files and generated proxy/data tables."
authority = "Rust owns these descriptors and message buffers; the tables are checked-in build inputs. External proc-macro and transitive crate code comes from Cargo.lock."
checks = "Unsafe libc close/dup/poll/recv follows local descriptor ownership. StoredBytes maps only an immutable finished spill file and keeps the borrowed mapping inside inspection; the traffic-view filter calls through MessageContent. Changes to mapped bodies or selected unsafe operations trigger review."
effects = "Descriptor close and peer observation, memory-mapped WebSocket inspection and filtering, compiled credential/Unicode lookup tables."
failure = "Descriptor and mapping errors propagate to the local caller; traffic filtering reports a storage error. A missing embedded table or changed dependency/build input fails the build or appears in drift."
tests = ["proxy/tests/credential_guard.rs", "proxy/tests/websocket.rs", "proxy/tests/transport.rs"]
