  "proxy/src/tunnels.rs::relay",
]

[[decisions]]
id = "other_sinks_and_launch"
inputs = "Host CLI proxy configuration, packaged binary path, readiness marker, desktop presentation request and internal coordination credentials."
authority = "CLI selects the native binary and verifies its process/instance readiness. Native desktop_present::present selects an admitted agent and a host preview. NATS credentials stay in host data."
checks = "Startup has no silent Python fallback. Listener reload requires acknowledgement. Desktop presentation validates agent identity and the configured platform commands."
effects = "Proxy process spawn, NATS client connection, guest desktop command, native desktop preview listener and readiness publication."
failure = "A missing binary or readiness mismatch fails startup; unavailable NATS or presenter fails its own request without becoming arbitrary proxy egress."
tests = ["cli/tests/test_rust_proxy.py", "proxy/tests/desktop_native.rs", "proxy/tests/native_runtime_dependency.rs", "cli/tests/test_command_centre.py", "proxy/tests/coord_fixture.py", "tests/blackbox/installed_state_transition.py"]
