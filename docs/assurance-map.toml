handoff = "coord_timeline.rs and compact display."
apis = "UnicodeWidthChar::width and UnicodeWidthStr::width in coord_timeline.rs and compact display."
feature_use = "Default cjk tables preserve terminal widths; rustyline also retains the crate/default."
exposure = "Generated Unicode width tables, no build script or proc macro."
decision = "Retain. Zero closure; ASCII approximations degrade current terminal output."

[[libraries]]
name = "x509-parser"
version = "0.18.1"
features = []
handoff = "Interception CA constraints, key-usage and validity parsing."
default_features = true
apis = "parse_x509_certificate, GeneralName, validity/basic_constraints/key_usage/public-key access in tls.rs and tls_observation.rs."
feature_use = "Transitive verify+ring from rcgen; current CA/key checks and certificate observations use parsed fields."
exposure = "Adversarial ASN.1/X.509 parser plus derive/proc-macro boundaries and shared ring verification."
decision = "Retain. Zero closure; certificate parsing/verification must remain maintained upstream."


[[libraries]]
name = "yaml-rust2"
version = "0.13.0"
features = []
default_features = false
handoff = "policy/source.rs."
apis = "parser::{Parser,Event,Tag}, scanner::TScalarStyle and event loading in policy/source.rs."
feature_use = "Defaults already disabled; input events preserve explicit scalar/collection semantics."
exposure = "Pure Rust YAML scanner/parser and exclusive hashlink/arraydeque tables; malformed/recursive input behavior."
decision = "Retain. YAML grammar, aliases, tags and scalar styles are not a bounded local parser."

[[libraries]]
name = "zeroize"
version = "1.9.0"
features = []
handoff = "Secret and retained WebSocket buffer clearing on drop."
default_features = true
apis = "Zeroize, Zeroizing for secrets, headers, buffers and owning Bytes across credentials, inspection and WebSocket paths."
feature_use = "Default alloc; zeroize_derive is transitively selected by Fernet."
exposure = "Unsafe volatile writes/compiler fences; derive is a separate proc-macro boundary."
decision = "Retain. Required secret-clearing guarantee; shared crypto packages remain."


[[libraries]]
name = "zstd"
version = "0.14.3"
features = []
default_features = false
handoff = "http_content.rs, guest archive handling and CLI packaging."
apis = "stream::raw::{Decoder,Operation}, stream::read::Decoder and streaming encoders in http_content.rs, guest archive handling and CLI packaging."
feature_use = "Defaults already disabled; raw/std stream APIs still use the native codec."
exposure = "Unsafe FFI into zstd-sys, bundled native C/build script and cc/jobserver boundary."
decision = "Retain. Streaming decompression, frame/truncation checks and bounded output must remain maintained upstream."
[[decisions]]
id = "identity"
inputs = "Operator listener configuration supplies agent_id, socket_path and source_id. Accepted HTTP bytes and declaration fields are untrusted."
authority = "The host CLI creates and mounts the per-agent UDS path. The Rust listener fixes agent identity and source_id at accept."
checks = "Network guard, credential guard and scoped API routes consume the accepted listener owner. Request claims and retired map files cannot select it. The proxy does not use SO_PEERCRED; socket provisioning is the ingress boundary."
effects = "UDS accept, attributed request routing and per-agent evidence ownership."
failure = "Agent-scoped routes reject missing identity. Global network policy still applies to ownerless traffic, which cannot create an agent-owned flow row. Readiness is withheld on invalid startup configuration."
tests = ["proxy/tests/transport.rs", "proxy/src/http/agent_audit_tests.rs", "proxy/tests/agent_api_agents.rs", "proxy/tests/native_host_cli.rs", "tests/blackbox/installed_ingress.py", "tests/blackbox/installed_lifecycle.py"]
