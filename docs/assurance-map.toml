# One maintained source map for the first Rust proxy release. The source
# identifiers below are checked against parsed definitions on every run.
# Paths are relative to the repository root; symbol names follow "::".
baseline = "8ba22365616d83b8b8b18b87781f0e9b9ad1e439"
initial_review = "https://github.com/craigbalding/safeyolo/issues/838#issuecomment-5876216643"
native_inventory = "https://github.com/craigbalding/safeyolo/issues/621#issuecomment-5801132524"
patch_review = "https://github.com/craigbalding/safeyolo/issues/636#issuecomment-5736479281"

# Cargo.toml and Cargo.lock are hashed by the checker. These selected direct
# library handoffs explain critical work delegated by the mapped decisions.
[[libraries]]
name = "hyper"
version = "1.11"
features = ["client", "server", "http1", "http2"]
handoff = "Agent/admin HTTP parsing, origin client and CONNECT framing; local patch in proxy/vendor/hyper."

[[libraries]]
name = "h2"
version = "0.4.19"
features = []
handoff = "HTTP/2 flow control and cancellation; local patch in proxy/vendor/h2."

[[libraries]]
name = "rustls"
version = "0.23.45"
features = ["ring", "std", "tls12"]
handoff = "Origin and interception TLS verification and handshakes."

[[libraries]]
name = "rustls-pemfile"
version = "2.2.0"
features = []
handoff = "PEM certificate and private-key item parsing for the existing interception CA."

[[libraries]]
name = "x509-parser"
version = "0.18.1"
features = []
handoff = "Interception CA constraints, key-usage and validity parsing."

[[libraries]]
name = "rcgen"
version = "0.14.10"
features = ["ring", "pem", "x509-parser"]
handoff = "Destination leaf key generation and certificate signing under the imported CA."

[[libraries]]
name = "pkcs8"
version = "0.10.2"
features = ["std"]
handoff = "In-memory wrapping of an existing RSA PKCS#1 key for the CA signer."

[[libraries]]
name = "ring"
version = "0.17.14"
features = []
handoff = "Credential HMAC, digest and random primitives used by the proxy and TLS signer."

[[libraries]]
name = "fernet"
version = "0.2.2"
features = ["rustcrypto", "fernet_danger_timestamps"]
handoff = "Vault secret encryption and decryption using the existing Fernet format."

[[libraries]]
name = "subtle"
version = "2.6.1"
features = []
handoff = "Constant-time equality for Admin API bearer authentication."

[[libraries]]
name = "zeroize"
version = "1.9.0"
features = []
handoff = "Secret and retained WebSocket buffer clearing on drop."

[[libraries]]
name = "tungstenite"
version = "0.30.0"
features = ["handshake"]
handoff = "WebSocket handshake validation and frame header parsing."

[[libraries]]
name = "memmap2"
version = "0.9.11"
features = []
handoff = "Read-only mapping of completed WebSocket spill files for inspection."

[[libraries]]
name = "rusqlite"
version = "0.40.2"
features = ["bundled"]
handoff = "Stored flow bodies and indexed evidence reads."

[[libraries]]
name = "fancy-regex"
version = "0.19.2"
features = []
handoff = "Credential and content pattern inspection; local patch in proxy/vendor/fancy-regex."

[[libraries]]
name = "async-nats"
version = "0.42"
features = []
handoff = "Loopback coordination client and JetStream persistence."

[[libraries]]
name = "tokio"
version = "1.53.1"
features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]
handoff = "The provider stream uses async process spawn and bidirectional pipes. Cargo.toml enables the process feature for this route."

[[decisions]]
id = "identity"
inputs = "Operator listener configuration supplies agent_id, socket_path and source_id. Accepted HTTP bytes and declaration fields are untrusted."
authority = "The host CLI creates and mounts the per-agent UDS path. The Rust listener fixes identity at accept; source_id and request context reconcile it."
checks = "A conflicting identity is rejected by reconciliation, network guard and credential guard. The proxy does not use SO_PEERCRED; socket provisioning is the ingress boundary."
effects = "UDS accept, attributed request routing and per-agent evidence ownership."
failure = "Missing or conflicting identity is rejected locally; readiness is withheld on invalid startup configuration."
tests = ["proxy/tests/transport.rs", "tests/proxy_contracts/test_agent_api_test_context.py", "cli/tests/test_rust_proxy.py", "tests/blackbox/installed_ingress.py", "tests/blackbox/installed_lifecycle.py"]
symbols = [
  "cli/src/safeyolo/sockets.py::directory_for",
  "cli/src/safeyolo/rust_proxy.py::_agent_listeners",
  "cli/src/safeyolo/rust_proxy.py::_sync_running_listeners",
  "proxy/src/lib.rs::accept_agents",
  "proxy/src/agent_discovery.rs::reconcile",
  "proxy/src/http.rs::serve_request",
]

[[decisions]]
id = "authorization"
inputs = "Untrusted destination, method, path and headers meet operator baseline/task policy, runtime modes and declared test context."
authority = "The compiled native policy_file and operator mode snapshot decide on the native request path."
checks = "Destination authority and admin/reserved host checks precede the PDP. Agent-specific rules, rate budgets, explicit bypasses and warn modes are evaluated before egress."
effects = "Allow, deny or approval response; rate charge; DNS and outbound socket only after applicable admission."
failure = "Malformed authority, identity conflict, policy load failure and denied requests do not open an origin socket. Configured warning/disabled modes are explicit exceptions."
tests = ["proxy/tests/network_guard.rs", "proxy/tests/policy.rs", "tests/proxy_contracts/test_native_network_policy.py"]
symbols = [
  "proxy/src/policy.rs::evaluate",
  "proxy/src/config.rs::validate",
  "proxy/src/network_guard.rs::enforce_with_audit_and_trace",
  "proxy/src/network_guard.rs::evaluate_policy",
  "proxy/src/admin_shield.rs::blocks_host",
  "proxy/src/admin_shield.rs::blocks_address",
  "proxy/src/http.rs::decide",
