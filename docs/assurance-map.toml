]

[[decisions]]
id = "external_effects"
inputs = "Admitted HTTP/CONNECT request, selected parent or provider route, tunnel bytes and response content."
authority = "Destination and policy admission in forward/open_egress_for_flow control origin DNS and socket creation. The operator configures parent CONNECT and provider service routes."
checks = "Reserved/admin targets and resolved addresses are filtered before direct dial. Inner HTTP and CONNECT require separate admission. Provider delivery also requires gateway selection as mapped in provider_services. Response inspection precedes applicable downstream delivery."
effects = "DNS lookup, direct or parent TCP connection, authorized provider stream, TLS, HTTP/WebSocket send, tunnel relay and response streaming."
failure = "No direct fallback from a failed parent or provider stream; opaque tunnels and passthrough have explicit inspection limits but retain network admission."
tests = ["proxy/tests/transport.rs", "proxy/tests/websocket.rs", "tests/proxy_contracts/test_tunnel_contract.py", "tests/blackbox/installed_workloads.py", "tests/blackbox/installed_lifecycle.py", "tests/blackbox/installed_state_transition.py"]
symbols = [
