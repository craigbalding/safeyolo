# Prose blacklist for user-facing docs.
#
# For the drift class where the code that used to defend a claim has been
# removed — nothing left to bind a `# DOC:` marker against, and no pinned
# value to extract. Only prose vigilance catches these; without a check,
# stale-mechanism claims survive for months (Docker era: 4 mo; PROXY-v2
# identity: 4 mo — both survived in SECURITY.md / README.md until this
# check was added).
#
# Each [[rule]] blocks a fixed set of phrases from appearing in a fixed
# set of docs. Use `reason` to record why the phrases are banned — it
# gets printed on failure so the reader knows why the check fired without
# having to git-archaeology the assertion.

[[rule]]
name = "no-docker-era-language"
docs = ["SECURITY.md", "README.md", "docs/ARCHITECTURE.md", "cli/README.md"]
reason = "Docker was removed in PR #130 (April 2026). SafeYolo now runs as a host mitmproxy process; sandboxes are Apple Virtualization.framework microVMs (macOS) or gVisor (Linux). There is no SafeYolo container and no Docker socket to gate."
forbidden = [
    "no Docker socket",
    "SafeYolo container",
    "control the Docker runtime",
    "The container runs as",
]

[[rule]]
name = "no-proxy-protocol-v2-identity-claim"
docs = ["README.md", "SECURITY.md", "docs/ARCHITECTURE.md"]
reason = "PR #201 (April 2026) replaced PROXY-protocol-v2 identity with per-agent Unix-domain-socket path-derived peername stamping. See cli/src/safeyolo/proxy_modes/unix_listener.py."
forbidden = [
    "PROXY protocol v2",
    "PROXY-protocol-v2",
]

# PR #195 unified the Linux rootfs to a directory tree at
# ~/.safeyolo/share/rootfs-tree/, dropping the earlier EROFS image
# output. build-rootfs.sh header spells this out. Guarantee the security
# verification doc does not describe the removed EROFS mechanism as
# current, and never asks the reader to sha256sum a file that no longer
# exists (rootfs-base.erofs).
[[rule]]
name = "no-erofs-in-security-verification"
docs = ["docs/security-verification.md", "docs/ARCHITECTURE.md"]
reason = "PR #195 replaced the Linux EROFS rootfs with a directory tree at ~/.safeyolo/share/rootfs-tree/. Any current-tense EROFS claim in this doc is stale; see guest/build-rootfs.sh header for the removal rationale."
forbidden = [
    "EROFS image",
    "EROFS rootfs",
    "rootfs-base.erofs",
]

# Skill references documenting contributor workflow must use `uv run
# pre-commit ...`, not raw `pre-commit ...`. Raw invocation silently skips
# hooks that shell to `uv run` internally (uv-lock-check,
# blackbox-coverage-doc, skill-graph-render) and they then fail on CI where
# uv is present. Convention is set in docs/DEVELOPERS.md.
#
# `\n`-prefix anchors the phrase to line-start, so `uv run pre-commit ...`
# does NOT match (the newline is followed by `u`, not `p`).
[[rule]]
name = "skill-must-use-uv-run-pre-commit"
docs = ["cli/src/safeyolo/agent_context/skills/safeyolo/references/contributing-to-safeyolo.md"]
reason = "Skill contributor guidance must invoke pre-commit via `uv run pre-commit ...` per docs/DEVELOPERS.md. Raw `pre-commit` silently skips uv-dependent hooks locally."
forbidden = [
    "\npre-commit install",
    "\npre-commit run",
]

# #1053 A retires the product qualifier. Keep this focused on the active
# onboarding, CLI and skill surfaces; implementation comparisons and historical
# evidence still need human review under docs/technical-writing.md.
[[rule]]
name = "one-safeyolo-product-name"
docs = [
    "README.md",
    "cli/README.md",
    "docs/installation.md",
    "docs/credentials.md",
    "docs/operator-guide.md",
    "docs/coord-operations.md",
    "docs/CONFIGURATION.md",
    "docs/factories.md",
    "docs/coord-mattermost.md",
    "docs/nested-linux-lab.md",
    "cli/src/safeyolo/agent_context/skills/readme-usability/references/safeyolo.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/coord.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/desktop.md",
    "proxy/src/bin/safeyolo.rs",
    "proxy/src/demo.rs",
    "proxy/src/lab.rs",
    "proxy/src/guest_acquisition.rs",
    "scripts/native_package.sh",
    "scripts/build_host_packages.sh",
]
reason = "#1053 retires the product qualifier. Use SafeYolo, proxy, installer, release or settings. Keep technical and historical distinctions explicit."
forbidden = [
    "native product", "Native product",
    "native release", "Native release",
    "native proxy", "Native proxy",
    "native installer", "Native installer",
    "native settings", "Native settings",
    "native CLI", "Native CLI",
    "native instance", "Native instance",
]
