# User-facing docs under drift protection.
#
# The four drift checks — check_skill_markers (DOC: markers),
# check_doc_cli_flags, check_doc_constants, check_doc_links — all read this
# list to decide what "in scope" means. Adding a doc here brings it under
# all four mechanisms at once.
#
# Explicit list, not a glob: prevents accidental coverage of design docs
# (docs/*-design.md, docs/FUTURE.md), scratch files at repo root, and
# already-covered generated docs (docs/blackbox-coverage.md is regenerated
# from source; see tests/blackbox/gen_docs.py).

user_facing_docs = [
