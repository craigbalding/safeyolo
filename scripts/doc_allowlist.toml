# Shipped documentation under drift protection.
#
# Two tiers reflect the two audiences:
#
# - `user_facing_docs`  → docs read by human operators/contributors and
#                          repository agents. Explicit list, no globs — prevents
#                          accidental coverage of design docs
#                          (docs/*-design.md, docs/FUTURE.md), scratch
#                          files at repo root, and already-covered
#                          generated docs (docs/blackbox-coverage.md is
#                          regenerated from source).
# - `skill_files`       → docs shipped INTO agent sandboxes as part of
#                          the safeyolo skill (SKILL.md + references/).
#                          Glob patterns allowed — new reference files
#                          get automatic coverage.
#
# Both tiers are checked by the same content-scanning drift checks
# (`check_doc_links`, `check_doc_cli_flags`) and can be targeted by
# `# DOC:` markers and by rules in doc_forbidden.toml / doc_constants.toml.
# The audit_doc_coverage.py tool reports per-tier binding counts.

user_facing_docs = [
    "AGENTS.md",
    "CLAUDE.md",
    "README.md",
    "SECURITY.md",
    "guest/README.md",
    "cli/README.md",
    "contrib/README.md",
    "contrib/HOST_SCRIPT_GUIDE.md",
    "contrib/ROOTFS_SCRIPT_GUIDE.md",
    "docs/ARCHITECTURE.md",
    "docs/AGENTS.md",
    "docs/ADDONS.md",
    "docs/CONFIGURATION.md",
    "docs/DEVELOPERS.md",
    "docs/SERVICE_DISCOVERY.md",
    "docs/TLS_CERTIFICATE.md",
    "docs/agent-debugging.md",
    "docs/agent-lifecycle-identity-plan.md",
    "docs/agent-roles/independent-reviewer.md",
    "docs/agent-roles/issue-owner.md",
    "docs/coord-completion-notes.md",
    "docs/dispatch-generation.md",
    "docs/dispatch-publication.md",
    "docs/factory-proposals.md",
    "docs/factories.md",
    "docs/factories/backlog-coordinator.md",
    "docs/security-verification.md",
    "docs/technical-writing.md",
]

# Skill reference files shipped into agent sandboxes. Globs expanded at
# load time; new references/*.md files get automatic coverage.
skill_files = [
    "cli/src/safeyolo/agent_context/skills/safeyolo/SKILL.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/*.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/SKILL.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo-lab-controller/references/*.md",
]
