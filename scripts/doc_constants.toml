[[assertion]]
name = "seatbelt-optional-vz-read-class"
source = "contrib/macos-seatbelt-agent/agent-dev.sb"
pattern = '(?m)^; +\(extension-class "(?P<extension>com\.apple\.app-sandbox\.read)"'
docs = ["contrib/macos-seatbelt-agent/REFERENCE.md"]
must_contain = "`{extension}`"

[[assertion]]
name = "seatbelt-optional-vz-read-write-class"
source = "contrib/macos-seatbelt-agent/agent-dev.sb"
pattern = '(?m)^; +\(extension-class "(?P<extension>com\.apple\.app-sandbox\.read-write)"'
docs = ["contrib/macos-seatbelt-agent/REFERENCE.md"]
must_contain = "`{extension}`"

[[assertion]]
name = "installer-python-requirement"
source = "pyproject.toml"
pattern = 'requires-python = "(?P<requirement>[^"\n]+)"'
docs = ["cli/README.md"]
must_contain = "`{requirement}`"
