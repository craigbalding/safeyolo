# Constants-in-prose assertions for check_doc_constants.py.
#
# Each [[assertion]] extracts a value from source code with a named-capture
# regex, then requires the templated `must_contain` string to appear in each
# listed doc, AND requires none of the `forbidden` strings to appear.
#
# When adding an assertion: use the tightest regex you can (avoid greedy
# matches), name the capture groups, and prefer specific `must_contain`
# phrases over generic ones ("2048 MiB" beats "MiB").

[[assertion]]
name = "vm-proxy-admission"
source = "cli/src/safeyolo/guest-proxy-forwarder.sh"
pattern = 'max-children=(?P<maximum>\d+),backlog=(?P<backlog>\d+)'
docs = ["docs/microvm-architecture.md"]
must_contain = "{maximum} proxy connections"

[[assertion]]
name = "vm-proxy-admission-backlog"
source = "cli/src/safeyolo/guest-proxy-forwarder.sh"
pattern = 'max-children=\d+,backlog=(?P<backlog>\d+)'
docs = ["docs/microvm-architecture.md"]
must_contain = "configured to {backlog}"

[[assertion]]
name = "vm-shell-admission"
source = "vm/Sources/SafeYoloVM/VSockShellBridge.swift"
pattern = 'VSockConnectionLimit\(maximum: (?P<maximum>\d+)\)'
docs = ["docs/microvm-architecture.md"]
must_contain = "{maximum} shell connections"

[[assertion]]
name = "seatbelt-guide-operator-vm-ssh-key"
source = "cli/src/safeyolo/config.py"
pattern = 'return get_data_dir\(\) / "(?P<key_name>vm_ssh_key)"'
docs = ["contrib/macos-seatbelt-agent/REFERENCE.md"]
must_contain = "~/.safeyolo/data/{key_name}"

[[assertion]]
name = "rootfs-size-mb"
source = "guest/build-rootfs.sh"
pattern = 'ROOTFS_SIZE_MB="\$\{ROOTFS_SIZE_MB:-(?P<size_mb>\d+)\}"'
docs = ["guest/README.md"]
must_contain = "{size_mb} MiB"
forbidden = ["20% + 50MB headroom", "20%+50MB headroom"]

[[assertion]]
name = "default-agent-memory-mib"
source = "cli/src/safeyolo/commands/agent.py"
pattern = 'DEFAULT_AGENT_MEMORY_MB = (?P<memory_mb>\d+)'
docs = ["docs/CONFIGURATION.md"]
must_contain = "defaults to {memory_mb} MiB"

[[assertion]]
name = "coord-completion-trailer-size-kib"
source = "cli/src/safeyolo/coord/completion_notes.py"
pattern = 'MAX_TRAILER_BYTES = (?P<size_kib>\d+) \* 1024'
docs = [
    "docs/coord-completion-notes.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/completion-notes.md",
]
must_contain = "{size_kib} KiB"

[[assertion]]
name = "supervisor-canonical-message-size-kib"
source = "contrib/codex-coord-supervisor.py"
pattern = 'MAX_CANONICAL_BODY_BYTES = (?P<size_kib>\d+) \* 1024'
docs = ["docs/codex-coord-supervisor.md"]
must_contain = "{size_kib} KiB"

[[assertion]]
name = "factory-proposal-ledger-size-mib"
source = "cli/src/safeyolo/coord/factory_proposals.py"
pattern = 'MAX_LEDGER_BYTES = (?P<size_mib>\d+) \* 1024 \* 1024'
docs = ["docs/factory-proposals.md"]
must_contain = "{size_mib} MiB"

[[assertion]]
name = "factory-proposal-ledger-entry-count"
source = "cli/src/safeyolo/coord/factory_proposals.py"
pattern = 'MAX_PROPOSALS = (?P<count>\d+)'
docs = ["docs/factory-proposals.md"]
must_contain = "{count} proposals"

[[assertion]]
name = "factory-proposal-evidence-count"
source = "cli/src/safeyolo/coord/factory_proposals.py"
pattern = 'MAX_EVIDENCE = (?P<count>\d+)'
docs = ["docs/factory-proposals.md"]
must_contain = "{count} evidence"

[[assertion]]
name = "factory-proposal-fact-count"
source = "cli/src/safeyolo/coord/factory_proposals.py"
pattern = 'MAX_FACTS = (?P<count>\d+)'
docs = ["docs/factory-proposals.md"]
must_contain = "{count} facts"

[[assertion]]
name = "factory-proposal-ledger-name"
source = "cli/src/safeyolo/coord/factory_proposals.py"
pattern = 'return coord_data_dir\(\) / "(?P<name>factory-proposals\.json)"'
docs = [
    "docs/factory-proposals.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/factory-proposals.md",
]
must_contain = "{name}"

[[assertion]]
name = "coord-completion-candidate-count"
source = "cli/src/safeyolo/coord/completion_notes.py"
pattern = 'MAX_CANDIDATES = (?P<count>\d+)'
docs = [
    "docs/coord-completion-notes.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/completion-notes.md",
]
must_contain = "{count} candidates"

[[assertion]]
name = "coord-completion-evidence-count"
source = "cli/src/safeyolo/coord/completion_notes.py"
pattern = 'MAX_EVIDENCE = (?P<count>\d+)'
docs = [
    "docs/coord-completion-notes.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/completion-notes.md",
]
must_contain = "{count} evidence"

[[assertion]]
name = "coord-completion-trailer-marker"
source = "cli/src/safeyolo/coord/completion_notes.py"
pattern = 'TRAILER_START = "(?P<marker><<<SAFEYOLO_COMPLETION_NOTES_V\d+>>>)"'
docs = [
    "docs/coord-completion-notes.md",
    "cli/src/safeyolo/agent_context/skills/safeyolo/references/completion-notes.md",
]
must_contain = "{marker}"

[[assertion]]
name = "mise-version-pin"
source = "guest/build-rootfs.sh"
pattern = 'MISE_VERSION="\$\{MISE_VERSION:-(?P<mise_version>[0-9.]+)\}"'
docs = ["guest/README.md"]
# guest/README.md doesn't currently pin the mise version in prose — this
# assertion only requires the word "mise" appears somewhere. Kept as a
# sanity check that the tool is still mentioned; upgrade to full-version
# pinning when the doc quotes a specific version.
must_contain = "mise"

[[assertion]]
name = "gh-version-pin"
source = "guest/build-rootfs.sh"
pattern = 'GH_VERSION="\$\{GH_VERSION:-(?P<gh_version>[0-9.]+)\}"'
docs = ["guest/README.md"]
must_contain = "gh"

[[assertion]]
name = "attribution-cidr-linux"
source = "cli/src/safeyolo/platform/linux.py"
pattern = 'attribution_ip = f"10\.200\.'
docs = ["SECURITY.md"]
must_contain = "synthetic loopback"

[[assertion]]
name = "admin-api-bind"
source = "cli/src/safeyolo/mitm_addons/admin_api.py"
pattern = 'HTTPServer\(\("127\.0\.0\.1", port\)'
docs = ["SECURITY.md"]
# Either explicit IP or the equivalent English phrasing is acceptable —
# avoids spurious failure if a future rewrite prefers "loopback only".
must_contain_any = ["127.0.0.1", "loopback only", "localhost only"]
forbidden = ["binds to 0.0.0.0", "binds on all interfaces"]

# Note: "no-Docker-era-language" and "no-PROXY-v2-claim" rules moved to
# scripts/doc_forbidden.toml — those are prose-only blacklists with no
# source-code anchor to bind against, and belong in the first-class
# forbidden-phrase check rather than piggybacking on this file.

[[assertion]]
name = "credguard-scan-url-option-name"
source = "cli/src/safeyolo/mitm_addons/credential_guard.py"
pattern = 'loader\.add_option\("(?P<opt>credguard_scan_urls)"'
docs = ["SECURITY.md"]
must_contain = "{opt}"

[[assertion]]
name = "credguard-scan-body-option-name"
source = "cli/src/safeyolo/mitm_addons/credential_guard.py"
pattern = 'loader\.add_option\("(?P<opt>credguard_scan_bodies)"'
docs = ["SECURITY.md"]
must_contain = "{opt}"

[[assertion]]
name = "block-response-status-code"
# credential_guard's destination-mismatch response is the canonical
# example of the 428 "fail closed with actionable feedback" contract
# advertised in SECURITY.md.
source = "cli/src/safeyolo/mitm_addons/credential_guard.py"
pattern = 'Create (?P<code>428) response for destination mismatch'
docs = ["SECURITY.md"]
must_contain = "HTTP {code}"

[[assertion]]
name = "rootfs-tree-install-path"
source = "cli/src/safeyolo/vm.py"
pattern = 'return get_share_dir\(\) / "(?P<subdir>rootfs-tree)"'
docs = ["docs/ARCHITECTURE.md"]
must_contain = "share/{subdir}"

# Same code truth, different doc, tighter blacklist: security-verification.md
# is where a reader looks to VERIFY the artifact model, so guard both the
# positive claim (the current name must appear) and the negative claim
# (the pre-PR-#195 name must not).
[[assertion]]
name = "linux-rootfs-artifact-in-security-verification"
source = "cli/src/safeyolo/vm.py"
pattern = 'return get_share_dir\(\) / "(?P<subdir>rootfs-tree)"'
docs = ["docs/security-verification.md"]
must_contain = "{subdir}"
forbidden = ["rootfs-base.erofs"]

[[assertion]]
name = "guest-root-uid-mapping"
source = "cli/src/safeyolo/platform/linux.py"
pattern = '"0", "100000", "1000"'
docs = ["docs/security-verification.md", "docs/ARCHITECTURE.md"]
must_contain = "100000"

[[assertion]]
name = "seatbelt-agent-account"
source = "contrib/macos-seatbelt-agent/agent-shell-launcher.c"
pattern = '(?m)^#define AGENT_USER "(?P<account>[^"\n]+)"'
docs = ["contrib/macos-seatbelt-agent/README.md"]
must_contain = "`{account}`"

[[assertion]]
name = "seatbelt-entry-root"
source = "contrib/macos-seatbelt-agent/agent-shell-launcher.c"
pattern = '(?m)^#define ENTRY_ROOT "(?P<entry_root>[^"\n]+)"'
docs = ["contrib/macos-seatbelt-agent/README.md"]
must_contain = "{entry_root}"

[[assertion]]
name = "seatbelt-optional-vz-service"
source = "contrib/macos-seatbelt-agent/agent-dev.sb"
pattern = '(?m)^; +\(xpc-service-name "(?P<service>[^"\n]+)"'
docs = ["contrib/macos-seatbelt-agent/REFERENCE.md"]
must_contain = "`{service}`"

[[assertion]]
name = "seatbelt-optional-vz-fuse-class"
source = "contrib/macos-seatbelt-agent/agent-dev.sb"
pattern = '(?m)^; +\(extension-class "(?P<extension>com\.apple\.virtualization\.extension\.fuse)"'
docs = ["contrib/macos-seatbelt-agent/REFERENCE.md"]
