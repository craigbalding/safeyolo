[package]
name = "safeyolo-checker"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
embedded-io = "=0.7.1"
embedded-io-async = "=0.7.0"
nourl = "=0.1.5"
reqwless = { version = "=0.14.0", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "tls12"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "less-safe-getrandom-custom-or-rdrand"] }
getrandom = { version = "=0.2.17", features = ["custom"] }
webpki-roots = "=1.0.12"

[target.'cfg(target_os = "none")'.dependencies]
hyperlight-guest-bin = "=0.19.0"

[patch.crates-io]
ring = { path = "vendor/ring" }
reqwless = { path = "vendor/reqwless" }
