[package]
name = "safeyolo-hyperlight"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "../../LICENSE"

[dependencies]
cap-std = "4"
libc = "0.2"
hyperlight-unikraft = { version = "=0.21.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
hyperlight-host = { version = "=0.19.0", default-features = false, features = ["kvm"] }

[target.'cfg(target_os = "macos")'.dependencies]
hyperlight-host = { version = "=0.19.0", default-features = false, features = ["hvf"] }

[profile.dev]
debug = 0
