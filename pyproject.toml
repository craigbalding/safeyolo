# Python is used by repository tests and black-box instruments only.
[project]
name = "safeyolo-tests"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "argon2-cffi>=25.1.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "jinja2>=3.0",
    "markdown-it-py>=4.0.0",
    "yarl>=1.9.0",
    "pydantic>=2.10.0,<2.12",
    "cryptography>=50.0.0",
    "tomlkit>=0.12.0",
    "nats-py>=2.15,<3",
    "prompt-toolkit>=3.0,<4",
    "websockets>=16.1,<17",
    "brotlicffi>=1.2.0.2,<2",
    "zstandard>=0.25,<1",
    "pygments>=2.20,<3",

    "h2>=4.3,<5",
    "hypothesis>=6.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.9.4",
]
# SBOM generation
sbom = [
    "cyclonedx-bom>=5.1.0",
]

# Note: uv.lock includes hashes by default for supply-chain security

[tool.uv.workspace]
members = ["tests/blackbox/sinkhole"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests/reference", "."]
testpaths = ["tests", "cli/tests"]
markers = [
    "assurance_boundary: real subject/domain objects with autospecced boundary collaborators only",
]
# uds-networking/ holds standalone proof-of-concept runners (sys.exit at
# module top, not pytest tests). They're invoked directly by the VPS
# smoke-test scripts. Excluded from collection so pytest doesn't import
# them and trigger their top-level exits.
norecursedirs = ["uds-networking", "__pycache__", ".hypothesis"]

# Ruff config is in ruff.toml
