  "effect_model": {
    "sources": {
      "spec": {
        "location": "proxy/tests/fixtures/service-authoring/job.openapi.json",
        "version": "1.0.0"
      },
      "semantics": {
        "location": "proxy/tests/fixtures/service-authoring/job-semantics.md",
        "version": "1.0.0"
      },
      "enforcement-tests": {
        "location": "proxy/tests/service_authoring.rs",
        "version": "job-authoring-fixture-v1"
      }
    },
    "resources": {
      "job": {
        "description": "One stored job within a project. Both identity components must overlap.",
        "identity": [
          "project",
          "job"
        ]
      }
    },
    "effects": {
      "executable_changed": {
        "description": "A job executable definition can change. Replacement includes the default steps when steps are omitted.",
        "persists_after_access": true,
        "evidence": [
          "spec",
          "semantics"
        ]
      },
      "description_changed": {
        "description": "Stored descriptive text can change without changing executable steps.",
        "persists_after_access": true,
        "evidence": [
          "spec",
          "semantics"
        ]
      },
      "executed": {
        "description": "Stored job steps can run with the job runner account. External writes and a launched run can outlive access.",
        "persists_after_access": true,
        "evidence": [
          "spec",
          "semantics"
        ]
      },
      "previewed": {
        "description": "A preview can validate stored definition syntax without running steps in this controlled API.",
        "persists_after_access": false,
        "evidence": [
          "spec",
          "semantics"
        ]
      },
      "inspected": {
        "description": "Stored definition content can be read; a received copy cannot be revoked by access expiry.",
        "persists_after_access": true,
        "evidence": [
          "spec",
          "semantics"
        ]
      }
    },
    "enforcement": {
      "replace_scoped": {
        "capability": "replace_job",
        "operation": "replace_definition"
      },
      "edit_scoped": {
        "capability": "edit_job",
        "operation": "edit_definition"
      },
      "description_only": {
        "capability": "describe_job",
        "operation": "edit_definition"
      },
      "execute_scoped": {
        "capability": "execute_job",
        "operation": "execute_job"
      },
      "inspect_scoped": {
        "capability": "inspect_job",
        "operation": "inspect_definition"
      },
      "alias_scoped": {
        "capability": "execute_alias",
        "operation": "execute_alias"
      }
    },
    "rules": {
      "changed_job_execution": {
        "when": {
          "kind": "all_effects_same_scope",
          "resource": "job",
          "effects": [
            "executable_changed",
            "executed"
          ]
        },
        "prerequisites": [
          "Both accesses are available to the same actor.",
          "The chosen steps perform the stated action and the upstream runner can execute them."
        ],
        "consequence": "Changed executable steps can run with the configured job runner authority.",
        "explanation": "Any producer of executable_changed can combine with execution on the same project/job identity. Permission addition order does not remove that possibility.",
        "evidence": [
          "spec",
          "semantics"
        ],
        "gaps": [
          "This rule does not model all job-service state or every possible external consequence."
        ]
      }
    },
    "alternatives": {
      "inspect_stored_definition": {
        "steps": [
          {
            "operation": "inspect_definition",
            "enforcement": "inspect_scoped",
            "arguments": {
              "path.project": "demo",
              "path.job": "alpha"
            },
            "expected_effects": [
              "inspected"
            ]
          }
        ],
        "prerequisites": [
          "Use the modeled inspect_job capability with approved project/job path bindings."
        ],
        "unverified_prerequisites": [
          "The upstream job exists and the chosen provider credential can read its definition."
        ],
        "limitations": [
          "Can diagnose stored definition syntax and configuration only; it cannot verify runner connectivity or step execution.",
          "Definition content is disclosed to the caller and the copy can persist after access expiry.",
          "This is an offline reviewed alternative for the controlled fixture, not a verified Rundeck API recipe."
        ],
        "evidence": [
          "spec",
          "semantics"
        ]
      }
    },
