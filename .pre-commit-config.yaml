# Fast hooks mirror CI lint checks; the pre-push hook adds local CodeQL.
# Install: uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# Run manually: pre-commit run --all-files

default_install_hook_types: [pre-commit, pre-push]

repos:
  # Ruff - linting and import sorting (same as CI)
  # Keep version in sync with uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]

  # Python syntax check (same as CI py_compile step)
  - repo: local
    hooks:
      - id: python-syntax
        name: Python syntax check
        entry: python3 -m py_compile
        language: system
        types: [python]
        pass_filenames: true

  # uv lockfile check - ensures uv.lock matches pyproject.toml
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: blackbox-docstring-schema
        name: Blackbox docstring schema
        entry: uv run python tests/blackbox/_docstring_lint.py
        language: system
        files: ^tests/blackbox/.*\.py$
        pass_filenames: false

      - id: blackbox-coverage-doc
        name: Blackbox coverage doc in sync
        entry: uv run python tests/blackbox/gen_docs.py --check
        language: system
        files: ^(tests/blackbox/.*\.py|docs/blackbox-coverage\.md)$
        pass_filenames: false

      # If a source line carries a `# SKILL: <ref>` marker and it changes,
      # the referenced skill reference file must be in the same diff.
      # The script inspects `git diff --cached` itself, so pass_filenames is
      # false; always_run is true (cheap: no diff -> instant exit 0).
      - id: skill-marker-drift
        name: Skill marker / reference drift
        entry: python3 scripts/check_skill_markers.py
        language: system
        always_run: true
        pass_filenames: false

      - id: local-codeql
        name: Local CodeQL security and quality analysis
        entry: uv run python scripts/check_codeql.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in GitHub Actions
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^cli/src/safeyolo/templates/lists/
      - id: check-merge-conflict
      - id: detect-private-key
