# Fast hooks mirror CI lint checks; the pre-push hook adds local CodeQL.
# Install: uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# Run manually: pre-commit run --all-files

default_install_hook_types: [pre-commit, pre-push]

repos:
  # Ruff - linting and import sorting (same as CI)
  # Keep version in sync with uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]

  # Python syntax check (same as CI py_compile step)
  - repo: local
    hooks:
      - id: python-syntax
        name: Python syntax check
        entry: python3 -m py_compile
        language: system
        types: [python]
        pass_filenames: true

  # uv lockfile check - ensures uv.lock matches pyproject.toml
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: blackbox-docstring-schema
        name: Blackbox docstring schema
        entry: uv run python tests/blackbox/_docstring_lint.py
        language: system
        files: ^tests/blackbox/.*\.py$
        pass_filenames: false

      - id: blackbox-coverage-doc
        name: Blackbox coverage doc in sync
        entry: uv run python tests/blackbox/gen_docs.py --check
        language: system
        files: ^(tests/blackbox/.*\.py|docs/blackbox-coverage\.md)$
        pass_filenames: false

      - id: test-assurance
        name: Test assurance contracts
        entry: uv run python scripts/check_test_assurance.py
        language: system
        files: ^(tests/assurance\.toml|tests/.*\.py|cli/tests/.*\.py|scripts/check_test_assurance\.py)$
        pass_filenames: false

      # If a source line carries a `# SKILL: <ref>` or `# DOC: <path>` marker
      # and it is edited or removed, the referenced doc must be in the same
      # diff. Pure declarative additions of a marker are allowed. Handles
      # both marker types across .py and .sh sources. See
      # scripts/check_skill_markers.py for full semantics.
      - id: skill-marker-drift
        name: Skill / doc marker drift
        entry: python3 scripts/check_skill_markers.py
        language: system
        always_run: true
        pass_filenames: false

      # CLI-flag drift: user-facing docs cannot reference `safeyolo <cmd>`
      # invocations whose command or flag does not exist in the current
      # Typer surface. Complements the marker check by catching drift the
      # author never marked.
      - id: doc-cli-drift
        name: Doc CLI-flag drift
        entry: python3 scripts/check_doc_cli_flags.py
        language: system
        always_run: true
        pass_filenames: false

      # Constants drift: pinned values in source (rootfs size, mise/gh
      # versions, attribution CIDR, admin API bind, etc.) must match what
      # user-facing docs quote. Assertions live in scripts/doc_constants.toml.
      - id: doc-constants-drift
        name: Doc constants drift
        entry: python3 scripts/check_doc_constants.py
        language: system
        always_run: true
        pass_filenames: false

      # Blackbox cadence drift: scheduled full lanes and artifact publication
      # come from the workflow; marked docs may not claim hardware nightlies
      # that are only run manually by the acceptance harness/operator.
      - id: blackbox-cadence-drift
        name: Blackbox cadence docs in sync
        entry: python3 scripts/check_blackbox_cadence.py
        language: system
        always_run: true
        pass_filenames: false

      # Repo-relative link check on user-facing docs. External URLs are
      # skipped (would flake in CI); this catches moved/renamed files
      # being referenced by stale paths.
      - id: doc-links-drift
        name: Doc repo-relative link drift
        entry: python3 scripts/check_doc_links.py
        language: system
        always_run: true
        pass_filenames: false

      # Forbidden-phrase check. Catches the drift class where the code that
      # used to defend a claim was removed — no site left to mark, no value
      # to extract, only prose vigilance. See scripts/doc_forbidden.toml.
      - id: doc-forbidden-phrases
        name: Doc forbidden-phrase drift
        entry: python3 scripts/check_doc_forbidden.py
        language: system
        always_run: true
        pass_filenames: false

      # Agent API auth examples must pass the header on stdin. Expanding the
      # token inside curl -H/--header exposes it through process argv.
      - id: agent-token-argv
        name: Agent API token absent from process argv
        entry: python3 scripts/check_agent_token_argv.py
        language: system
        always_run: true
        pass_filenames: false

      # Triage-graph YAML is source of truth; the sibling .mmd is a mermaid
      # render regenerated by scripts/render_skill_graph.py. --check fails
      # if the rendered .mmd would differ from the YAML, so mermaid drift
      # cannot silently slip through.
      - id: skill-graph-render
        name: Skill triage graph render
        entry: uv run python scripts/render_skill_graph.py --check
        language: system
        files: ^cli/src/safeyolo/agent_context/skills/safeyolo/references/graph/.*\.(yaml|mmd)$
        pass_filenames: false

      - id: local-codeql
        name: Local CodeQL security and quality analysis
        entry: uv run python scripts/check_codeql.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in GitHub Actions
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^cli/src/safeyolo/templates/lists/
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^cli/tests/test_upstream_ca\.py$
